# Supabase pauses a free project after about a week with no API requests.
# This makes one cheap read every 3 days so the project never looks idle.
# The key is the public (publishable) anon key the app itself ships in
# js/cloud.js -- not a secret; Row Level Security does the access control.
# If the request fails (e.g. the project is already paused), the run fails
# and GitHub emails you.
#
# Note: GitHub turns off scheduled workflows in a repo with no commits for
# 60 days. If that happens, re-enable it from the Actions tab.
name: Keep Supabase awake

on:
  schedule:
    - cron: "17 3 */3 * *"   # 03:17 UTC every 3rd day
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: https://xfsaldtvvcuyondayjjw.supabase.co
      SUPABASE_ANON_KEY: sb_publishable_jDfjBu62WssP3fKEbbfVKw_ZyoxCXUm
    steps:
      - name: Query the database
        run: |
          status=$(curl -sS -o body.txt -w "%{http_code}" --retry 3 --retry-delay 20 --retry-all-errors \
            -H "apikey: $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/matches?select=id&limit=1")
          echo "HTTP $status"
          if [ "$status" != "200" ]; then cat body.txt; exit 1; fi
