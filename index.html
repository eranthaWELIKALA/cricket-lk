<body>
<div id="app"></div>
<div id="modal-root"></div>
<script>
/* ============================================================
   1. REFERENCE DATA
   ============================================================ */
const WICKET_LABELS = {
  bowled: "bowled", caught: "caught", lbw: "lbw",
  stumped: "stumped", hitwicket: "hit wicket", runout: "run out"
};

/* Optional player-profile details (supabase/008_player_details.sql). */
const BOWLING_TYPES = { fast: "Fast", medium: "Medium", "off-spin": "Off spin", "leg-spin": "Leg spin", orthodox: "Orthodox spin" };

/* Fixed MVP/MOTM point formula — not user-tunable in v1 (see README). */
const MVP_POINTS = {
  perRun: 1, perFour: 1, perSix: 2, fifty: 8, century: 16, notOut: 4,
  perWicket: 25, perMaiden: 8, perCatch: 8, perRunOut: 8
};

const DEFAULT_MATCH_PRESETS = [
  { id: "preset-t20", name: "T20 (6-ball overs)", ballsPerOver: 6, oversLimit: 20, playersPerSide: 11,
    wide: { enabled: true, runs: 1 }, noBall: { enabled: true, runs: 1 }, freeHitOnNoBall: true,
    requireFielderOnCatch: false, requireFielderOnRunout: false },
  { id: "preset-t10", name: "T10 (6-ball overs)", ballsPerOver: 6, oversLimit: 10, playersPerSide: 11,
    wide: { enabled: true, runs: 1 }, noBall: { enabled: true, runs: 1 }, freeHitOnNoBall: true,
    requireFielderOnCatch: false, requireFielderOnRunout: false },
  { id: "preset-tape5", name: "Tape-ball (5-ball overs)", ballsPerOver: 5, oversLimit: 8, playersPerSide: 7,
    wide: { enabled: true, runs: 1 }, noBall: { enabled: true, runs: 1 }, freeHitOnNoBall: true,
    requireFielderOnCatch: false, requireFielderOnRunout: false }
];

const DEFAULT_TOURNAMENT_PRESETS = [
  { id: "tpreset-standard", name: "Standard league (2/1/0, NRR)", matchPresetId: "preset-t20",
    pointsForWin: 2, pointsForTie: 1, pointsForLoss: 0, useNRR: true }
];

/* Curated background themes for the Settings screen's theme gallery.
   Each bundles the full :root palette (bg/panel/text/status colors) plus
   a default accent pair; applyTheme() (UI section) sets `vars` directly
   and runs `accent`/`accent2` through the existing applyAccentVars()
   derivation (rgb/dim/light/ink), same as a custom branding color does.
   A pre-existing custom branding accent (legacy state.branding data —
   no longer editable in the UI) always wins over a theme's own accent
   -- see applyTheme(). "midnight" matches the
   original hardcoded :root defaults exactly, so existing installs see
   no visual change until someone picks a different theme. */
const THEME_PRESETS = [
  { id: "midnight", name: "Midnight", accent: "#FFC247", accent2: "#33E29B", vars: {
    "--bg": "#050B0A", "--bg-2": "#0A1613",
    "--panel": "rgba(255,255,255,.05)", "--panel-2": "rgba(255,255,255,.07)", "--panel-solid": "#101E1B",
    "--line": "rgba(255,255,255,.10)", "--line-strong": "rgba(255,255,255,.20)",
    "--text": "#F4F8F6", "--muted": "#8FA9A0",
    "--danger": "#FF5D70", "--wicket": "#FF4D63", "--info": "#5FC7FF"
  } },
  { id: "slate", name: "Slate", accent: "#5FA8FF", accent2: "#B98CFF", vars: {
    "--bg": "#05070C", "--bg-2": "#0B1220",
    "--panel": "rgba(255,255,255,.05)", "--panel-2": "rgba(255,255,255,.07)", "--panel-solid": "#121A2A",
    "--line": "rgba(255,255,255,.10)", "--line-strong": "rgba(255,255,255,.20)",
    "--text": "#EEF2FA", "--muted": "#8C9AB8",
    "--danger": "#FF5D70", "--wicket": "#FF4D63", "--info": "#5FC7FF"
  } },
  { id: "daylight", name: "Daylight", accent: "#D98A2B", accent2: "#1E9E6C", vars: {
    "--bg": "#FBF8F2", "--bg-2": "#F1ECE0",
    "--panel": "rgba(10,20,20,.035)", "--panel-2": "rgba(10,20,20,.06)", "--panel-solid": "#FFFFFF",
    "--line": "rgba(10,20,20,.10)", "--line-strong": "rgba(10,20,20,.18)",
    "--text": "#1B2420", "--muted": "#5C6B63",
    "--danger": "#D6304A", "--wicket": "#D6304A", "--info": "#1178C4"
  } },
  { id: "sunset", name: "Sunset", accent: "#FF8A5B", accent2: "#FF4FA0", vars: {
    "--bg": "#12070D", "--bg-2": "#1B0E17",
    "--panel": "rgba(255,255,255,.05)", "--panel-2": "rgba(255,255,255,.07)", "--panel-solid": "#26121D",
    "--line": "rgba(255,255,255,.10)", "--line-strong": "rgba(255,255,255,.20)",
    "--text": "#FBF1F5", "--muted": "#B98CA0",
    "--danger": "#FF5D70", "--wicket": "#FF4D63", "--info": "#5FC7FF"
  } }
];

/* ============================================================
   2. ENGINE — pure functions, zero DOM access.
   ============================================================ */
function createInnings(battingTeam, bowlingTeam, target, playersPerSide, oversLimit, config){
  const cfg = config || {};
  return {
    battingTeam, bowlingTeam, target, oversLimit,
    ballsPerOver: cfg.ballsPerOver || 6,
    wideBaseRuns: cfg.wideRuns != null ? cfg.wideRuns : 1,
    noBallBaseRuns: cfg.noBallRuns != null ? cfg.noBallRuns : 1,
    freeHitOnNoBall: cfg.freeHitOnNoBall !== false,
    // playersPerSide/oversLimit may be null ("no limit"): null maxWickets
    // means the side can't be bowled out, null oversLimit means no overs
    // cap (the innings then ends on all out, the target, or endInnings()).
    // Last man stands: the side is only all out once every batter is out,
    // and the last one bats alone (see battingAlone()).
    lastManStands: !!cfg.lastManStands && playersPerSide != null,
    maxWickets: playersPerSide == null ? null : (cfg.lastManStands ? playersPerSide : playersPerSide - 1),
    runs: 0, wickets: 0, legalBalls: 0,
    extras: { wides: 0, noBalls: 0, byes: 0, legByes: 0 },
    freeHit: false,
    currentOverEvents: [],
    overs: [],
    batting: { order: [], stats: {} },
    bowling: { order: [], stats: {} },
    fielding: { order: [], stats: {} },
    striker: null, nonStriker: null, bowler: null, lastOverBowler: null,
    fallOfWickets: [],
    complete: false, completeReason: null
  };
}

function ensureBatsman(inn, name){
  if (!inn.batting.stats[name]){
    inn.batting.stats[name] = { runs: 0, balls: 0, fours: 0, sixes: 0, out: false, howOut: null };
    inn.batting.order.push(name);
  }
}

function ensureBowler(inn, name){
  if (!inn.bowling.stats[name]){
    inn.bowling.stats[name] = { legalBalls: 0, runs: 0, wickets: 0, maidens: 0, curOverRuns: 0, curOverLegal: 0 };
    inn.bowling.order.push(name);
  }
}

function ensureFielder(inn, name){
  if (!inn.fielding.stats[name]){
    inn.fielding.stats[name] = { catches: 0, runouts: 0 };
    inn.fielding.order.push(name);
  }
}

function oversDisplay(legalBalls, ballsPerOver){
  const bpo = ballsPerOver || 6;
  return `${Math.floor(legalBalls / bpo)}.${legalBalls % bpo}`;
}

function runRate(runs, legalBalls, ballsPerOver){
  const bpo = ballsPerOver || 6;
  return legalBalls > 0 ? (runs / (legalBalls / bpo)) : 0;
}

function requiredRunRate(inn){
  if (inn.target == null) return null;
  const bpo = inn.ballsPerOver || 6;
  if (inn.oversLimit == null) return null;
  const ballsLeft = inn.oversLimit * bpo - inn.legalBalls;
  if (ballsLeft <= 0) return null;
  const runsNeeded = inn.target - inn.runs;
  return runsNeeded / (ballsLeft / bpo);
}

function swapStrike(inn){
  const t = inn.striker; inn.striker = inn.nonStriker; inn.nonStriker = t;
}

/* Last man stands: one wicket short of all out, the remaining batter
   carries on with no partner. They always hold the striker slot and the
   non-striker slot stays null *without* asking for a new batsman. */
function battingAlone(inn){
  return !!inn.lastManStands && inn.maxWickets != null && inn.wickets === inn.maxWickets - 1;
}

function isAllOut(inn){
  return inn.maxWickets != null && inn.wickets >= inn.maxWickets;
}

function pendingBatsmanSlot(inn){
  if (inn.complete) return null;
  if (battingAlone(inn)) return inn.striker || inn.nonStriker ? null : "striker";
  if (!inn.striker) return "striker";
  if (!inn.nonStriker) return "nonStriker";
  return null;
}

function checkInningsComplete(inn){
  const bpo = inn.ballsPerOver || 6;
  if (inn.target != null && inn.runs >= inn.target){ inn.complete = true; inn.completeReason = "target"; }
  else if (isAllOut(inn)){ inn.complete = true; inn.completeReason = "allout"; }
  else if (inn.oversLimit != null && inn.legalBalls >= inn.oversLimit * bpo){ inn.complete = true; inn.completeReason = "overs"; }
}

/* event: { kind: 'run'|'wide'|'noball'|'bye'|'legbye'|'wicket',
            runs, wicketType, endComingIn, fielder }
   A wicket is always recorded as happening on a legal delivery — run-outs
   off a wide/no-ball are a known simplification, not modelled here.
   `fielder` is optional on wicketType 'caught'/'runout' and credits a
   fielding-side player with a catch/run-out for stats/MVP purposes. */
function recordBall(inn, event){
  const bat = inn.batting.stats;
  const bwl = inn.bowling.stats[inn.bowler];
  const legal = event.kind !== "wide" && event.kind !== "noball";
  let ballRuns = 0, display = "", rotate = false, outName;

  if (event.kind === "run"){
    ballRuns = event.runs;
    bat[inn.striker].runs += event.runs;
    bat[inn.striker].balls += 1;
    if (event.runs === 4) bat[inn.striker].fours += 1;
    if (event.runs === 6) bat[inn.striker].sixes += 1;
    rotate = event.runs % 2 === 1;
    display = String(event.runs);
  } else if (event.kind === "wide"){
    ballRuns = inn.wideBaseRuns + (event.runs || 0);
    inn.extras.wides += ballRuns;
    display = event.runs ? `Wd+${event.runs}` : "Wd";
  } else if (event.kind === "noball"){
    const off = event.runs || 0;
    ballRuns = inn.noBallBaseRuns + off;
    inn.extras.noBalls += inn.noBallBaseRuns;
    bat[inn.striker].balls += 1;
    if (off > 0){
      bat[inn.striker].runs += off;
      if (off === 4) bat[inn.striker].fours += 1;
      if (off === 6) bat[inn.striker].sixes += 1;
    }
    rotate = off % 2 === 1;
    display = off ? `Nb+${off}` : "Nb";
  } else if (event.kind === "bye" || event.kind === "legbye"){
    ballRuns = event.runs;
    if (event.kind === "bye") inn.extras.byes += ballRuns; else inn.extras.legByes += ballRuns;
    bat[inn.striker].balls += 1;
    rotate = ballRuns % 2 === 1;
    display = (event.kind === "bye" ? "B" : "Lb") + ballRuns;
  } else if (event.kind === "wicket"){
    if (event.wicketType === "runout"){
      ballRuns = event.runs || 0;
      bat[inn.striker].runs += ballRuns;
      bat[inn.striker].balls += 1;
      outName = inn[event.endComingIn];
      bat[outName].out = true;
      bat[outName].howOut = event.fielder ? `run out (${event.fielder})` : "run out";
      inn.wickets += 1;
      inn[event.endComingIn] = null;
      if (event.fielder){ ensureFielder(inn, event.fielder); inn.fielding.stats[event.fielder].runouts += 1; }
      display = ballRuns ? `${ballRuns}+Ro` : "Ro";
    } else {
      outName = inn.striker;
      bat[inn.striker].balls += 1;
      bat[inn.striker].out = true;
      bat[inn.striker].howOut = (event.wicketType === "caught" && event.fielder)
        ? `c ${event.fielder} b ${inn.bowler}`
        : `${WICKET_LABELS[event.wicketType]} b ${inn.bowler}`;
      bwl.wickets += 1;
      inn.wickets += 1;
      inn.striker = null;
      if (event.wicketType === "caught" && event.fielder){ ensureFielder(inn, event.fielder); inn.fielding.stats[event.fielder].catches += 1; }
      display = "W";
    }
  }

  inn.runs += ballRuns;
  if (legal){ inn.legalBalls += 1; bwl.legalBalls += 1; bwl.curOverLegal += 1; }
  if (event.kind !== "bye" && event.kind !== "legbye"){ bwl.runs += ballRuns; bwl.curOverRuns += ballRuns; }
  if (event.kind === "wicket"){
    // `balls` (legalBalls at the fall) is what the live-scoring screen's
    // partnership counter subtracts from the current legalBalls total --
    // `over` is only a display string, not reversible back into a count.
    inn.fallOfWickets.push({ score: inn.runs, wicket: inn.wickets, over: oversDisplay(inn.legalBalls, inn.ballsPerOver), balls: inn.legalBalls, batsman: outName });
  }

  // `runs` here is per-ball runs (bat + extras, whatever this event was
  // worth) -- the live-scoring screen's over-total sums this per row.
  inn.currentOverEvents.push({ display, isWicket: event.kind === "wicket", runs: ballRuns });

  if (legal) inn.freeHit = false;
  if (event.kind === "noball" && inn.freeHitOnNoBall) inn.freeHit = true;
  if (rotate) swapStrike(inn);

  checkInningsComplete(inn);

  const overCompleted = legal && inn.legalBalls % inn.ballsPerOver === 0;
  if (overCompleted){
    if (bwl.curOverRuns === 0) bwl.maidens += 1;
    inn.overs.push({ bowler: inn.bowler, events: inn.currentOverEvents });
    inn.currentOverEvents = [];
    bwl.curOverRuns = 0; bwl.curOverLegal = 0;
    if (!inn.complete){
      inn.lastOverBowler = inn.bowler;
      inn.bowler = null;
      swapStrike(inn);
    }
  }

  // Runs after both swaps (which stay unconditional): a lone last batter
  // always ends up back on strike, whichever slot the swaps left them in.
  if (battingAlone(inn) && !inn.complete){
    inn.striker = inn.striker || inn.nonStriker;
    inn.nonStriker = null;
  }
}

/* Closes the current innings by hand (declaration / time called) -- the
   only way an innings with no overs limit ends short of all out or the
   target. afterBall() then moves on exactly as after a completing ball. */
function endInnings(match){
  const inn = currentInnings(match);
  if (inn.complete) return;
  inn.complete = true;
  inn.completeReason = "closed";
  afterBall(match);
}

function createMatch({ teamA, teamB, oversLimit, playersPerSide, battingFirst, ballsPerOver, wideRuns, noBallRuns, wideEnabled, noBallEnabled, freeHitOnNoBall, lastManStands, requireFielderOnCatch, requireFielderOnRunout, presetId, presetName, tournamentId }){
  // null/undefined overs or players = no limit (see createInnings).
  oversLimit = oversLimit || null;
  playersPerSide = playersPerSide || null;
  const cfg = {
    ballsPerOver: ballsPerOver || 6,
    wideRuns: wideRuns != null ? wideRuns : 1,
    noBallRuns: noBallRuns != null ? noBallRuns : 1,
    freeHitOnNoBall: freeHitOnNoBall !== false,
    lastManStands: !!lastManStands && playersPerSide != null
  };
  return {
    teamA, teamB, oversLimit, playersPerSide, battingFirst,
    lastManStands: cfg.lastManStands,
    ballsPerOver: cfg.ballsPerOver,
    wideEnabled: wideEnabled !== false,
    noBallEnabled: noBallEnabled !== false,
    freeHitOnNoBall: cfg.freeHitOnNoBall,
    requireFielderOnCatch: !!requireFielderOnCatch,
    requireFielderOnRunout: !!requireFielderOnRunout,
    presetId: presetId || null,
    presetName: presetName || null,
    tournamentId: tournamentId || null,
    innings: [createInnings(battingFirst, battingFirst === "A" ? "B" : "A", null, playersPerSide, oversLimit, cfg)],
    status: "opening",
    result: null,
    motm: null
  };
}

function currentInnings(match){ return match.innings[match.innings.length - 1]; }

function teamName(match, key){ return key === "A" ? match.teamA : match.teamB; }

/* A match doesn't store rosters (names are typed freely), so a name's side
   is inferred from where it's already been used: batters belong to that
   innings' batting team, bowlers and fielders to its bowling team.
   Case-insensitive. Returns "A"/"B", or null if the name hasn't appeared.
   A club-tournament match started from saved teams also carries
   `match.squads` ({ A: [names], B: [names] }), which wins over usage: a
   squad player is on their squad's side before they've even batted. Names
   in neither squad (a late sub) fall back to the usage rule. */
function playerTeamInMatch(match, name){
  const key = (name || "").trim().toLowerCase();
  if (!key) return null;
  const has = list => list.some(n => n.toLowerCase() === key);
  if (match.squads){
    if (has(match.squads.A || [])) return "A";
    if (has(match.squads.B || [])) return "B";
  }
  for (const inn of match.innings){
    if (has(inn.batting.order)) return inn.battingTeam;
    if (has(inn.bowling.order) || has(inn.fielding.order)) return inn.bowlingTeam;
  }
  return null;
}

/* --- player profile field rules (mirror supabase/007's checks) ---
   NIC: Sri Lankan old format (9 digits + V/X) or new format (12 digits),
   stored upper-case without spaces. Contact: 7-15 digits/spaces, optional
   leading +. Both are optional; blank means "not set". */
function normalizeNic(v){ return (v || "").replace(/\s+/g, "").toUpperCase(); }
function isValidNic(v){ const n = normalizeNic(v); return n === "" || /^([0-9]{9}[VX]|[0-9]{12})$/.test(n); }
function isValidPhone(v){ const t = (v || "").trim(); return t === "" || /^\+?[0-9 ]{7,15}$/.test(t); }

/* Optional profile details: "Right-hand bat", "Right-arm fast", etc. Empty
   string when nothing is set, so callers can just filter falsy. */
function formatBatting(hand){ return hand === "right" ? "Right-hand bat" : hand === "left" ? "Left-hand bat" : ""; }
function formatBowling(arm, type){
  const a = arm === "right" ? "Right-arm" : arm === "left" ? "Left-arm" : "";
  const t = BOWLING_TYPES[type] ? BOWLING_TYPES[type].toLowerCase() : "";
  const words = [a, t].filter(Boolean).join(" ");
  return words ? words.charAt(0).toUpperCase() + words.slice(1) : "";
}
/* A photo is rendered straight into <img src>, so only ever a base64
   raster data URL (never svg or anything else) is accepted. */
function safePhoto(v){ return typeof v === "string" && /^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+\/=]+$/.test(v) && v.length <= 80000 ? v : ""; }
function playerDetailsError(d){
  if (d.batting_hand && !["right", "left"].includes(d.batting_hand)) return "Pick a valid batting hand.";
  if (d.bowling_arm && !["right", "left"].includes(d.bowling_arm)) return "Pick a valid bowling arm.";
  if (d.bowling_type && !BOWLING_TYPES[d.bowling_type]) return "Pick a valid bowling style.";
  if ((d.city || "").trim().length > 40) return "City can be at most 40 characters.";
  if (d.photo && !safePhoto(d.photo)) return "That photo couldn't be used — try another image.";
  if ((d.nickname || "").trim().length > 24) return "Nickname can be at most 24 characters.";
  if (parseJerseyNo(d.jersey_no) === undefined) return "Jersey no should be a whole number from 0 to 999.";
  return null;
}
/* Jersey no (supabase/010): blank -> null, "07" -> 7, anything that isn't a
   whole number 0-999 -> undefined (invalid). */
function parseJerseyNo(v){
  const t = v == null ? "" : String(v).trim();
  if (t === "") return null;
  return /^[0-9]{1,3}$/.test(t) ? parseInt(t, 10) : undefined;
}
/* Optional overs/players fields: blank -> null ("no limit"), otherwise a
   whole number clamped to at least `min`. */
function parseOptionalLimit(v, min){
  const t = v == null ? "" : String(v).trim();
  if (t === "") return null;
  const n = parseInt(t, 10);
  return isNaN(n) ? null : Math.max(min, n);
}
/* What an optional-limit <input> should start with: `def` for a brand-new
   form (field absent), blank for a saved "no limit" (null). */
function limitInputValue(v, def){ return v === undefined ? def : (v == null ? "" : v); }
/* Playing-condition tags shared by preset cards and the innings break. */
function conditionTagsFor(c){
  return [
    c.oversLimit != null ? `${c.oversLimit} overs` : "no over limit",
    `${c.ballsPerOver}-ball`,
    c.playersPerSide != null ? `${c.playersPerSide} a side` : "any number a side",
    c.lastManStands && c.playersPerSide != null ? "last man stands" : null
  ].filter(Boolean);
}

/* Escape a user's text for a PostgREST ilike pattern, so a typed % or _
   matches literally instead of acting as a wildcard. */
function escapeLike(v){ return String(v || "").replace(/[\\%_]/g, c => "\\" + c); }
/* "#7 Kusal Mendis (KM)" -- the roster/profile label; the name alone when
   neither is set. */
function playerLabel(p){
  const jersey = p.jersey_no == null ? "" : `#${p.jersey_no} `;
  return `${jersey}${p.name}${p.nickname ? ` (${p.nickname})` : ""}`;
}

/* One player's career line, folded from whatever matches the caller passes
   (a club's matches for a club profile, Premier matches for Premier) --
   matched by name, case-insensitive, since matches store names not ids.
   `nameOrNames` may be an array: a profile's own name plus the aliases left
   behind by approved merges (supabase/009), so stats recorded under an old
   spelling still count. */
function playerCareer(nameOrNames, matches){
  const names = (Array.isArray(nameOrNames) ? nameOrNames : [nameOrNames]);
  const seen = new Set();
  const careers = [];
  names.forEach(n => {
    const key = (n || "").trim().toLowerCase();
    if (!key || seen.has(key)) return;
    seen.add(key);
    const c = singleNameCareer(key, matches);
    if (c) careers.push(c);
  });
  return careers.length ? mergeCareers(careers) : null;
}

function singleNameCareer(key, matches){
  const t = aggregatePlayerStats(matches).find(x => x.name.toLowerCase() === key);
  if (!t) return null;
  // Per-innings extras aggregatePlayerStats doesn't keep: highest score,
  // 50s/100s/ducks, bowling innings and best bowling.
  let highScore = null, fifties = 0, hundreds = 0, ducks = 0, bowlInnings = 0, best = null;
  matches.forEach(m => m.innings.forEach(inn => {
    const bn = inn.batting.order.find(n => n.toLowerCase() === key);
    if (bn){
      const b = inn.batting.stats[bn];
      if (!highScore || b.runs > highScore.runs || (b.runs === highScore.runs && !b.out && highScore.out)) highScore = { runs: b.runs, out: !!b.out };
      if (b.runs >= 100) hundreds++; else if (b.runs >= 50) fifties++;
      if (b.out && b.runs === 0) ducks++;
    }
    const wn = inn.bowling.order.find(n => n.toLowerCase() === key);
    if (wn){
      const w = inn.bowling.stats[wn];
      if (w.legalBalls > 0 || w.wickets > 0){
        bowlInnings++;
        if (!best || w.wickets > best.wickets || (w.wickets === best.wickets && w.runs < best.runs)) best = { wickets: w.wickets, runs: w.runs };
      }
    }
  }));
  return {
    matches: t.matches, points: t.points,
    innings: t.innings, notOuts: t.notOuts, runs: t.runs, balls: t.balls, fours: t.fours, sixes: t.sixes,
    highScore, fifties, hundreds, ducks,
    bowlInnings, wickets: t.wickets, legalBalls: t.legalBalls, runsConceded: t.runsConceded, maidens: t.maidens, best,
    catches: t.catches, runouts: t.runouts
  };
}

/* Sums the additive fields and re-derives every ratio, so a merged profile's
   average/strike rate/economy are computed over the combined totals rather
   than averaged from the parts. */
function mergeCareers(list){
  const sum = k => list.reduce((a, c) => a + c[k], 0);
  const c = {};
  ["matches", "points", "innings", "notOuts", "runs", "balls", "fours", "sixes", "fifties", "hundreds", "ducks",
   "bowlInnings", "wickets", "legalBalls", "runsConceded", "maidens", "catches", "runouts"].forEach(k => { c[k] = sum(k); });
  c.highScore = null; c.best = null;
  list.forEach(x => {
    const h = x.highScore;
    if (h && (!c.highScore || h.runs > c.highScore.runs || (h.runs === c.highScore.runs && !h.out && c.highScore.out))) c.highScore = { runs: h.runs, out: h.out };
    const b = x.best;
    if (b && (!c.best || b.wickets > c.best.wickets || (b.wickets === c.best.wickets && b.runs < c.best.runs))) c.best = { wickets: b.wickets, runs: b.runs };
  });
  const dismissals = c.innings - c.notOuts;
  c.average = dismissals > 0 ? c.runs / dismissals : null;
  c.strikeRate = c.balls > 0 ? (c.runs / c.balls) * 100 : null;
  c.economy = c.legalBalls > 0 ? c.runsConceded / (c.legalBalls / 6) : null;
  c.bowlAverage = c.wickets > 0 ? c.runsConceded / c.wickets : null;
  c.bowlStrikeRate = c.wickets > 0 ? c.legalBalls / c.wickets : null;
  c.fieldDismissals = c.catches + c.runouts;
  return c;
}

/* Error text if `name` has already played for the *other* side in this
   match (a player can't be on both teams), else null. */
function playerSideConflict(match, name, teamKey){
  const owner = playerTeamInMatch(match, name);
  if (owner && owner !== teamKey) return `${name} already plays for ${teamName(match, owner)} in this match.`;
  return null;
}

function startSecondInnings(match){
  const i1 = match.innings[0];
  const target = i1.runs + 1;
  const cfg = { ballsPerOver: match.ballsPerOver, wideRuns: i1.wideBaseRuns, noBallRuns: i1.noBallBaseRuns, freeHitOnNoBall: i1.freeHitOnNoBall, lastManStands: i1.lastManStands };
  match.innings.push(createInnings(i1.bowlingTeam, i1.battingTeam, target, match.playersPerSide, match.oversLimit, cfg));
  match.status = "opening";
}

function matchResult(match){
  const [i1, i2] = match.innings;
  const bpo = match.ballsPerOver || 6;
  if (i2.runs >= i2.target){
    // No players limit -> no wickets margin; no overs limit -> no "overs left".
    const wl = i2.maxWickets != null ? i2.maxWickets - i2.wickets : null;
    const left = i2.oversLimit != null ? ` (${oversDisplay(i2.oversLimit * bpo - i2.legalBalls, bpo)} overs left)` : "";
    const margin = wl != null ? ` by ${wl} wicket${wl === 1 ? "" : "s"}` : "";
    return `${teamName(match, i2.battingTeam)} won${margin}${left}`;
  }
  if (i2.runs === i1.runs) return "Match tied";
  const margin = i1.runs - i2.runs;
  return `${teamName(match, i1.battingTeam)} won by ${margin} run${margin === 1 ? "" : "s"}`;
}

function afterBall(match){
  const inn = currentInnings(match);
  if (inn.complete){
    if (match.innings.length === 1) match.status = "innings_break";
    else { match.status = "complete"; match.result = matchResult(match); }
  }
}

/* Ends the match immediately, at any point (before openers are even
   named, mid-innings, at the break — wherever), with the other team
   declared the winner. Deliberately separate from matchResult/afterBall:
   there's no runs margin or chase to compute, and match.innings[1] may
   not exist yet. */
function forfeitMatch(match, forfeitingTeamKey){
  const winnerKey = forfeitingTeamKey === "A" ? "B" : "A";
  match.forfeited = true;
  match.forfeitedBy = forfeitingTeamKey;
  match.status = "complete";
  match.result = `${teamName(match, winnerKey)} won — ${teamName(match, forfeitingTeamKey)} forfeited the match`;
}

/* --- cross-match aggregation: MVP/MOTM, leaderboards, standings ---
   Pure functions over one or more completed matches, kept DOM-free like
   the rest of the engine so they're directly unit-testable. */
function calcPlayerPoints(bat, bowl, field){
  let pts = 0;
  if (bat){
    pts += bat.runs * MVP_POINTS.perRun;
    pts += bat.fours * MVP_POINTS.perFour;
    pts += bat.sixes * MVP_POINTS.perSix;
    if (bat.runs >= 100) pts += MVP_POINTS.century;
    else if (bat.runs >= 50) pts += MVP_POINTS.fifty;
    if (bat.balls > 0 && !bat.out) pts += MVP_POINTS.notOut;
  }
  if (bowl){
    pts += bowl.wickets * MVP_POINTS.perWicket;
    pts += bowl.maidens * MVP_POINTS.perMaiden;
  }
  if (field){
    pts += field.catches * MVP_POINTS.perCatch;
    pts += field.runouts * MVP_POINTS.perRunOut;
  }
  return pts;
}

function emptyPlayerTotal(name){
  return {
    name, runs: 0, balls: 0, fours: 0, sixes: 0, notOuts: 0, innings: 0,
    wickets: 0, legalBalls: 0, runsConceded: 0, maidens: 0,
    catches: 0, runouts: 0, points: 0, matches: 0
  };
}

function foldInningsIntoTotals(totals, inn){
  inn.batting.order.forEach(name => {
    const s = inn.batting.stats[name];
    const t = totals[name] || (totals[name] = emptyPlayerTotal(name));
    t.runs += s.runs; t.balls += s.balls; t.fours += s.fours; t.sixes += s.sixes;
    t.innings += 1;
    if (!s.out) t.notOuts += 1;
    t.points += calcPlayerPoints(s, null, null);
  });
  inn.bowling.order.forEach(name => {
    const b = inn.bowling.stats[name];
    const t = totals[name] || (totals[name] = emptyPlayerTotal(name));
    t.wickets += b.wickets; t.legalBalls += b.legalBalls; t.runsConceded += b.runs; t.maidens += b.maidens;
    t.points += calcPlayerPoints(null, b, null);
  });
  inn.fielding.order.forEach(name => {
    const f = inn.fielding.stats[name];
    const t = totals[name] || (totals[name] = emptyPlayerTotal(name));
    t.catches += f.catches; t.runouts += f.runouts;
    t.points += calcPlayerPoints(null, null, f);
  });
}

function matchPlayerNames(match){
  const names = new Set();
  match.innings.forEach(inn => {
    inn.batting.order.forEach(n => names.add(n));
    inn.bowling.order.forEach(n => names.add(n));
    inn.fielding.order.forEach(n => names.add(n));
  });
  return names;
}

function aggregatePlayerStats(matches){
  const totals = {};
  matches.forEach(match => {
    match.innings.forEach(inn => foldInningsIntoTotals(totals, inn));
    matchPlayerNames(match).forEach(name => { if (totals[name]) totals[name].matches += 1; });
  });
  return Object.values(totals).sort((a, b) => b.points - a.points);
}

function pickMatchMOTM(match){
  const totals = {};
  match.innings.forEach(inn => foldInningsIntoTotals(totals, inn));
  const ranked = Object.values(totals).sort((a, b) => {
    if (b.points !== a.points) return b.points - a.points;
    if (b.runs !== a.runs) return b.runs - a.runs;
    return b.wickets - a.wickets;
  });
  return ranked.length ? ranked[0].name : null;
}

function computeStandings(matches, tournamentPreset){
  const teams = {};
  function ensureTeam(name){
    return teams[name] || (teams[name] = {
      name, played: 0, won: 0, lost: 0, tied: 0, points: 0,
      runsFor: 0, oversFor: 0, runsAgainst: 0, oversAgainst: 0
    });
  }
  matches.forEach(match => {
    const nameA = teamName(match, "A"), nameB = teamName(match, "B");
    if (match.forfeited){
      // Counts for points, but deliberately excluded from NRR — the
      // innings that were played (if any) weren't played to a finish,
      // so folding their runs/overs in would skew run rate.
      ensureTeam(nameA); ensureTeam(nameB);
      ensureTeam(nameA).played += 1; ensureTeam(nameB).played += 1;
      const winner = teamName(match, match.forfeitedBy === "A" ? "B" : "A");
      const loser = winner === nameA ? nameB : nameA;
      teams[winner].won += 1; teams[loser].lost += 1;
      teams[winner].points += tournamentPreset.pointsForWin;
      teams[loser].points += tournamentPreset.pointsForLoss;
      return;
    }
    const [i1, i2] = match.innings;
    if (!i2 || !i2.complete) return; // only fully-played two-innings matches count
    ensureTeam(nameA); ensureTeam(nameB);
    const bpo = match.ballsPerOver || 6;
    match.innings.forEach(inn => {
      const bt = ensureTeam(teamName(match, inn.battingTeam));
      const bwt = ensureTeam(teamName(match, inn.bowlingTeam));
      const oversFaced = inn.completeReason === "allout" && inn.oversLimit != null ? inn.oversLimit : inn.legalBalls / bpo;
      bt.runsFor += inn.runs; bt.oversFor += oversFaced;
      bwt.runsAgainst += inn.runs; bwt.oversAgainst += oversFaced;
    });
    ensureTeam(nameA).played += 1; ensureTeam(nameB).played += 1;
    if (i2.runs === i1.runs){
      teams[nameA].tied += 1; teams[nameB].tied += 1;
      teams[nameA].points += tournamentPreset.pointsForTie; teams[nameB].points += tournamentPreset.pointsForTie;
    } else {
      const winner = i2.runs > i1.runs ? teamName(match, i2.battingTeam) : teamName(match, i1.battingTeam);
      const loser = winner === nameA ? nameB : nameA;
      teams[winner].won += 1; teams[loser].lost += 1;
      teams[winner].points += tournamentPreset.pointsForWin;
      teams[loser].points += tournamentPreset.pointsForLoss;
    }
  });
  const standings = Object.values(teams).map(t => ({
    ...t,
    nrr: (t.oversFor > 0 && t.oversAgainst > 0) ? (t.runsFor / t.oversFor) - (t.runsAgainst / t.oversAgainst) : 0
  }));
  standings.sort((a, b) => {
    if (b.points !== a.points) return b.points - a.points;
    if (tournamentPreset.useNRR && b.nrr !== a.nrr) return b.nrr - a.nrr;
    return 0;
  });
  return standings;
}

/* ============================================================
   3. STORAGE — DB wrapper: window.storage -> localStorage -> memory.
   Schema v2 adds teams/players/presets/tournaments/history alongside
   the original { match, snapshots }; v1 saves are migrated in place
   the first time a v2-aware build loads them.
   ============================================================ */
var STORAGE_KEY = "cricket.lk.v2";
var LEGACY_KEY = "cricket.lk.v1";

var DB = (() => {
  let mem = {};
  function backend(){
    if (typeof window !== "undefined" && window.storage && typeof window.storage.getItem === "function") return window.storage;
    try {
      if (typeof localStorage !== "undefined"){
        localStorage.setItem("__t", "1"); localStorage.removeItem("__t");
        return localStorage;
      }
    } catch (_){ /* private mode / disabled storage */ }
    return null;
  }
  const store = backend();
  return {
    load(key){
      try {
        const raw = store ? store.getItem(key) : mem[key];
        return raw ? JSON.parse(raw) : null;
      } catch (_){ return null; }
    },
    save(key, data){
      const raw = JSON.stringify(data);
      try { if (store) store.setItem(key, raw); else mem[key] = raw; }
      catch (_){ mem[key] = raw; }
    },
    clear(key){
      try { if (store) store.removeItem(key); } catch (_){}
      delete mem[key];
    },
    // Exposes the same window.storage -> localStorage -> null tier DB itself
    // resolved, so other things (the Supabase auth session adapter) can
    // follow the identical backend choice instead of re-detecting it.
    rawBackend: store
  };
})();

function genId(prefix){
  return `${prefix}-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 8)}`;
}

function defaultState(){
  const matchPresets = {}; DEFAULT_MATCH_PRESETS.forEach(p => { matchPresets[p.id] = p; });
  const tournamentPresets = {}; DEFAULT_TOURNAMENT_PRESETS.forEach(p => { tournamentPresets[p.id] = p; });
  return {
    match: null, snapshots: [],
    view: "home",
    players: {}, teams: {},
    matchPresets, tournamentPresets,
    tournaments: {}, matchHistory: {},
    activeTournamentId: null,
    activeClubId: null, // which club (if any) Home's quick-action cards currently target -- see the CLOUD "clubs" section
    clubDataReset202609: false, // one-time drop of local club-match copies after the cloud wipe -- see purgeLocalClubMatches()
    guestPlayersCleaned: false, // one-time purge of club-match names that leaked into state.players -- see purgeLeakedClubPlayers()
    soundEnabled: true,
    themeId: "midnight", // see THEME_PRESETS (REFERENCE DATA) and applyTheme()
    branding: { name: "", logo: null, accent: null, accent2: null }
  };
}

/* ============================================================
   4. CLOUD — Supabase client, auth session, and the platform-wide
   admin flag. Everything here is additive: with SUPABASE_URL/
   SUPABASE_ANON_KEY unset, `supabaseClient` stays null and every
   cloud-gated screen/action just falls back to "sign in required" —
   local guest scoring never depends on any of this, and no network
   request happens at all on an unconfigured deployment.
   Session/profile/isAdmin are deliberately plain top-level `let`
   vars, NOT fields on `state` or `ui`: `state` is JSON-persisted via
   DB.save() (a Supabase session object doesn't belong in that blob,
   supabase-js manages its own persistence) and `ui` gets wholesale
   reset (`ui = defaultUi()`) at points like finishing a match, which
   would otherwise wipe sign-in status out from under the user.
   The supabase-js library is loaded dynamically (not a static
   <script> tag) so a slow/blocked CDN fetch can never delay booting
   the core scorer — see loadSupabaseLib() below.
   ============================================================ */
const SUPABASE_URL = "https://xfsaldtvvcuyondayjjw.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_jDfjBu62WssP3fKEbbfVKw_ZyoxCXUm";  // publishable key -- safe to expose, access is enforced by RLS
const SUPABASE_JS_CDN_URL = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js";

function loadSupabaseLib(){
  if (typeof window.supabase !== "undefined") return Promise.resolve(window.supabase);
  return new Promise((resolve, reject) => {
    const el = document.createElement("script");
    el.src = SUPABASE_JS_CDN_URL;
    el.onload = () => resolve(window.supabase);
    el.onerror = () => reject(new Error("Failed to load supabase-js"));
    document.head.appendChild(el);
  });
}

function makeCloudAuthStorage(){
  const backend = DB.rawBackend; // same window.storage -> localStorage -> null tier as DB
  const mem = {};
  return {
    getItem: (key) => Promise.resolve(backend ? backend.getItem(key) : (key in mem ? mem[key] : null)),
    setItem: (key, value) => {
      try { if (backend) backend.setItem(key, value); else mem[key] = value; }
      catch (_){ mem[key] = value; }
      return Promise.resolve();
    },
    removeItem: (key) => {
      try { if (backend) backend.removeItem(key); } catch (_){}
      delete mem[key];
      return Promise.resolve();
    }
  };
}

let supabaseClient = null; // set by initAuth() once supabase-js has loaded, if configured
let session = null;  // current Supabase auth session, or null when signed out / cloud unavailable
let profile = null;  // { id, display_name } row from `profiles` for the signed-in user
let isAdmin = false;  // whether the signed-in user has a row in `admin_users`

async function refreshProfileAndAdmin(){
  profile = null; isAdmin = false;
  if (!supabaseClient || !session) return;
  const [{ data: profileRow }, { data: adminRow }] = await Promise.all([
    supabaseClient.from("profiles").select("id, display_name").eq("id", session.user.id).maybeSingle(),
    supabaseClient.from("admin_users").select("user_id").eq("user_id", session.user.id).maybeSingle()
  ]);
  profile = profileRow || null;
  isAdmin = !!adminRow;
}

async function initAuth(){
  if (!SUPABASE_URL || !SUPABASE_ANON_KEY) return; // cloud not configured on this deployment
  let lib;
  try { lib = await loadSupabaseLib(); } catch (_){ return; } // offline/blocked CDN — stay in guest mode
  supabaseClient = lib.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    auth: { storage: makeCloudAuthStorage(), persistSession: true, autoRefreshToken: true }
  });
  const { data } = await supabaseClient.auth.getSession();
  session = data.session || null;
  await refreshProfileAndAdmin();
  render();
  supabaseClient.auth.onAuthStateChange((_event, newSession) => {
    session = newSession;
    refreshProfileAndAdmin().then(render);
  });
}

async function handleSignOut(){
  if (!supabaseClient) return;
  await supabaseClient.auth.signOut();
  state.view = "home";
  state.activeClubId = null;
  ui.identity = null; ui.premier = null;
  ui.myClubs = null; ui.club = null; ui.currentClubId = null; // don't leak the previous account's clubs to whoever signs in next
  save(); render();
}

async function fetchMyClubs(){

    .from("club_members")

async function createClub(name){

  const { data: club, error } = await supabaseClient
    .from("clubs").insert({ name, created_by: session.user.id }).select().single();
  if (error) return { error: error.message };
  const { error: memberError } = await supabaseClient
    .from("club_members").insert({ club_id: club.id, user_id: session.user.id, role: "owner" });
  if (memberError) return { error: memberError.message };
  return { club };
}

/* Members, then their display names in a second query: PostgREST can't embed
   profiles_public in club_members (both only reference auth.users, and a view
   carries no FK), so "club_members?select=...,profiles_public(...)" is a 400. */
async function fetchClubMembers(clubId){
  const { data: rows, error } = await supabaseClient.from("club_members").select("user_id, role").eq("club_id", clubId);
  if (error || !rows) return { data: [] };
  const ids = rows.map(r => r.user_id);
  const { data: names } = ids.length
    ? await supabaseClient.from("profiles_public").select("id, display_name").in("id", ids)
    : { data: [] };
  const byId = new Map((names || []).map(n => [n.id, n.display_name]));
  return { data: rows.map(r => ({ userId: r.user_id, role: r.role, displayName: byId.get(r.user_id) || "—" })) };
}

    supabaseClient.from("tournaments").select("id, name, organizer_club_id, tournament_preset").eq("id", tournamentId).single(),
    supabaseClient.from("matches").select("id, data, played_at").eq("tournament_id", tournamentId).order("played_at", { ascending: false }),
    supabaseClient.from("tournament_teams").select("id, name, players").eq("tournament_id", tournamentId).order("created_at")
  ]);
  // teams_unavailable: 012 hasn't been run -- the dashboard says so instead
  // of breaking, and match setup falls back to typed team names.
  ui.clubTournament = tournament
    ? { ...tournament, matches: matches || [], teams: teamsError ? [] : (teams || []), teams_unavailable: !!teamsError }
    : null;
}

/* Tournament teams (supabase/012): a name + roster players, members-only.
   `players` is [{ id, name }] -- the name is a snapshot, see the SQL. */
async function saveTournamentTeam(tournament, team){
  const row = { name: team.name, players: team.players };
  const { error } = team.id
    ? await supabaseClient.from("tournament_teams").update(row).eq("id", team.id).eq("tournament_id", tournament.id)
    : await supabaseClient.from("tournament_teams").insert({ ...row, tournament_id: tournament.id, club_id: tournament.organizer_club_id, created_by: session.user.id });
  if (!error) return { ok: true };
  if (error.code === "23505") return { error: "This tournament already has a team with that name." };
  return { error: cloudTableMissing(error, "012_tournament_teams.sql") || error.message };
}
async function deleteTournamentTeam(tournamentId, teamId){
  const { error } = await supabaseClient.from("tournament_teams").delete().eq("id", teamId).eq("tournament_id", tournamentId);
  return error ? { error: cloudTableMissing(error, "012_tournament_teams.sql") || error.message } : { ok: true };
}
function cloudTableMissing(error, file){
  return error && (error.code === "42P01" || error.code === "PGRST205")
    ? `Cloud database is missing ${file} — run it in the Supabase SQL editor.` : null;
}

/* Club presets live in the cloud (club_presets, members-only via RLS) --
   the club's own, separate from the on-device guest presets. */
async function saveClubPreset(clubId, kind, preset){
  const { id, ...body } = preset;
  const { error } = id
    ? await supabaseClient.from("club_presets").update({ preset: body }).eq("id", id).eq("club_id", clubId)
    : await supabaseClient.from("club_presets").insert({ club_id: clubId, kind, preset: body });
  return error ? { error: error.message } : { ok: true };
}
async function deleteClubPreset(clubId, id){
  const { error } = await supabaseClient.from("club_presets").delete().eq("id", id).eq("club_id", clubId);
  return error ? { error: error.message } : { ok: true };
}

/* One server-side step (supabase/009, superseding 005): find the player in
   the global players table by name (or a merge alias), create them there if
   they're not (so they show up in Premier too, with this club recorded as
   the one that added them), then add the roster row. Returns
   { id, created }. Only when `created` is true does this club get to edit the
   profile -- an already-existing player just joins the roster, and can only
   be edited by the club that first added them (until claimed) or by
   themselves. Done as an RPC because the base players table isn't readable
   by ordinary users. */
function cloudSqlMissing(error, file){
  return error && (error.code === "PGRST202" || error.code === "42883")
    ? `Cloud database is missing ${file} — run it in the Supabase SQL editor.` : null;
}
async function addPlayerToClub(clubId, name, extras){
  const trimmed = (name || "").trim();
  if (!trimmed) return;
  const { data, error } = await supabaseClient.rpc("add_player_to_club", { _club_id: clubId, _name: trimmed });
  if (error) return { error: cloudSqlMissing(error, "supabase/005_add_player_to_club.sql") || error.message };
  // Before 009 the RPC returned a bare uuid (and the caller always owned the row).
  const playerId = data && typeof data === "object" ? data.id : data;
  const created = data && typeof data === "object" ? !!data.created : true;
  if (created && extras){
    if (extras.phone || extras.nic){
      const r = await updatePlayerProfile(playerId, extras.phone, extras.nic);
      if (r && r.error) return { error: `Added, but couldn't save the contact details: ${r.error}` };
    }
    if (extras.details && playerHasDetails(extras.details)){
      const r = await updatePlayerDetails(playerId, extras.details);
      if (r && r.error) return { error: `Added, but couldn't save the other details: ${r.error}` };
    }
  }
  return { ok: true, id: playerId, created };
}
function playerHasDetails(d){
  return !!(d.batting_hand || d.bowling_arm || d.bowling_type || d.is_keeper || d.city || d.photo || d.nickname || parseJerseyNo(d.jersey_no) != null);
}

/* Players already on the platform whose name contains `query` -- public
   columns only (players_public; never phone/NIC). Used by the add-player
   sheet to offer "add the existing player" instead of creating a new one. */
async function searchPlatformPlayers(query){
  const pattern = `%${escapeLike(query.trim())}%`;
  const full = await supabaseClient.from("players_public").select(`id, name, city, photo, ${PLAYER_KIT_COLS}`).ilike("name", pattern).order("name").limit(8);
  if (!full.error) return full.data || [];
  const { data } = await supabaseClient.from("players_public").select("id, name").ilike("name", pattern).order("name").limit(8);
  return data || [];
}
/* Add one specific existing player (by id -- names aren't unique) to the
   roster. A plain insert: 002's "members manage" policy allows it, and it
   never creates a player or grants edit rights (origin_club_id is untouched). */
async function addExistingPlayerToClub(clubId, playerId){
  const { error } = await supabaseClient.from("club_rosters").insert({ club_id: clubId, player_id: playerId });
  if (!error) return { ok: true };
  return { error: error.code === "23505" ? "Already on your club's roster." : error.message };
}

/* Take a player off this club's roster (club_rosters delete; any club member
   may, per 002's "members remove" policy -- every member is an owner/admin).
   The global player, their profile and every past match (which store names)
   are untouched, so stats stay and they can be re-added later. RLS turns a
   non-member's delete into "0 rows", not an error, hence the row check. */
async function removePlayerFromClub(clubId, playerId){
  const { data, error } = await supabaseClient.from("club_rosters").delete()
    .eq("club_id", clubId).eq("player_id", playerId).select("player_id");
  if (error) return { error: error.message };
  return data && data.length ? { ok: true } : { error: "Couldn't remove this player — only this club's admins can." };
}

/* --- player profiles (supabase/007_player_profiles.sql). Name and stats are
   public; the database only returns contact number / NIC to the player,
   admins, and members of a club that has them on its roster (everyone else
   gets nulls and can_see_contact = false). Signed-out visitors (Premier is
   browsable without an account) just get the public row. --- */
function profileSqlMissing(error){
  return cloudSqlMissing(error, "supabase/007_player_profiles.sql") || (error && error.message) || "Something went wrong";
}
/* Public details (batting/bowling/keeper/city/photo) come from players_public;
   they only exist once supabase/008 has been run, so a failed select there
   just means "details unavailable", not a failed profile. */
const PLAYER_DETAIL_COLS = "batting_hand, bowling_arm, bowling_type, is_keeper, city, photo";
const PLAYER_KIT_COLS = "nickname, jersey_no";   // supabase/010
async function fetchPlayerDetails(playerId){
  // Try with 010's columns first; without 010 that select fails, so fall
  // back to 008's and flag nickname/jersey as unavailable.
  const full = await supabaseClient.from("players_public").select(`${PLAYER_DETAIL_COLS}, ${PLAYER_KIT_COLS}`).eq("id", playerId).single();
  if (!full.error && full.data) return Object.assign({ details_unavailable: false, kit_unavailable: false }, full.data);
  const { data, error } = await supabaseClient.from("players_public").select(PLAYER_DETAIL_COLS).eq("id", playerId).single();
  return error || !data ? { details_unavailable: true, kit_unavailable: true } : Object.assign({ details_unavailable: false, kit_unavailable: true }, data);
}
/* Same 010 fallback for the roster list, so it still loads before 010 is run. */
async function fetchRosterRows(clubId){
  const full = await supabaseClient.from("club_rosters").select(`player_id, players_public(id, name, ${PLAYER_KIT_COLS})`).eq("club_id", clubId);
  return full.error ? supabaseClient.from("club_rosters").select("player_id, players_public(id, name)").eq("club_id", clubId) : full;
}
async function fetchPlayerProfile(playerId){
  if (!supabaseClient) return { error: "Cloud isn't configured on this deployment." };
  if (!session){
    const { data } = await supabaseClient.from("players_public").select("id, name, claimed_by").eq("id", playerId).single();
    if (!data) return { error: "Player not found." };
    return { data: Object.assign({}, data, { phone: null, nic: null, can_see_contact: false }, await fetchPlayerDetails(playerId)) };
  }
  const { data, error } = await supabaseClient.rpc("get_player_profile", { _player_id: playerId });
  if (error) return { error: profileSqlMissing(error) };
  if (!data || !data[0]) return { error: "Player not found." };
  return { data: Object.assign({}, data[0], await fetchPlayerDetails(playerId)) };
}

/* Club matches for a Premier-opened profile: matches are publicly readable,
   but there is no way to ask "which clubs does this player belong to" (club
   rosters are members-only), so the club side of the stats comes from the
   clubs the *viewer* belongs to -- cloud matches merged by id with the
   local archive of those clubs' matches. */
async function fetchViewerClubMatches(){
  if (!supabaseClient || !session) return [];
  if (!ui.myClubs) await fetchMyClubs();
  const ids = (ui.myClubs || []).map(c => c.id);
  if (!ids.length) return [];
  const { data } = await supabaseClient.from("matches").select("id, data").eq("level", "local").in("club_id", ids);
  const byId = new Map();
  Object.values(state.matchHistory).filter(m => m.clubId && ids.includes(m.clubId)).forEach(m => byId.set(m.id, m));
  (data || []).forEach(r => { if (r.data) byId.set(r.data.id || r.id, r.data); });
  return [...byId.values()];
}
async function updatePlayerDetails(playerId, d){
  const { error } = await supabaseClient.rpc("update_player_details", {
    _player_id: playerId, _batting_hand: d.batting_hand || "", _bowling_arm: d.bowling_arm || "", _bowling_type: d.bowling_type || "",
    _is_keeper: !!d.is_keeper, _city: d.city || "", _photo: d.photo || ""
  });
  if (error) return { error: error.code === "PGRST202" || error.code === "42883"
    ? "Cloud database is missing supabase/008_player_details.sql — run it in the Supabase SQL editor." : error.message };
  // Nickname + jersey no are a separate RPC (supabase/010). Without 010 a
  // blank nickname/jersey is fine -- only complain if one was actually typed.
  const nickname = (d.nickname || "").trim(), jersey = parseJerseyNo(d.jersey_no);
  const kit = await supabaseClient.rpc("update_player_nickname_jersey", { _player_id: playerId, _nickname: nickname, _jersey_no: jersey });
  if (!kit.error) return { ok: true };
  const missing = cloudSqlMissing(kit.error, "supabase/010_player_nickname_jersey.sql");
  if (missing && !nickname && jersey == null) return { ok: true };
  return { error: missing || kit.error.message };
}
async function updatePlayerProfile(playerId, phone, nic){
  const { error } = await supabaseClient.rpc("update_player_profile", { _player_id: playerId, _phone: phone || "", _nic: nic || "" });
  return error ? { error: profileSqlMissing(error) } : { ok: true };
}

/* Global-only sibling of addPlayerToClub (supabase/006): for a friendly's
   visitors, who aren't on the home club's roster. The club is passed so a
   brand-new visitor is attributed to the club that first recorded them (and
   that club can edit the profile until the player claims it). */
async function addGlobalPlayer(name, clubId){
  const trimmed = (name || "").trim();
  if (!trimmed) return;
  let { error } = await supabaseClient.rpc("ensure_global_player", { _name: trimmed, _club_id: clubId || null });
  if (error && error.code === "PGRST202") ({ error } = await supabaseClient.rpc("ensure_global_player", { _name: trimmed }));
  return error ? { error: error.message } : { ok: true };
}

async function inviteClubAdmin(clubId, email){
  const { data, error } = await supabaseClient.rpc("invite_club_admin", { _club_id: clubId, _email: email });
  if (error) return { error: error.message };
  return { result: data }; // "ok" | "not_found" | "already_member"
}

async function syncMatchToCloud(match, archived){
  if (!supabaseClient || !session || !match.clubId) return;
  try {
    await supabaseClient.from("matches").upsert({
      id: archived.id,
      club_id: match.clubId,
      match_type: match.matchType || "practice",
      level: "local",
      opponent_name: match.opponentName || null,
      tournament_id: match.tournamentId || null,
      created_by: session.user.id,
      // squads are the saved tournament teams (members-only, supabase/012);
      // matches are publicly readable, so they stay on this device.
      data: Object.assign({}, archived, { squads: undefined }),
      played_at: new Date(archived.completedAt).toISOString()
    });
  } catch (_){ /* best-effort -- the match is already safely archived locally either way */ }
}

/* --- Premier: a cross-club, public players/stats/(eventually teams)
   browse screen, and player claiming ("this is me"). Claiming works
   today even though Premier tournaments (organizing, multi-club) don't
   exist yet -- players are already global (Milestone 2), so there's a
   real identity to claim regardless. Approval is admin-only, enforced
   server-side by the approve_claim/reject_claim RPCs (see
   supabase/004_premier_claims.sql), never by the isAdmin flag alone. */
async function fetchPremierData(){
  if (!supabaseClient){ ui.premier = { players: [], premierMatches: [], pendingClaims: [], pendingMerges: [] }; return; }
  const [{ data: players }, { data: premierMatches }, pendingClaims, pendingMerges] = await Promise.all([
    supabaseClient.from("players_public").select("id, name, claimed_by").order("name"),
    supabaseClient.from("matches").select("id, data").eq("level", "premier"),
    isAdmin
      ? supabaseClient.from("claim_requests").select("id, player_id, requested_by, claimed_phone, note, created_at").eq("status", "pending")
      : Promise.resolve({ data: [] }),
    // Errors (e.g. supabase/009 not run yet) just mean "no merge requests".
    isAdmin
      ? supabaseClient.from("merge_requests").select("id, from_player_id, into_player_id, requested_by, note, created_at").eq("status", "pending")
      : Promise.resolve({ data: [] })
  ]);
  ui.premier = {
    players: players || [],
    premierMatches: premierMatches || [],
    pendingClaims: (pendingClaims && pendingClaims.data) || [],
    pendingMerges: (pendingMerges && pendingMerges.data) || []
  };
}

/* Who the signed-in viewer already is: the one profile they've claimed (at
   most one -- enforced by a unique index), and any request of theirs still
   waiting for admin approval. Drives whether a profile offers "This is me"
   (no claim yet), "Request merge" (already have one) or neither. */
async function fetchMyPlayerIdentity(){
  if (!supabaseClient || !session){ ui.identity = null; return; }
  const uid = session.user.id;
  const [mine, claim, merges] = await Promise.all([
    supabaseClient.from("players").select("id, name").eq("claimed_by", uid).limit(1),
    supabaseClient.from("claim_requests").select("id, player_id").eq("requested_by", uid).eq("status", "pending").limit(1),
    supabaseClient.from("merge_requests").select("id, from_player_id").eq("requested_by", uid).eq("status", "pending")
  ]);
  ui.identity = {
    myPlayer: (mine.data && mine.data[0]) || null,
    pendingClaim: (claim.data && claim.data[0]) || null,
    pendingMerges: merges.data || []
  };
}

async function fetchPlayerAliases(playerId){
  const { data, error } = await supabaseClient.from("player_aliases").select("alias").eq("player_id", playerId);
  return error || !data ? [] : data.map(r => r.alias);
}

const CLAIM_SQL_MISSING = "supabase/009_ownership_claims_merges.sql";
async function ownershipRpc(fn, args){
  const { error } = await supabaseClient.rpc(fn, args);
  return error ? { error: cloudSqlMissing(error, CLAIM_SQL_MISSING) || error.message } : { ok: true };
}
const requestClaim = (playerId, phone, note) => ownershipRpc("request_claim", { _player_id: playerId, _phone: phone || null, _note: note || null });
const requestMerge = (fromPlayerId, note) => ownershipRpc("request_merge", { _from_player_id: fromPlayerId, _note: note || null });

const rejectClaimRequest = requestId => ownershipRpc("reject_claim", { _request_id: requestId });
const approveMergeRequest = requestId => ownershipRpc("approve_merge", { _request_id: requestId });
const rejectMergeRequest = requestId => ownershipRpc("reject_merge", { _request_id: requestId });

    matchSetupPresetId: null,

function save(){ DB.save(STORAGE_KEY, state); }

function migrateLegacy(){
  const legacy = DB.load(LEGACY_KEY);
  if (!legacy || !legacy.match) return null;
  const fresh = defaultState();
  fresh.match = legacy.match;
  fresh.snapshots = legacy.snapshots || [];
  return fresh;
}

/* One-time cleanup: before club matches stopped writing to the guest table,
   every name typed in a club match landed in state.players, so club players
   showed up in guest mode. Remove exactly those: a name that appears in a
   club match (archived or in progress) and nowhere guest -- not in any guest
   match, not on a saved local team. A guest player who merely shares a name
   with a club player and was never used anywhere else goes too; guest
   players are temporary and re-created by typing the name. Mutates `st`,
   returns the removed names. */
function purgeLeakedClubPlayers(st){
  const club = new Set(), keep = new Set();
  const matches = Object.values(st.matchHistory || {}).concat(st.match ? [st.match] : []);
  matches.forEach(m => matchPlayerNames(m).forEach(n => (m.clubId ? club : keep).add(n.toLowerCase())));
  Object.values(st.teams || {}).forEach(t => (t.playerIds || []).forEach(id => {
    if (st.players[id]) keep.add(st.players[id].name.toLowerCase());
  }));
  const removed = [];
  Object.values(st.players || {}).forEach(p => {
    const k = p.name.toLowerCase();
    if (club.has(k) && !keep.has(k)){ delete st.players[p.id]; removed.push(p.name); }
  });
  return removed;
}

/* One-time, per device: the cloud's clubs/players/matches were wiped
   (2026-09), so drop this device's archived copies of club matches (they'd
   otherwise keep feeding club stats via clubMatchesFor) and forget the
   selected club, which no longer exists. Guest matches (no clubId) and a
   match still in progress are left alone. Returns how many were removed. */
function purgeLocalClubMatches(st){
  let removed = 0;
  Object.keys(st.matchHistory || {}).forEach(id => {
    if (st.matchHistory[id] && st.matchHistory[id].clubId){ delete st.matchHistory[id]; removed++; }
  });
  st.activeClubId = null;
  return removed;
}

function load(){
  const data = DB.load(STORAGE_KEY);
  if (data){
    state = Object.assign(defaultState(), data);
    if (!state.guestPlayersCleaned){ purgeLeakedClubPlayers(state); state.guestPlayersCleaned = true; save(); }
    if (!state.clubDataReset202609){ purgeLocalClubMatches(state); state.clubDataReset202609 = true; save(); }
    applyTheme(); return;
  }
  state = migrateLegacy() || defaultState();
  state.clubDataReset202609 = true;   // nothing from before the wipe to purge on a fresh/legacy install
  applyTheme();
  save();
}

function pushSnapshot(){
  state.snapshots.push(JSON.parse(JSON.stringify(state.match)));
  if (state.snapshots.length > 80) state.snapshots.shift();
}

/* --- teams & players (persistent, swappable rosters; name autocomplete) --- */
function findOrCreatePlayer(name){
  const trimmed = (name || "").trim();
  const existing = Object.values(state.players).find(p => p.name.toLowerCase() === trimmed.toLowerCase());
  if (existing) return existing;
  const player = { id: genId("player"), name: trimmed };
  state.players[player.id] = player;
  return player;
}

function allPlayerNames(){ return Object.values(state.players).map(p => p.name); }

/* --- guest vs club scoping. Guest data (state.players / state.teams) lives
   only on this device and is only offered in guest matches. A club match's
   names belong to that club's roster instead -- and, via the same
   add_player_to_club RPC, to the global (Premier) players table, where one
   player can sit on any number of clubs' rosters. --- */
function activeMatchClubId(){ return state.match && state.match.clubId ? state.match.clubId : null; }
function activeSetupClubId(){ return activeMatchClubId() || (ui.clubMatchSetupType && ui.currentClubId) || null; }

/* Presets are per role too: guests use state.matchPresets/tournamentPresets
   (on this device); a club uses its own club_presets, cached on ui.club. The
   two are never merged -- club setup screens call these instead of reading
   the guest tables. */
function clubPresetList(kind, clubId){
  return ui.club && ui.club.id === clubId && ui.club.presets ? ui.club.presets[kind] : [];
}
function clubSetupId(){ return ui.clubMatchSetupType && ui.currentClubId ? ui.currentClubId : null; }
function matchPresetChoices(){
  const c = clubSetupId();
  return c ? clubPresetList("match", c) : Object.values(state.matchPresets);
}

function suggestionPlayerNames(){
  const clubId = activeMatchClubId();
  if (!clubId) return allPlayerNames();
  return ui.club && ui.club.id === clubId ? ui.club.roster.map(p => p.name) : [];
}
function suggestionTeamNames(){
  const clubId = activeSetupClubId();
  if (!clubId) return Object.values(state.teams).map(t => t.name);
  const club = (ui.myClubs || []).find(c => c.id === clubId) || (ui.club && ui.club.id === clubId ? ui.club : null);
  return club ? [club.name] : [];
}

/* Where a name typed during a match gets remembered. Guest match: the local
   players table, as always. Club match: never the guest table -- it goes to
   the club roster + global players (best effort, like syncMatchToCloud; the
   match itself is safe locally either way) and into the cached roster so the
   suggestions update straight away. */
function registerMatchPlayer(name, teamKey){
  const trimmed = (name || "").trim();
  if (!trimmed) return;
  const clubId = activeMatchClubId();
  if (!clubId){ findOrCreatePlayer(trimmed); return; }
  // A friendly's visiting side (team B) isn't the home club's people: they
  // still become global players, but stay off this club's roster.
  const visitor = state.match.matchType === "friendly" && teamKey === "B";
  if (!visitor && ui.club && ui.club.id === clubId && !ui.club.roster.some(p => p.name.toLowerCase() === trimmed.toLowerCase())){
    ui.club.roster.push({ id: null, name: trimmed });
  }
  if (supabaseClient && session) (visitor ? addGlobalPlayer(trimmed, clubId) : addPlayerToClub(clubId, trimmed)).catch(() => {});
}

function createTeam(name){
  const team = { id: genId("team"), name: (name || "").trim(), playerIds: [] };
  state.teams[team.id] = team;
  return team;
}

function deleteTeam(teamId){ delete state.teams[teamId]; }

function addPlayerToTeam(teamId, name){
  const player = findOrCreatePlayer(name);
  const team = state.teams[teamId];
  if (team && !team.playerIds.includes(player.id)) team.playerIds.push(player.id);
  return player;
}

function removePlayerFromTeam(teamId, playerId){
  const team = state.teams[teamId];
  if (team) team.playerIds = team.playerIds.filter(id => id !== playerId);
}

function movePlayerToTeam(playerId, fromTeamId, toTeamId){
  removePlayerFromTeam(fromTeamId, playerId);
  const team = state.teams[toTeamId];
  if (team && !team.playerIds.includes(playerId)) team.playerIds.push(playerId);
}

// Global delete (Players screen) -- also scrubs the player out of every
// team's roster so nothing keeps a dangling playerId.
function deletePlayer(playerId){
  delete state.players[playerId];
  Object.values(state.teams).forEach(t => { t.playerIds = t.playerIds.filter(id => id !== playerId); });
}

  state.matchPresets[id] = Object.assign({}, preset, { id });
  return state.matchPresets[id];
}
function deleteMatchPreset(id){ delete state.matchPresets[id]; }

function saveTournamentPreset(preset){

  state.tournamentPresets[id] = Object.assign({}, preset, { id });

}

/* --- tournaments & match history --- */
function createTournament({ name, tournamentPresetId, teamIds }){
  const tournament = { id: genId("tourney"), name: (name || "").trim(), tournamentPresetId, teamIds: (teamIds || []).slice(), matchIds: [] };
  state.tournaments[tournament.id] = tournament;
  return tournament;
}

function archiveMatch(match){
  const archived = JSON.parse(JSON.stringify(match));
  archived.id = genId("match");
  archived.completedAt = Date.now();
  state.matchHistory[archived.id] = archived;
  if (match.tournamentId && state.tournaments[match.tournamentId]){
    state.tournaments[match.tournamentId].matchIds.push(archived.id);
  }
  return archived;
}

function escapeHtml(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

/* --- THEME: a user's chosen accent/accent-2 hex (state.branding — no
   longer editable in the UI, but still honored for any pre-existing
   saved customization) is the only thing stored — everything else
   (the rgb triple used by rgba() overlays, a lightened gradient-stop
   shade, a darkened "dim" shade, and a light/dark "ink" text color)
   is derived from it and pushed onto :root as CSS custom properties.
   Leaving a color uncustomized (hex is null) removes the override so
   the hardcoded :root defaults in <style> — the single source of
   truth for the built-in palette — show through untouched. --- */
function hexToRgb(hex){
  const clean = String(hex || "").replace("#", "");
  const full = clean.length === 3 ? clean.split("").map(c => c + c).join("") : clean;
  const n = parseInt(full, 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
function rgbToHex(r, g, b){
  return "#" + [r, g, b].map(c => Math.max(0, Math.min(255, Math.round(c))).toString(16).padStart(2, "0")).join("");
}
function shadeColor(hex, amount){
  const [r, g, b] = hexToRgb(hex);
  const target = amount < 0 ? 0 : 255;
  const p = Math.abs(amount);
  const mix = c => c + (target - c) * p;
  return rgbToHex(mix(r), mix(g), mix(b));
}
function inkForColor(hex){
  const [r, g, b] = hexToRgb(hex);
  const luminance = (0.2126 * r + 0.7152 * g + 0.0722 * b) / 255;
  return shadeColor(hex, luminance > 0.5 ? -0.88 : 0.88);
}
function applyAccentVars(root, prefix, hex){
  if (!hex){
    ["", "-rgb", "-dim", "-light", "-ink"].forEach(suffix => root.removeProperty(`--${prefix}${suffix}`));
    return;
  }
  root.setProperty(`--${prefix}`, hex);
  root.setProperty(`--${prefix}-rgb`, hexToRgb(hex).join(","));
  root.setProperty(`--${prefix}-dim`, shadeColor(hex, -0.35));
  root.setProperty(`--${prefix}-light`, shadeColor(hex, 0.35));
  root.setProperty(`--${prefix}-ink`, inkForColor(hex));
}
function applyTheme(){
  const b = state.branding || {};
  const root = document.documentElement.style;
  const preset = THEME_PRESETS.find(t => t.id === state.themeId) || THEME_PRESETS[0];
  Object.entries(preset.vars).forEach(([prop, value]) => root.setProperty(prop, value));
  const metaTheme = document.querySelector('meta[name="theme-color"]');
  if (metaTheme) metaTheme.content = preset.vars["--bg-2"];
  // A pre-existing custom branding accent (legacy state.branding data) always overrides the theme's own.
  applyAccentVars(root, "accent", b.accent || preset.accent);
  applyAccentVars(root, "accent-2", b.accent2 || preset.accent2);
}

/* --- SFX: tiny synthesized sound effects via Web Audio API, no audio
   files — keeps the single-file/no-dependency/offline constraints.
   Muted via state.soundEnabled (persisted, toggled by the topbar's sound
   button rendered on every screen). AudioContext is created lazily on
   the first sound-triggering call, which is always inside a click
   handler, satisfying browsers' user-gesture autoplay requirement. --- */
const SFX = (() => {
  let ctx = null;
  function ensureCtx(){
    if (!ctx){
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC){ try { ctx = new AC(); } catch (_){ ctx = null; } }
    }
    if (ctx && ctx.state === "suspended") ctx.resume().catch(() => {});
    return ctx;
  }
  function tone(freq, { duration = .12, type = "sine", gain = .18, delay = 0, glideTo = null } = {}){
    if (!state.soundEnabled) return;
    const c = ensureCtx();
    if (!c) return;
    const t0 = c.currentTime + delay;
    const osc = c.createOscillator();
    const g = c.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t0);
    if (glideTo) osc.frequency.exponentialRampToValueAtTime(glideTo, t0 + duration);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(gain, t0 + .012);
    g.gain.exponentialRampToValueAtTime(.0001, t0 + duration);
    osc.connect(g); g.connect(c.destination);
    osc.start(t0); osc.stop(t0 + duration + .03);
  }
  return {
    dot(){ tone(300, { duration: .06, gain: .09 }); },
    single(){ tone(430, { duration: .09, gain: .12 }); },
    two(){ tone(430, { duration: .08, gain: .12 }); tone(540, { duration: .09, gain: .12, delay: .07 }); },
    three(){ tone(430, { duration: .07, gain: .11 }); tone(520, { duration: .07, gain: .11, delay: .06 }); tone(620, { duration: .09, gain: .12, delay: .12 }); },
    four(){ tone(660, { duration: .16, type: "triangle", gain: .18 }); tone(880, { duration: .22, type: "triangle", gain: .14, delay: .05 }); },
    six(){ tone(660, { duration: .14, type: "triangle", gain: .2 }); tone(880, { duration: .14, type: "triangle", gain: .18, delay: .06 }); tone(1108, { duration: .3, type: "triangle", gain: .16, delay: .12 }); },
    extra(){ tone(300, { duration: .1, type: "square", gain: .07 }); },
    wicket(){ tone(190, { duration: .38, type: "sawtooth", gain: .2, glideTo: 65 }); },
    win(){ tone(523, { duration: .15, gain: .16 }); tone(659, { duration: .15, gain: .16, delay: .14 }); tone(784, { duration: .32, gain: .18, delay: .28 }); },
    tap(){ tone(520, { duration: .05, gain: .08 }); },
    runs(n){
      if (n === 0) this.dot();
      else if (n === 1) this.single();
      else if (n === 2) this.two();
      else if (n === 3) this.three();
      else if (n === 4) this.four();
      else if (n === 6) this.six();
      else this.single();
    }
  };
})();

function renderPlayersDatalist(){
  return `<datalist id="players-datalist">${suggestionPlayerNames().map(n => `<option value="${escapeHtml(n)}">`).join("")}</datalist>`;
}
/* A match started from saved tournament teams (match.squads) gets one list
   per side, so the batter/bowler/fielder boxes only suggest that side's
   players -- the batting side minus whoever is out or already in. */
function squadListId(teamKey){
  return state.match && state.match.squads ? `squad-${teamKey}-datalist` : "players-datalist";
}
function renderSquadDatalists(){
  const m = state.match;
  if (!m || !m.squads || m.status === "complete") return "";
  const inn = currentInnings(m);
  const used = new Set(inn.batting.order.filter(n => inn.batting.stats[n].out || n === inn.striker || n === inn.nonStriker).map(n => n.toLowerCase()));
  return ["A", "B"].map(key => {
    const names = (m.squads[key] || []).filter(n => key !== inn.battingTeam || !used.has(n.toLowerCase()));
    return `<datalist id="squad-${key}-datalist">${names.map(n => `<option value="${escapeHtml(n)}">`).join("")}</datalist>`;
  }).join("");
}
function renderTeamsDatalist(){
  return `<datalist id="teams-datalist">${suggestionTeamNames().map(n => `<option value="${escapeHtml(n)}">`).join("")}</datalist>`;
}
function renderBackBar(label, view){
  return `<button data-action="go-view" data-view="${view}" class="back-bar">‹ ${label}</button>`;
}
/* --- topbar: one sticky row (hamburger + sound + sign-in) replacing the
   three independently-floating circular buttons that used to stack at
   top-right. The hamburger only appears when canNavigate (see render()'s
   documented "no navigating away from a live match" rule); mid-match it's
   replaced by a live-dot + "TeamA v TeamB" instead, and a forfeit icon
   joins the right cluster -- both only while a match is actually in
   progress (not once it's "complete", which is the one case canNavigate
   is false without a live match: the Result screen still shows the
   static brand mark there, since Result already has its own explicit
   "New match"/"Back to..." exit and isn't wired to also exit via the
   side menu). Sign-in only appears when signed out and off the auth
   screens themselves, same condition the old floating signin-toggle used. */
function renderTopBar(canNavigate, onAuthScreen){
  const m = state.match;
  const inProgress = !!(m && m.status !== "complete");
  const away = inProgress && ui.awayFromMatch;
  const menuBtn = `<button data-action="open-side-menu" class="topbar-icon-btn" aria-label="Open menu">☰</button>`;
  return `
    <header class="topbar">
      <div class="topbar-left">
        ${inProgress
          ? menuBtn + (away
              ? `<button data-action="resume-match" class="topbar-live"><span class="live-dot"></span>Live · ${escapeHtml(m.teamA)} v ${escapeHtml(m.teamB)}</button>`
              : `<span class="live-dot"></span><span class="topbar-match">${escapeHtml(m.teamA)} v ${escapeHtml(m.teamB)}</span>`)
          : canNavigate ? menuBtn : `<span class="topbar-brand">🏏 Cricket.lk</span>`}
      </div>
      <div class="topbar-right">
        ${inProgress && !away ? `<button data-action="open-forfeit" class="topbar-icon-btn" aria-label="Forfeit match">🚩</button>` : ""}
        ${canNavigate && !inProgress && !onAuthScreen
          ? (session
              ? `<button data-action="go-account" class="topbar-icon-btn" aria-label="Account">👤</button>`
              : `<button data-action="go-account" class="topbar-signin">Sign in</button>`)
          : ""}
        <button data-action="toggle-sound" class="topbar-icon-btn" aria-label="${state.soundEnabled ? "Mute sound" : "Unmute sound"}">${state.soundEnabled ? "🔊" : "🔇"}</button>
      </div>
    </header>
  `;
}
function renderSideMenu(){
  if (!ui.sideMenuOpen) return "";
  const clubRole = state.activeClubId ? (ui.myClubs || []).find(c => c.id === state.activeClubId) : null;
  const items = [

          <span class="icon">${it.icon}</span><span>${escapeHtml(it.label)}</span>
        </button>
      `).join("")}
    </nav>
  `;
}

/* --- home --- */
/* "Recent matches" is scoped to the role you're in -- three different
   sources, never mixed: guest = this device's archived matches with no
   clubId; club (Home, "Acting as" a club) = that club's matches, cloud-loaded
   and merged with the local archive by id; Premier = level:"premier" matches
   on the Premier screen. */
function recentMatchesFor(matches, n){
  const byId = new Map();
  matches.forEach(m => byId.set(m.id || `${m.teamA}-${m.teamB}-${m.completedAt}`, m));
  return [...byId.values()].sort((a, b) => (b.completedAt || 0) - (a.completedAt || 0)).slice(0, n);
}
function renderRecentMatches(title, matches){
  if (!matches.length) return "";
  return `
    <div class="home-section">
      <h3>${escapeHtml(title)}</h3>
      ${matches.map(m => `
        <div class="list-row">
          <span>${escapeHtml(m.teamA)} v ${escapeHtml(m.teamB)}<br><span class="muted">${escapeHtml(m.result || "")}${m.completedAt ? " · " + new Date(m.completedAt).toLocaleDateString(undefined, { day: "numeric", month: "short" }) : ""}</span></span>
        </div>
      `).join("")}
    </div>
  `;
}

function handleSignInSubmit(e){
  e.preventDefault();
  if (!supabaseClient) return;
  const form = e.target;
  const f = new FormData(form);
  const email = (f.get("email") || "").trim();
  const password = f.get("password") || "";
  supabaseClient.auth.signInWithPassword({ email, password }).then(({ data, error }) => {
    if (error){ showFormError(form, error.message); return; }
    session = data.session;
    ui.myClubs = null; // force a fresh fetch under the newly-signed-in account
    refreshProfileAndAdmin().then(() => {
      state.view = "account";
      save(); render();
    });
  });
}

function handleSignUpSubmit(e){
  e.preventDefault();
  if (!supabaseClient) return;
  const form = e.target;
  const f = new FormData(form);
  const displayName = (f.get("displayName") || "").trim();
  const email = (f.get("email") || "").trim();
  const password = f.get("password") || "";
  supabaseClient.auth.signUp({
    email, password,
    options: { data: { display_name: displayName } }
  }).then(({ data, error }) => {
    if (error){ showFormError(form, error.message); return; }
    if (!data.session){
      // Email confirmation is required before a session exists.
      state.view = "signIn";
      save(); render();
      return;
    }
    session = data.session;
    refreshProfileAndAdmin().then(() => {
      state.view = "account";
      save(); render();
    });
  });
}

// The name for ui.currentClubId, without requiring a full fetchClubDetail
// first -- Home's quick-action cards jump straight into these setup
// screens (see "go-club-match-setup"/"go-club-tournament-setup"), so
// ui.club may not be loaded (or may still hold a *different* club's
// detail from an earlier visit). ui.myClubs (fetched for the Home
// switcher) already has the name; prefer the richer ui.club only when
// it's actually for the right club.
function currentClubName(){
  if (ui.club && ui.club.id === ui.currentClubId) return ui.club.name;
  const fromList = (ui.myClubs || []).find(c => c.id === ui.currentClubId);
  return fromList ? fromList.name : "";
}

/* --- club-scoped screens: Players / Presets / Stats. Reached from Home's
   tiles (and the side menu) while "Acting as" a club, they show only that
   club's cloud data -- never the guest lists. ui.currentClubId is the club
   (set by "go-club-view" from state.activeClubId). --- */
function clubMatchesFor(clubId){
  const local = Object.values(state.matchHistory).filter(m => m.clubId === clubId);
  const cloud = ui.club && ui.club.id === clubId ? ui.club.matches.map(x => x.data).filter(Boolean) : [];
  const byId = new Map();
  local.concat(cloud).forEach(m => byId.set(m.id || `${m.teamA}-${m.teamB}-${m.completedAt}`, m));
  return [...byId.values()];
}
