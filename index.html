<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0D3D2E">
<title>Cricket.lk — Ball-by-ball Scorer</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<style>
  :root{
    --bg:#050B0A; --bg-2:#0A1613;
    --panel:rgba(255,255,255,.05); --panel-2:rgba(255,255,255,.07);
    --panel-solid:#101E1B; --line:rgba(255,255,255,.10); --line-strong:rgba(255,255,255,.20);
    --text:#F4F8F6; --muted:#8FA9A0;
    --accent:#FFC247; --accent-rgb:255,194,71; --accent-light:#FFD873; --accent-dim:#B4791C; --accent-ink:#231200;
    --accent-2:#33E29B; --accent-2-rgb:51,226,155; --accent-2-light:#5FF0AE; --accent-2-dim:#1C8F63; --accent-2-ink:#022417;
    --danger:#FF5D70; --wicket:#FF4D63; --info:#5FC7FF;
    --radius-lg:22px; --radius-md:16px; --radius-sm:11px;
    --shadow-card:0 10px 32px -14px rgba(0,0,0,.6), 0 1px 0 rgba(255,255,255,.03) inset;
    --shadow-btn:0 8px 18px -8px rgba(0,0,0,.55);
    --shadow-glow-gold:0 0 0 1px rgba(var(--accent-rgb),.35), 0 8px 24px -8px rgba(var(--accent-rgb),.35);
    --shadow-glow-green:0 0 0 1px rgba(var(--accent-2-rgb),.35), 0 8px 24px -8px rgba(var(--accent-2-rgb),.35);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(900px 480px at 12% -8%, rgba(var(--accent-2-rgb),.16), transparent 60%),
      radial-gradient(760px 420px at 108% 6%, rgba(var(--accent-rgb),.12), transparent 58%),
      radial-gradient(820px 560px at 50% 115%, rgba(95,199,255,.07), transparent 62%),
      linear-gradient(180deg, var(--bg-2), var(--bg) 45%);
    background-attachment:fixed;
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-tap-highlight-color:transparent;
  }
  #app{max-width:520px;margin:0 auto;padding:16px 16px calc(24px + env(safe-area-inset-bottom));min-height:100vh;position:relative;}
  h1,h2,h3{margin:0 0 8px;letter-spacing:-.01em;}
  h1{font-size:1.7rem;font-weight:800;}
  h2{font-weight:800;}
  p{margin:0 0 12px;color:var(--muted);}
  .tagline{margin-top:-4px;}
  label{display:block;font-size:.85rem;color:var(--muted);margin-bottom:12px;}
  input[type=text],input[type=number],input:not([type]),select{
    display:block;width:100%;margin-top:4px;padding:12px 13px;border-radius:var(--radius-sm);
    border:1px solid var(--line);background:var(--panel-2);color:var(--text);font-size:1rem;
    transition:border-color .15s ease, box-shadow .15s ease, background .15s ease;
  }
  input::placeholder{color:var(--muted);opacity:.7;}
  input:focus,select:focus{outline:none;border-color:var(--accent-2);box-shadow:0 0 0 3px rgba(var(--accent-2-rgb),.18);background:rgba(255,255,255,.09);}
  input[type=color]{margin-top:4px;padding:2px;height:44px;width:100%;border-radius:var(--radius-sm);border:1px solid var(--line);background:var(--panel-2);cursor:pointer;}
  fieldset{border:1px solid var(--line);border-radius:var(--radius-md);margin-bottom:12px;padding:12px 14px;}
  legend{color:var(--muted);font-size:.8rem;padding:0 4px;text-transform:uppercase;letter-spacing:.04em;}
  fieldset label{display:inline-flex;align-items:center;gap:6px;margin:4px 12px 4px 0;color:var(--text);}
  button{font:inherit;cursor:pointer;}
  button.primary{
    width:100%;padding:14px;border:none;border-radius:var(--radius-md);
    background:linear-gradient(160deg,var(--accent-light),var(--accent) 55%,var(--accent-dim));
    color:var(--accent-ink);font-weight:800;font-size:1.02rem;margin-top:6px;
    box-shadow:var(--shadow-btn),var(--shadow-glow-gold);
  }
  button.ghost{
    padding:10px 14px;border-radius:var(--radius-sm);border:1px solid var(--line-strong);
    background:var(--panel-2);color:var(--text);
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  }
  button.link-btn{
    display:block;width:100%;text-align:center;background:none;border:none;color:var(--accent-2);
    padding:10px;font-size:.9rem;font-weight:600;
  }
  button:disabled{opacity:.4;cursor:not-allowed;box-shadow:none;}

  .screen{padding-top:4px;}
  .form-error{color:var(--wicket);font-size:.85rem;min-height:0;margin-bottom:4px;font-weight:600;}
  .form-error:empty{display:none;}

  .score-header{margin-bottom:4px;}
  .teams{font-size:1.02rem;font-weight:600;}
  .vs{color:var(--muted);font-weight:400;}
  .target-line{color:var(--accent-2);font-size:.85rem;margin-top:2px;font-weight:600;}
  .score-big{
    font-size:2.8rem;font-weight:800;line-height:1.1;margin:8px 0 0;letter-spacing:-.02em;
    font-variant-numeric:tabular-nums;
    background:linear-gradient(180deg,#fff,#D8E8E1 70%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    text-shadow:0 18px 40px rgba(var(--accent-2-rgb),.18);
  }
  .score-big .overs{font-size:1.1rem;color:var(--muted);font-weight:600;-webkit-text-fill-color:var(--muted);}
  .rate-line{color:var(--muted);font-size:.9rem;margin-bottom:8px;font-variant-numeric:tabular-nums;}
  .freehit-badge{
    display:inline-block;background:linear-gradient(120deg,var(--accent-light),var(--accent));color:var(--accent-ink);font-weight:800;
    font-size:.75rem;padding:4px 11px;border-radius:20px;margin-bottom:8px;letter-spacing:.04em;
    box-shadow:var(--shadow-glow-gold);
  }

  .players-card,.innings-summary,.roster-card,.preset-form,.motm-card{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-lg);
    -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);box-shadow:var(--shadow-card);
  }
  .players-card{padding:12px 16px;margin-bottom:12px;}
  .player-row{display:flex;justify-content:space-between;padding:7px 0;font-size:.95rem;border-bottom:1px solid var(--line);}
  .player-row:last-child{border-bottom:none;}
  .player-row.on-strike .name{color:var(--accent);font-weight:800;}
  .player-row.bowler-row{color:var(--muted);}
  .figs{color:var(--muted);font-variant-numeric:tabular-nums;}
  .player-row.on-strike .figs{color:var(--text);font-weight:600;}

  .this-over{margin-bottom:14px;}
  .this-over .label{display:block;font-size:.8rem;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.04em;}
  .chips{display:flex;flex-wrap:wrap;gap:7px;}
  .chip{
    min-width:32px;height:32px;padding:0 7px;border-radius:9px;background:var(--panel-2);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;font-size:.85rem;font-weight:700;
  }
  .chip.wicket{background:linear-gradient(160deg,#FF7A8A,var(--wicket));color:#fff;border-color:transparent;box-shadow:0 4px 14px -4px rgba(255,77,99,.6);}
  .chip.empty{color:var(--muted);background:none;border-style:dashed;}

  .run-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px;}
  .run-pad.small{grid-template-columns:repeat(4,1fr);}
  .run-btn{
    padding:17px 0;border-radius:var(--radius-md);border:1px solid var(--line);background:var(--panel-2);color:var(--text);
    font-size:1.3rem;font-weight:800;
  }
  .run-btn.r4{background:linear-gradient(160deg,var(--accent-2-light),var(--accent-2));color:var(--accent-2-ink);border-color:transparent;box-shadow:var(--shadow-glow-green);}
  .run-btn.r6{background:linear-gradient(160deg,var(--accent-light),var(--accent));color:var(--accent-ink);border-color:transparent;box-shadow:var(--shadow-glow-gold);}
  .run-btn.active{outline:2px solid var(--accent);outline-offset:1px;}

  .extra-pad{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:6px;}
  .extra-pad button{
    padding:10px 2px;border-radius:var(--radius-sm);border:1px solid var(--line);background:var(--panel);
    color:var(--text);font-size:.82rem;font-weight:600;
  }
  .extra-pad button.active{background:linear-gradient(160deg,var(--accent-light),var(--accent));color:var(--accent-ink);border-color:transparent;font-weight:800;}
  .extra-hint{font-size:.8rem;color:var(--accent);margin-bottom:8px;}

  .action-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px;margin-bottom:10px;}
  .wicket-btn{
    padding:14px 0;border-radius:var(--radius-md);border:none;
    background:linear-gradient(160deg,#FF8393,var(--wicket));color:#fff;font-weight:800;font-size:1rem;
    box-shadow:var(--shadow-btn),0 8px 24px -8px rgba(255,77,99,.45);
  }

  table{width:100%;border-collapse:collapse;margin-bottom:10px;font-size:.85rem;}
  th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;}
  th{color:var(--muted);font-weight:700;font-size:.72rem;text-transform:uppercase;letter-spacing:.04em;}
  td.status{color:var(--muted);font-size:.78rem;}
  .extras-line,.fow{font-size:.8rem;color:var(--muted);margin-bottom:10px;}
  .innings-summary{padding:14px 16px;margin-bottom:14px;overflow-x:auto;}
  .innings-summary .ov{color:var(--muted);font-weight:600;font-size:1rem;}

  .target-note{color:var(--accent-2);font-weight:600;}

  .modal-backdrop{
    position:fixed;inset:0;background:rgba(2,6,5,.65);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
    display:flex;align-items:flex-end;justify-content:center;z-index:50;
  }
  .modal{
    position:relative;background:var(--panel-solid);width:100%;max-width:520px;border-radius:24px 24px 0 0;
    border:1px solid var(--line-strong);border-bottom:none;
    padding:22px 18px calc(20px + env(safe-area-inset-bottom));max-height:88vh;overflow-y:auto;
    box-shadow:0 -20px 60px -20px rgba(0,0,0,.65);
  }
  .modal::before{
    content:"";position:absolute;top:10px;left:50%;transform:translateX(-50%);
    width:40px;height:4px;border-radius:4px;background:var(--line-strong);
  }
  .wicket-types{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;}
  .wicket-types button{
    padding:15px 4px;border-radius:var(--radius-md);border:1px solid var(--line);background:var(--panel-2);color:var(--text);font-weight:700;
  }
  .hint{font-size:.85rem;color:var(--muted);}

  /* --- animation: every render replaces innerHTML wholesale, so these
     keyframes simply replay on every re-render without any JS bookkeeping.
     Every render() call replaces the whole .screen wholesale — including on
     rapid, same-screen updates like each ball scored — so this needs to stay
     a fast, shallow settle (never fully transparent) rather than a full
     fade-in, or the live-scoring screen visibly flickers on every tap. --- */
  @keyframes screenIn{ from{ opacity:.72; transform:translateY(3px); } to{ opacity:1; transform:translateY(0); } }
  @keyframes backdropIn{ from{ opacity:0; } to{ opacity:1; } }
  @keyframes modalUp{ from{ opacity:0; transform:translateY(24px); } to{ opacity:1; transform:translateY(0); } }
  @keyframes chipPop{ from{ opacity:0; transform:scale(.5); } to{ opacity:1; transform:scale(1); } }
  @keyframes scorePulse{ 0%{ transform:scale(.96); } 60%{ transform:scale(1.02); } 100%{ transform:scale(1); } }
  @keyframes badgePulse{ 0%,100%{ opacity:1; } 50%{ opacity:.6; } }

  .screen{ animation:screenIn .15s ease; }
  .modal-backdrop{ animation:backdropIn .2s ease; }
  .modal{ animation:modalUp .28s cubic-bezier(.16,1,.3,1); }
  .chip{ animation:chipPop .22s cubic-bezier(.34,1.56,.64,1); }
  .score-big{ animation:scorePulse .3s ease; }
  .freehit-badge{ animation:badgePulse 1.6s ease-in-out infinite; }
  button{ transition:transform .12s ease, background-color .15s ease, border-color .15s ease, opacity .15s ease, box-shadow .15s ease; }
  button:active:not(:disabled){ transform:scale(.96); }
  .home-card, .list-row, .preset-chip{ transition:transform .12s ease, border-color .15s ease, box-shadow .15s ease; }
  .home-card:active, .list-row:active{ transform:scale(.98); }

  /* --- sound toggle --- */
  .sound-toggle{
    position:fixed;top:calc(14px + env(safe-area-inset-top));right:14px;z-index:40;
    width:38px;height:38px;padding:0;border-radius:50%;
    background:var(--panel-2);border:1px solid var(--line-strong);color:var(--text);font-size:1rem;
    -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:var(--shadow-card);
    display:flex;align-items:center;justify-content:center;
  }

  /* --- home --- */
  .home-logo{ width:56px; height:56px; border-radius:var(--radius-md); object-fit:cover; margin-bottom:8px; border:1px solid var(--line); }
  .back-bar{ display:inline-block; background:none; border:none; color:var(--accent-2); font-size:.9rem; padding:4px 0; margin-bottom:10px; font-weight:600; }
  .home-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:18px; }
  .home-card{
    display:flex; flex-direction:column; align-items:flex-start; gap:2px; text-align:left;
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius-lg); padding:16px; color:var(--text);
    -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);box-shadow:var(--shadow-card);
  }
  .home-card.primary-card{
    background:linear-gradient(150deg,var(--accent-2-light),var(--accent-2) 55%,var(--accent-2-dim));
    color:var(--accent-2-ink); border-color:transparent; box-shadow:var(--shadow-btn),var(--shadow-glow-green);
  }
  .home-card-icon{ font-size:1.7rem; }
  .home-card-title{ font-weight:800; font-size:.98rem; margin-top:6px; }
  .home-card-sub{ font-size:.78rem; color:var(--muted); }
  .home-card.primary-card .home-card-sub{ color:var(--accent-2-ink); opacity:.7; }
  .home-section{ margin-top:6px; }
  .home-section h3{ color:var(--muted); font-size:.85rem; text-transform:uppercase; letter-spacing:.06em; margin-bottom:8px; }

  .list-row{
    display:flex; justify-content:space-between; align-items:center; width:100%;
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius-md);
    padding:13px 15px; margin-bottom:8px; color:var(--text); text-align:left; font-size:.95rem;
    -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  }
  .list-row.active{ border-color:var(--accent-2); box-shadow:0 0 0 1px var(--accent-2) inset; }
  .list-row .chevron{ color:var(--muted); }
  .list-row .muted{ color:var(--muted); font-size:.8rem; }

  /* --- presets / tabs / shared form bits --- */
  .preset-picker{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px; }
  .preset-chip{ padding:9px 15px; border-radius:20px; border:1px solid var(--line); background:var(--panel); color:var(--text); font-size:.85rem; font-weight:600; }
  .preset-chip.active{ background:linear-gradient(150deg,var(--accent-2-light),var(--accent-2)); color:var(--accent-2-ink); border-color:transparent; font-weight:800; box-shadow:var(--shadow-glow-green); }

  .field-row{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .check-row{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .inline-num{ display:inline-block; width:54px !important; margin:0 !important; padding:6px 8px !important; }

  .tab-row{ display:flex; gap:0; margin-bottom:14px; border-bottom:1px solid var(--line); }
  .tab-btn{ background:none; border:none; color:var(--muted); padding:8px 4px; margin-right:18px; font-size:.9rem; font-weight:600; border-bottom:2px solid transparent; }
  .tab-btn.active{ color:var(--text); border-bottom-color:var(--accent); font-weight:800; }

  .preset-list{ margin-bottom:10px; }
  .preset-row{
    display:flex; justify-content:space-between; align-items:flex-start; gap:8px;
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius-md); padding:13px 15px; margin-bottom:8px;
    -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  }
  .preset-row .muted{ color:var(--muted); font-size:.78rem; margin-top:2px; }
  .row-actions{ display:flex; gap:6px; flex-shrink:0; }
  .preset-form{ padding:16px; margin-top:10px; }

  .appearance-tab{ padding-top:2px; }
  .logo-row{ display:flex; align-items:center; gap:14px; margin-bottom:18px; }
  .logo-preview{ width:64px; height:64px; border-radius:var(--radius-md); object-fit:cover; border:1px solid var(--line); background:var(--panel-2); flex-shrink:0; }
  .logo-placeholder{ width:64px; height:64px; border-radius:var(--radius-md); border:1px dashed var(--line-strong); display:flex; align-items:center; justify-content:center; font-size:1.6rem; background:var(--panel); flex-shrink:0; }
  .logo-actions{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .file-label{
    display:inline-block; padding:8px 12px; border-radius:var(--radius-sm); border:1px solid var(--line-strong);
    background:var(--panel-2); color:var(--text); font-size:.8rem; font-weight:600; cursor:pointer;
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  }

  /* --- teams & players --- */
  .roster-card{ padding:16px; margin-top:12px; }
  .roster-header{ display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
  .roster-row{ align-items:center; }
  .roster-actions{ display:flex; gap:6px; align-items:center; }
  .roster-actions select{ width:auto; margin:0; padding:6px 8px; font-size:.8rem; }

  /* --- standings / fixtures / leaderboards --- */
  .standings-table td, .standings-table th{ text-align:center; }
  .standings-table td:first-child, .standings-table th:first-child{ text-align:left; }
  .fixtures{ margin-bottom:14px; }
  .fixture-row{
    display:flex; justify-content:space-between; background:var(--panel); border:1px solid var(--line); border-radius:var(--radius-sm);
    padding:11px 13px; margin-bottom:6px; font-size:.9rem; -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  }
  .fixture-result{ color:var(--accent-2); font-weight:600; }
  .leaderboard{ margin-bottom:18px; }
  .leaderboard h3{ font-size:.95rem; margin-bottom:6px; }

  /* --- MVP / MOTM / share --- */
  .mvp-callout{
    background:linear-gradient(150deg,var(--accent-light),var(--accent) 60%,var(--accent-dim)); color:var(--accent-ink);
    border-radius:var(--radius-lg); padding:16px; display:flex; flex-direction:column; gap:2px; margin-bottom:16px;
    box-shadow:var(--shadow-btn),var(--shadow-glow-gold);
  }
  .mvp-label{ font-size:.75rem; text-transform:uppercase; letter-spacing:.06em; opacity:.75; font-weight:700; }
  .mvp-name{ font-size:1.35rem; font-weight:800; }
  .mvp-points{ font-size:.85rem; font-weight:700; }
  .motm-card{ padding:16px; margin-bottom:16px; display:flex; flex-direction:column; gap:4px; }
  .motm-label{ font-size:.75rem; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; font-weight:700; }
  .motm-name{
    font-size:1.25rem; font-weight:800; background:linear-gradient(120deg,var(--accent-light),var(--accent));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .motm-card .inline-form{ margin-top:4px; margin-bottom:0; }
  .share-row{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:12px 0; }

  .inline-form{ display:flex; gap:8px; margin-bottom:14px; }
  .inline-form input, .inline-form select{ margin:0; flex:1; }
  .inline-form button{ flex-shrink:0; margin-top:0; width:auto; white-space:nowrap; }

  button.small{ padding:8px 12px; font-size:.8rem; border-radius:var(--radius-sm); }
  button.primary.small{ width:auto; }

  /* --- print: "Export PDF" is window.print() on the result screen --- */
  @media print{
    body{ background:#fff; color:#000; }
    #modal-root, .share-row, .motm-card form, button, .sound-toggle{ display:none !important; }
    .innings-summary, .motm-card{ background:#fff; border:1px solid #ccc; color:#000; box-shadow:none; }
    .motm-name{ -webkit-text-fill-color:#000; color:#000; }
    .score-big{ -webkit-text-fill-color:#000; color:#000; text-shadow:none; }
    table, th, td{ border-color:#ccc; color:#000; }
    th{ color:#555; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="modal-root"></div>
<script>
/* ============================================================
   1. REFERENCE DATA
   ============================================================ */
const WICKET_LABELS = {
  bowled: "bowled", caught: "caught", lbw: "lbw",
  stumped: "stumped", hitwicket: "hit wicket", runout: "run out"
};

/* Fixed MVP/MOTM point formula — not user-tunable in v1 (see README). */
const MVP_POINTS = {
  perRun: 1, perFour: 1, perSix: 2, fifty: 8, century: 16, notOut: 4,
  perWicket: 25, perMaiden: 8, perCatch: 8, perRunOut: 8
};

const DEFAULT_MATCH_PRESETS = [
  { id: "preset-t20", name: "T20 (6-ball overs)", ballsPerOver: 6, oversLimit: 20, playersPerSide: 11,

/* ============================================================
   2. ENGINE — pure functions, zero DOM access.
   ============================================================ */
function createInnings(battingTeam, bowlingTeam, target, playersPerSide, oversLimit, config){
  const cfg = config || {};
  return {
    battingTeam, bowlingTeam, target, oversLimit,
    ballsPerOver: cfg.ballsPerOver || 6,
    wideBaseRuns: cfg.wideRuns != null ? cfg.wideRuns : 1,
    noBallBaseRuns: cfg.noBallRuns != null ? cfg.noBallRuns : 1,
    freeHitOnNoBall: cfg.freeHitOnNoBall !== false,
    maxWickets: playersPerSide - 1,
    runs: 0, wickets: 0, legalBalls: 0,
    extras: { wides: 0, noBalls: 0, byes: 0, legByes: 0 },
    freeHit: false,
    currentOverEvents: [],
    overs: [],
    batting: { order: [], stats: {} },
    bowling: { order: [], stats: {} },
    fielding: { order: [], stats: {} },
    striker: null, nonStriker: null, bowler: null, lastOverBowler: null,
    fallOfWickets: [],
    complete: false, completeReason: null
  };
}

function ensureBatsman(inn, name){
  if (!inn.batting.stats[name]){
    inn.batting.stats[name] = { runs: 0, balls: 0, fours: 0, sixes: 0, out: false, howOut: null };
    inn.batting.order.push(name);
  }
}

function ensureBowler(inn, name){
  if (!inn.bowling.stats[name]){
    inn.bowling.stats[name] = { legalBalls: 0, runs: 0, wickets: 0, maidens: 0, curOverRuns: 0, curOverLegal: 0 };
    inn.bowling.order.push(name);
  }
}

function ensureFielder(inn, name){
  if (!inn.fielding.stats[name]){
    inn.fielding.stats[name] = { catches: 0, runouts: 0 };
    inn.fielding.order.push(name);
  }
}

function oversDisplay(legalBalls, ballsPerOver){
  const bpo = ballsPerOver || 6;
  return `${Math.floor(legalBalls / bpo)}.${legalBalls % bpo}`;
}

function runRate(runs, legalBalls, ballsPerOver){
  const bpo = ballsPerOver || 6;
  return legalBalls > 0 ? (runs / (legalBalls / bpo)) : 0;
}

function requiredRunRate(inn){
  if (inn.target == null) return null;
  const bpo = inn.ballsPerOver || 6;
  const ballsLeft = inn.oversLimit * bpo - inn.legalBalls;
  if (ballsLeft <= 0) return null;
  const runsNeeded = inn.target - inn.runs;
  return runsNeeded / (ballsLeft / bpo);
}

function swapStrike(inn){
  const t = inn.striker; inn.striker = inn.nonStriker; inn.nonStriker = t;
}

function pendingBatsmanSlot(inn){
  if (inn.complete) return null;
  if (!inn.striker) return "striker";
  if (!inn.nonStriker) return "nonStriker";
  return null;
}

function checkInningsComplete(inn){
  const bpo = inn.ballsPerOver || 6;
  if (inn.target != null && inn.runs >= inn.target){ inn.complete = true; inn.completeReason = "target"; }
  else if (inn.wickets >= inn.maxWickets){ inn.complete = true; inn.completeReason = "allout"; }
  else if (inn.legalBalls >= inn.oversLimit * bpo){ inn.complete = true; inn.completeReason = "overs"; }
}

/* event: { kind: 'run'|'wide'|'noball'|'bye'|'legbye'|'wicket',
            runs, wicketType, endComingIn, fielder }
   A wicket is always recorded as happening on a legal delivery — run-outs
   off a wide/no-ball are a known simplification, not modelled here.
   `fielder` is optional on wicketType 'caught'/'runout' and credits a
   fielding-side player with a catch/run-out for stats/MVP purposes. */
function recordBall(inn, event){
  const bat = inn.batting.stats;
  const bwl = inn.bowling.stats[inn.bowler];
  const legal = event.kind !== "wide" && event.kind !== "noball";
  let ballRuns = 0, display = "", rotate = false;

  if (event.kind === "run"){
    ballRuns = event.runs;
    bat[inn.striker].runs += event.runs;
    bat[inn.striker].balls += 1;
    if (event.runs === 4) bat[inn.striker].fours += 1;
    if (event.runs === 6) bat[inn.striker].sixes += 1;
    rotate = event.runs % 2 === 1;
    display = String(event.runs);
  } else if (event.kind === "wide"){
    ballRuns = inn.wideBaseRuns + (event.runs || 0);
    inn.extras.wides += ballRuns;
    display = event.runs ? `Wd+${event.runs}` : "Wd";
  } else if (event.kind === "noball"){
    const off = event.runs || 0;
    ballRuns = inn.noBallBaseRuns + off;
    inn.extras.noBalls += inn.noBallBaseRuns;
    bat[inn.striker].balls += 1;
    if (off > 0){
      bat[inn.striker].runs += off;
      if (off === 4) bat[inn.striker].fours += 1;
      if (off === 6) bat[inn.striker].sixes += 1;
    }
    rotate = off % 2 === 1;
    display = off ? `Nb+${off}` : "Nb";
  } else if (event.kind === "bye" || event.kind === "legbye"){
    ballRuns = event.runs;
    if (event.kind === "bye") inn.extras.byes += ballRuns; else inn.extras.legByes += ballRuns;
    bat[inn.striker].balls += 1;
    rotate = ballRuns % 2 === 1;
    display = (event.kind === "bye" ? "B" : "Lb") + ballRuns;
  } else if (event.kind === "wicket"){
    if (event.wicketType === "runout"){
      ballRuns = event.runs || 0;
      bat[inn.striker].runs += ballRuns;
      bat[inn.striker].balls += 1;
      const outName = inn[event.endComingIn];
      bat[outName].out = true;
      bat[outName].howOut = event.fielder ? `run out (${event.fielder})` : "run out";
      inn.wickets += 1;
      inn[event.endComingIn] = null;
      if (event.fielder){ ensureFielder(inn, event.fielder); inn.fielding.stats[event.fielder].runouts += 1; }
      display = ballRuns ? `${ballRuns}+Ro` : "Ro";
    } else {
      bat[inn.striker].balls += 1;
      bat[inn.striker].out = true;
      bat[inn.striker].howOut = (event.wicketType === "caught" && event.fielder)
        ? `c ${event.fielder} b ${inn.bowler}`
        : `${WICKET_LABELS[event.wicketType]} b ${inn.bowler}`;
      bwl.wickets += 1;
      inn.wickets += 1;
      inn.striker = null;
      if (event.wicketType === "caught" && event.fielder){ ensureFielder(inn, event.fielder); inn.fielding.stats[event.fielder].catches += 1; }
      display = "W";
    }
  }

  inn.runs += ballRuns;
  if (legal){ inn.legalBalls += 1; bwl.legalBalls += 1; bwl.curOverLegal += 1; }
  if (event.kind !== "bye" && event.kind !== "legbye"){ bwl.runs += ballRuns; bwl.curOverRuns += ballRuns; }
  if (event.kind === "wicket"){
    inn.fallOfWickets.push({ score: inn.runs, wicket: inn.wickets, over: oversDisplay(inn.legalBalls, inn.ballsPerOver) });
  }

  inn.currentOverEvents.push({ display, isWicket: event.kind === "wicket" });

  if (legal) inn.freeHit = false;
  if (event.kind === "noball" && inn.freeHitOnNoBall) inn.freeHit = true;
  if (rotate) swapStrike(inn);

  checkInningsComplete(inn);

  const overCompleted = legal && inn.legalBalls % inn.ballsPerOver === 0;
  if (overCompleted){
    if (bwl.curOverRuns === 0) bwl.maidens += 1;
    inn.overs.push({ bowler: inn.bowler, events: inn.currentOverEvents });
    inn.currentOverEvents = [];
    bwl.curOverRuns = 0; bwl.curOverLegal = 0;
    if (!inn.complete){
      inn.lastOverBowler = inn.bowler;
      inn.bowler = null;
      swapStrike(inn);
    }
  }
}

function createMatch({ teamA, teamB, oversLimit, playersPerSide, battingFirst, ballsPerOver, wideRuns, noBallRuns, wideEnabled, noBallEnabled, freeHitOnNoBall, requireFielderOnCatch, requireFielderOnRunout, presetId, presetName, tournamentId }){
  const cfg = {
    ballsPerOver: ballsPerOver || 6,
    wideRuns: wideRuns != null ? wideRuns : 1,
    noBallRuns: noBallRuns != null ? noBallRuns : 1,
    freeHitOnNoBall: freeHitOnNoBall !== false
  };
  return {
    teamA, teamB, oversLimit, playersPerSide, battingFirst,
    ballsPerOver: cfg.ballsPerOver,
    wideEnabled: wideEnabled !== false,
    noBallEnabled: noBallEnabled !== false,
    freeHitOnNoBall: cfg.freeHitOnNoBall,
    requireFielderOnCatch: !!requireFielderOnCatch,
    requireFielderOnRunout: !!requireFielderOnRunout,
    presetId: presetId || null,
    presetName: presetName || null,
    tournamentId: tournamentId || null,
    innings: [createInnings(battingFirst, battingFirst === "A" ? "B" : "A", null, playersPerSide, oversLimit, cfg)],
    status: "opening",
    result: null,
    motm: null
  };
}

function currentInnings(match){ return match.innings[match.innings.length - 1]; }

function teamName(match, key){ return key === "A" ? match.teamA : match.teamB; }

function startSecondInnings(match){
  const i1 = match.innings[0];
  const target = i1.runs + 1;
  const cfg = { ballsPerOver: match.ballsPerOver, wideRuns: i1.wideBaseRuns, noBallRuns: i1.noBallBaseRuns, freeHitOnNoBall: i1.freeHitOnNoBall };
  match.innings.push(createInnings(i1.bowlingTeam, i1.battingTeam, target, match.playersPerSide, match.oversLimit, cfg));
  match.status = "opening";
}

function matchResult(match){
  const [i1, i2] = match.innings;
  const bpo = match.ballsPerOver || 6;
  if (i2.runs >= i2.target){
    const wl = i2.maxWickets - i2.wickets;
    const ballsLeft = i2.oversLimit * bpo - i2.legalBalls;
    return `${teamName(match, i2.battingTeam)} won by ${wl} wicket${wl === 1 ? "" : "s"} (${oversDisplay(ballsLeft, bpo)} overs left)`;
  }
  if (i2.runs === i1.runs) return "Match tied";
  const margin = i1.runs - i2.runs;
  return `${teamName(match, i1.battingTeam)} won by ${margin} run${margin === 1 ? "" : "s"}`;
}

function afterBall(match){
  const inn = currentInnings(match);
  if (inn.complete){
    if (match.innings.length === 1) match.status = "innings_break";
    else { match.status = "complete"; match.result = matchResult(match); }
  }
}

/* Ends the match immediately, at any point (before openers are even
   named, mid-innings, at the break — wherever), with the other team
   declared the winner. Deliberately separate from matchResult/afterBall:
   there's no runs margin or chase to compute, and match.innings[1] may
   not exist yet. */
function forfeitMatch(match, forfeitingTeamKey){
  const winnerKey = forfeitingTeamKey === "A" ? "B" : "A";
  match.forfeited = true;
  match.forfeitedBy = forfeitingTeamKey;
  match.status = "complete";
  match.result = `${teamName(match, winnerKey)} won — ${teamName(match, forfeitingTeamKey)} forfeited the match`;
}

/* --- cross-match aggregation: MVP/MOTM, leaderboards, standings ---
   Pure functions over one or more completed matches, kept DOM-free like
   the rest of the engine so they're directly unit-testable. */
function calcPlayerPoints(bat, bowl, field){
  let pts = 0;
  if (bat){
    pts += bat.runs * MVP_POINTS.perRun;
    pts += bat.fours * MVP_POINTS.perFour;
    pts += bat.sixes * MVP_POINTS.perSix;
    if (bat.runs >= 100) pts += MVP_POINTS.century;
    else if (bat.runs >= 50) pts += MVP_POINTS.fifty;
    if (bat.balls > 0 && !bat.out) pts += MVP_POINTS.notOut;
  }
  if (bowl){
    pts += bowl.wickets * MVP_POINTS.perWicket;
    pts += bowl.maidens * MVP_POINTS.perMaiden;
  }
  if (field){
    pts += field.catches * MVP_POINTS.perCatch;
    pts += field.runouts * MVP_POINTS.perRunOut;
  }
  return pts;
}

function emptyPlayerTotal(name){
  return {
    name, runs: 0, balls: 0, fours: 0, sixes: 0, notOuts: 0, innings: 0,
    wickets: 0, legalBalls: 0, runsConceded: 0, maidens: 0,
    catches: 0, runouts: 0, points: 0, matches: 0
  };
}

function foldInningsIntoTotals(totals, inn){
  inn.batting.order.forEach(name => {
    const s = inn.batting.stats[name];
    const t = totals[name] || (totals[name] = emptyPlayerTotal(name));
    t.runs += s.runs; t.balls += s.balls; t.fours += s.fours; t.sixes += s.sixes;
    t.innings += 1;
    if (!s.out) t.notOuts += 1;
    t.points += calcPlayerPoints(s, null, null);
  });
  inn.bowling.order.forEach(name => {
    const b = inn.bowling.stats[name];
    const t = totals[name] || (totals[name] = emptyPlayerTotal(name));
    t.wickets += b.wickets; t.legalBalls += b.legalBalls; t.runsConceded += b.runs; t.maidens += b.maidens;
    t.points += calcPlayerPoints(null, b, null);
  });
  inn.fielding.order.forEach(name => {
    const f = inn.fielding.stats[name];
    const t = totals[name] || (totals[name] = emptyPlayerTotal(name));
    t.catches += f.catches; t.runouts += f.runouts;
    t.points += calcPlayerPoints(null, null, f);
  });
}

function matchPlayerNames(match){
  const names = new Set();
  match.innings.forEach(inn => {
    inn.batting.order.forEach(n => names.add(n));
    inn.bowling.order.forEach(n => names.add(n));
    inn.fielding.order.forEach(n => names.add(n));
  });
  return names;
}

function aggregatePlayerStats(matches){
  const totals = {};
  matches.forEach(match => {
    match.innings.forEach(inn => foldInningsIntoTotals(totals, inn));
    matchPlayerNames(match).forEach(name => { if (totals[name]) totals[name].matches += 1; });
  });
  return Object.values(totals).sort((a, b) => b.points - a.points);
}

function pickMatchMOTM(match){
  const totals = {};
  match.innings.forEach(inn => foldInningsIntoTotals(totals, inn));
  const ranked = Object.values(totals).sort((a, b) => {
    if (b.points !== a.points) return b.points - a.points;
    if (b.runs !== a.runs) return b.runs - a.runs;
    return b.wickets - a.wickets;
  });
  return ranked.length ? ranked[0].name : null;
}

function computeStandings(matches, tournamentPreset){
  const teams = {};
  function ensureTeam(name){
    return teams[name] || (teams[name] = {
      name, played: 0, won: 0, lost: 0, tied: 0, points: 0,
      runsFor: 0, oversFor: 0, runsAgainst: 0, oversAgainst: 0
    });
  }
  matches.forEach(match => {
    const nameA = teamName(match, "A"), nameB = teamName(match, "B");
    if (match.forfeited){
      // Counts for points, but deliberately excluded from NRR — the
      // innings that were played (if any) weren't played to a finish,
      // so folding their runs/overs in would skew run rate.
      ensureTeam(nameA); ensureTeam(nameB);
      ensureTeam(nameA).played += 1; ensureTeam(nameB).played += 1;
      const winner = teamName(match, match.forfeitedBy === "A" ? "B" : "A");
      const loser = winner === nameA ? nameB : nameA;
      teams[winner].won += 1; teams[loser].lost += 1;
      teams[winner].points += tournamentPreset.pointsForWin;
      teams[loser].points += tournamentPreset.pointsForLoss;
      return;
    }
    const [i1, i2] = match.innings;
    if (!i2 || !i2.complete) return; // only fully-played two-innings matches count
    ensureTeam(nameA); ensureTeam(nameB);
    const bpo = match.ballsPerOver || 6;
    match.innings.forEach(inn => {
      const bt = ensureTeam(teamName(match, inn.battingTeam));
      const bwt = ensureTeam(teamName(match, inn.bowlingTeam));
      const oversFaced = inn.completeReason === "allout" ? inn.oversLimit : inn.legalBalls / bpo;
      bt.runsFor += inn.runs; bt.oversFor += oversFaced;
      bwt.runsAgainst += inn.runs; bwt.oversAgainst += oversFaced;
    });
    ensureTeam(nameA).played += 1; ensureTeam(nameB).played += 1;
    if (i2.runs === i1.runs){
      teams[nameA].tied += 1; teams[nameB].tied += 1;
      teams[nameA].points += tournamentPreset.pointsForTie; teams[nameB].points += tournamentPreset.pointsForTie;
    } else {
      const winner = i2.runs > i1.runs ? teamName(match, i2.battingTeam) : teamName(match, i1.battingTeam);
      const loser = winner === nameA ? nameB : nameA;
      teams[winner].won += 1; teams[loser].lost += 1;
      teams[winner].points += tournamentPreset.pointsForWin;
      teams[loser].points += tournamentPreset.pointsForLoss;
    }
  });
  const standings = Object.values(teams).map(t => ({
    ...t,
    nrr: (t.oversFor > 0 && t.oversAgainst > 0) ? (t.runsFor / t.oversFor) - (t.runsAgainst / t.oversAgainst) : 0
  }));
  standings.sort((a, b) => {
    if (b.points !== a.points) return b.points - a.points;
    if (tournamentPreset.useNRR && b.nrr !== a.nrr) return b.nrr - a.nrr;
    return 0;
  });
  return standings;
}

/* ============================================================
   3. STORAGE — DB wrapper: window.storage -> localStorage -> memory.
   Schema v2 adds teams/players/presets/tournaments/history alongside
   the original { match, snapshots }; v1 saves are migrated in place
   the first time a v2-aware build loads them.
   ============================================================ */
var STORAGE_KEY = "cricket.lk.v2";
var LEGACY_KEY = "cricket.lk.v1";

var DB = (() => {
  let mem = {};
  function backend(){
    if (typeof window !== "undefined" && window.storage && typeof window.storage.getItem === "function") return window.storage;
    try {
      if (typeof localStorage !== "undefined"){
        localStorage.setItem("__t", "1"); localStorage.removeItem("__t");
        return localStorage;
      }
    } catch (_){ /* private mode / disabled storage */ }
    return null;
  }
  const store = backend();
  return {
    load(key){
      try {
        const raw = store ? store.getItem(key) : mem[key];
        return raw ? JSON.parse(raw) : null;
      } catch (_){ return null; }
    },
    save(key, data){
      const raw = JSON.stringify(data);
      try { if (store) store.setItem(key, raw); else mem[key] = raw; }
      catch (_){ mem[key] = raw; }
    },
    clear(key){
      try { if (store) store.removeItem(key); } catch (_){}
      delete mem[key];
    },
    // Exposes the same window.storage -> localStorage -> null tier DB itself
    // resolved, so other things (the Supabase auth session adapter) can
    // follow the identical backend choice instead of re-detecting it.
    rawBackend: store
  };
})();

function genId(prefix){
  return `${prefix}-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 8)}`;
}

function defaultState(){
  const matchPresets = {}; DEFAULT_MATCH_PRESETS.forEach(p => { matchPresets[p.id] = p; });
  const tournamentPresets = {}; DEFAULT_TOURNAMENT_PRESETS.forEach(p => { tournamentPresets[p.id] = p; });
  return {
    match: null, snapshots: [],
    view: "home",
    players: {}, teams: {},
    matchPresets, tournamentPresets,
    tournaments: {}, matchHistory: {},
    activeTournamentId: null,
    activeClubId: null, // which club (if any) Home's quick-action cards currently target -- see the CLOUD "clubs" section
    soundEnabled: true,
    branding: { name: "", logo: null, accent: null, accent2: null }
  };
}

/* ============================================================
   4. CLOUD — Supabase client, auth session, and the platform-wide
   admin flag. Everything here is additive: with SUPABASE_URL/
   SUPABASE_ANON_KEY unset, `supabaseClient` stays null and every
   cloud-gated screen/action just falls back to "sign in required" —
   local guest scoring never depends on any of this, and no network
   request happens at all on an unconfigured deployment.
   Session/profile/isAdmin are deliberately plain top-level `let`
   vars, NOT fields on `state` or `ui`: `state` is JSON-persisted via
   DB.save() (a Supabase session object doesn't belong in that blob,
   supabase-js manages its own persistence) and `ui` gets wholesale
   reset (`ui = defaultUi()`) at points like finishing a match, which
   would otherwise wipe sign-in status out from under the user.
   The supabase-js library is loaded dynamically (not a static
   <script> tag) so a slow/blocked CDN fetch can never delay booting
   the core scorer — see loadSupabaseLib() below.
   ============================================================ */
const SUPABASE_URL = "https://xfsaldtvvcuyondayjjw.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_jDfjBu62WssP3fKEbbfVKw_ZyoxCXUm";  // publishable key -- safe to expose, access is enforced by RLS
const SUPABASE_JS_CDN_URL = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js";

function loadSupabaseLib(){
  if (typeof window.supabase !== "undefined") return Promise.resolve(window.supabase);
  return new Promise((resolve, reject) => {
    const el = document.createElement("script");
    el.src = SUPABASE_JS_CDN_URL;
    el.onload = () => resolve(window.supabase);
    el.onerror = () => reject(new Error("Failed to load supabase-js"));
    document.head.appendChild(el);
  });
}

function makeCloudAuthStorage(){
  const backend = DB.rawBackend; // same window.storage -> localStorage -> null tier as DB
  const mem = {};
  return {
    getItem: (key) => Promise.resolve(backend ? backend.getItem(key) : (key in mem ? mem[key] : null)),
    setItem: (key, value) => {
      try { if (backend) backend.setItem(key, value); else mem[key] = value; }
      catch (_){ mem[key] = value; }
      return Promise.resolve();
    },
    removeItem: (key) => {
      try { if (backend) backend.removeItem(key); } catch (_){}
      delete mem[key];
      return Promise.resolve();
    }
  };
}

let supabaseClient = null; // set by initAuth() once supabase-js has loaded, if configured
let session = null;  // current Supabase auth session, or null when signed out / cloud unavailable
let profile = null;  // { id, display_name } row from `profiles` for the signed-in user
let isAdmin = false;  // whether the signed-in user has a row in `admin_users`

async function refreshProfileAndAdmin(){
  profile = null; isAdmin = false;
  if (!supabaseClient || !session) return;
  const [{ data: profileRow }, { data: adminRow }] = await Promise.all([
    supabaseClient.from("profiles").select("id, display_name").eq("id", session.user.id).maybeSingle(),
    supabaseClient.from("admin_users").select("user_id").eq("user_id", session.user.id).maybeSingle()
  ]);
  profile = profileRow || null;
  isAdmin = !!adminRow;
}

async function initAuth(){
  if (!SUPABASE_URL || !SUPABASE_ANON_KEY) return; // cloud not configured on this deployment
  let lib;
  try { lib = await loadSupabaseLib(); } catch (_){ return; } // offline/blocked CDN — stay in guest mode
  supabaseClient = lib.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    auth: { storage: makeCloudAuthStorage(), persistSession: true, autoRefreshToken: true }
  });
  const { data } = await supabaseClient.auth.getSession();
  session = data.session || null;
  await refreshProfileAndAdmin();
  render();
  supabaseClient.auth.onAuthStateChange((_event, newSession) => {
    session = newSession;
    refreshProfileAndAdmin().then(render);
  });
}

async function handleSignOut(){
  if (!supabaseClient) return;
  await supabaseClient.auth.signOut();
  state.view = "home";
  state.activeClubId = null;
  ui.myClubs = null; ui.club = null; ui.currentClubId = null; // don't leak the previous account's clubs to whoever signs in next
  save(); render();
}

/* --- clubs (Milestone 2): a signed-in user's clubs, roster, and synced
   matches. Players are global (see supabase/002_clubs.sql) -- a club's
   "roster" is just a club_rosters join, not a copy of the player. There
   is deliberately no synced "team" entity for a club's own matches; see
   CLAUDE.md's "Cloud accounts & Supabase" section. ------------------- */

async function fetchMyClubs(){
  if (!supabaseClient || !session) { ui.myClubs = []; return; }
  const { data, error } = await supabaseClient
    .from("club_members")
    .select("role, clubs(id, name)")
    .eq("user_id", session.user.id);
  ui.myClubs = error ? [] : data.map(r => ({ id: r.clubs.id, name: r.clubs.name, role: r.role }));
}

async function createClub(name){
  if (!supabaseClient || !session) return null;
  const { data: club, error } = await supabaseClient
    .from("clubs").insert({ name, created_by: session.user.id }).select().single();
  if (error) return { error: error.message };
  const { error: memberError } = await supabaseClient
    .from("club_members").insert({ club_id: club.id, user_id: session.user.id, role: "owner" });
  if (memberError) return { error: memberError.message };
  return { club };
}

async function fetchClubDetail(clubId){
  ui.clubBusy = true;
  const [{ data: club }, { data: members }, { data: roster }, { data: matches }, { data: tournaments }] = await Promise.all([
    supabaseClient.from("clubs").select("id, name").eq("id", clubId).single(),
    supabaseClient.from("club_members").select("user_id, role, profiles_public(display_name)").eq("club_id", clubId),
    supabaseClient.from("club_rosters").select("player_id, players_public(id, name)").eq("club_id", clubId),
    supabaseClient.from("matches").select("id, match_type, data, played_at").eq("club_id", clubId).order("played_at", { ascending: false }).limit(50),
    supabaseClient.from("tournaments").select("id, name, created_at").eq("organizer_club_id", clubId).order("created_at", { ascending: false })
  ]);
  ui.club = {
    id: clubId,
    name: club ? club.name : "",
    members: (members || []).map(m => ({ userId: m.user_id, role: m.role, displayName: (m.profiles_public && m.profiles_public.display_name) || "—" })),
    roster: (roster || []).map(r => r.players_public).filter(Boolean),
    matches: matches || [],
    tournaments: tournaments || []
  };
  ui.clubBusy = false;
}

async function createClubTournament(clubId, name, tournamentPreset){
  if (!supabaseClient || !session) return null;
  const { data, error } = await supabaseClient
    .from("tournaments")
    .insert({ name, organizer_club_id: clubId, tournament_preset: tournamentPreset, created_by: session.user.id })
    .select().single();
  return error ? { error: error.message } : { tournament: data };
}

async function fetchClubTournamentDetail(tournamentId){
  const [{ data: tournament }, { data: matches }] = await Promise.all([
    supabaseClient.from("tournaments").select("id, name, organizer_club_id, tournament_preset").eq("id", tournamentId).single(),
    supabaseClient.from("matches").select("id, data, played_at").eq("tournament_id", tournamentId).order("played_at", { ascending: false })
  ]);
  ui.clubTournament = tournament ? { ...tournament, matches: matches || [] } : null;
}

async function addPlayerToClub(clubId, name){
  const trimmed = (name || "").trim();
  if (!trimmed) return;
  const { data: existing } = await supabaseClient
    .from("players_public").select("id, name").ilike("name", trimmed).limit(1);
  let playerId;
  if (existing && existing.length){
    playerId = existing[0].id;
  } else {
    const { data: created, error } = await supabaseClient
      .from("players").insert({ name: trimmed, created_by: session.user.id }).select().single();
    if (error) return { error: error.message };
    playerId = created.id;
  }
  const { error: rosterError } = await supabaseClient
    .from("club_rosters").insert({ club_id: clubId, player_id: playerId });
  if (rosterError && rosterError.code !== "23505") return { error: rosterError.message }; // ignore "already on roster"
  return { ok: true };
}

async function inviteClubAdmin(clubId, email){
  const { data, error } = await supabaseClient.rpc("invite_club_admin", { _club_id: clubId, _email: email });
  if (error) return { error: error.message };
  return { result: data }; // "ok" | "not_found" | "already_member"
}

async function syncMatchToCloud(match, archived){
  if (!supabaseClient || !session || !match.clubId) return;
  try {
    await supabaseClient.from("matches").upsert({
      id: archived.id,
      club_id: match.clubId,
      match_type: match.matchType || "practice",
      level: "local",
      opponent_name: match.opponentName || null,
      tournament_id: match.tournamentId || null,
      created_by: session.user.id,
      data: archived,
      played_at: new Date(archived.completedAt).toISOString()
    });
  } catch (_){ /* best-effort -- the match is already safely archived locally either way */ }
}

/* --- Premier: a cross-club, public players/stats/(eventually teams)
   browse screen, and player claiming ("this is me"). Claiming works
   today even though Premier tournaments (organizing, multi-club) don't
   exist yet -- players are already global (Milestone 2), so there's a
   real identity to claim regardless. Approval is admin-only, enforced
   server-side by the approve_claim/reject_claim RPCs (see
   supabase/004_premier_claims.sql), never by the isAdmin flag alone. */
async function fetchPremierData(){
  const [{ data: players }, { data: premierMatches }, pendingClaims] = await Promise.all([
    supabaseClient.from("players_public").select("id, name, claimed_by").order("name"),
    supabaseClient.from("matches").select("id, data").eq("level", "premier"),
    isAdmin
      ? supabaseClient.from("claim_requests").select("id, player_id, requested_by, claimed_phone, note, created_at").eq("status", "pending")
      : Promise.resolve({ data: [] })
  ]);
  ui.premier = {
    players: players || [],
    premierMatches: premierMatches || [],
    pendingClaims: (pendingClaims && pendingClaims.data) || []
  };
}

async function requestClaim(playerId, phone, note){
  const { error } = await supabaseClient.from("claim_requests").insert({
    player_id: playerId, requested_by: session.user.id, claimed_phone: phone || null, note: note || null
  });
  return error ? { error: error.message } : { ok: true };
}

async function approveClaimRequest(requestId){
  const { error } = await supabaseClient.rpc("approve_claim", { _request_id: requestId });
  return error ? { error: error.message } : { ok: true };
}

async function rejectClaimRequest(requestId){
  const { error } = await supabaseClient.rpc("reject_claim", { _request_id: requestId });
  return error ? { error: error.message } : { ok: true };
}

function findOrCreatePlayer(name){
  const trimmed = (name || "").trim();
  const existing = Object.values(state.players).find(p => p.name.toLowerCase() === trimmed.toLowerCase());
  if (existing) return existing;
  const player = { id: genId("player"), name: trimmed };
  state.players[player.id] = player;
  return player;
}

function createTeam(name){
  const team = { id: genId("team"), name: (name || "").trim(), playerIds: [] };
  state.teams[team.id] = team;
  return team;
}

function deleteTeam(teamId){ delete state.teams[teamId]; }

function addPlayerToTeam(teamId, name){
  const player = findOrCreatePlayer(name);
  const team = state.teams[teamId];
  if (team && !team.playerIds.includes(player.id)) team.playerIds.push(player.id);
  return player;
}

function removePlayerFromTeam(teamId, playerId){
  const team = state.teams[teamId];
  if (team) team.playerIds = team.playerIds.filter(id => id !== playerId);
}

function movePlayerToTeam(playerId, fromTeamId, toTeamId){
  removePlayerFromTeam(fromTeamId, playerId);
  const team = state.teams[toTeamId];
  if (team && !team.playerIds.includes(playerId)) team.playerIds.push(playerId);
}

function escapeHtml(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

/* --- THEME: a user's chosen accent/accent-2 hex (state.branding, set
   in Presets → Appearance) is the only thing stored — everything else
   (the rgb triple used by rgba() overlays, a lightened gradient-stop
   shade, a darkened "dim" shade, and a light/dark "ink" text color)
   is derived from it and pushed onto :root as CSS custom properties.
   Leaving a color uncustomized (hex is null) removes the override so
   the hardcoded :root defaults in <style> — the single source of
   truth for the built-in palette — show through untouched. --- */
function hexToRgb(hex){
  const clean = String(hex || "").replace("#", "");
  const full = clean.length === 3 ? clean.split("").map(c => c + c).join("") : clean;
  const n = parseInt(full, 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
function rgbToHex(r, g, b){
  return "#" + [r, g, b].map(c => Math.max(0, Math.min(255, Math.round(c))).toString(16).padStart(2, "0")).join("");
}
function shadeColor(hex, amount){
  const [r, g, b] = hexToRgb(hex);
  const target = amount < 0 ? 0 : 255;
  const p = Math.abs(amount);
  const mix = c => c + (target - c) * p;
  return rgbToHex(mix(r), mix(g), mix(b));
}
function inkForColor(hex){
  const [r, g, b] = hexToRgb(hex);
  const luminance = (0.2126 * r + 0.7152 * g + 0.0722 * b) / 255;
  return shadeColor(hex, luminance > 0.5 ? -0.88 : 0.88);
}
function applyAccentVars(root, prefix, hex){
  if (!hex){
    ["", "-rgb", "-dim", "-light", "-ink"].forEach(suffix => root.removeProperty(`--${prefix}${suffix}`));
    return;
  }
  root.setProperty(`--${prefix}`, hex);
  root.setProperty(`--${prefix}-rgb`, hexToRgb(hex).join(","));
  root.setProperty(`--${prefix}-dim`, shadeColor(hex, -0.35));
  root.setProperty(`--${prefix}-light`, shadeColor(hex, 0.35));
  root.setProperty(`--${prefix}-ink`, inkForColor(hex));
}
function applyTheme(){
  const b = state.branding || {};
  const root = document.documentElement.style;
  applyAccentVars(root, "accent", b.accent);
  applyAccentVars(root, "accent-2", b.accent2);
}

/* --- SFX: tiny synthesized sound effects via Web Audio API, no audio
   files — keeps the single-file/no-dependency/offline constraints.
   Muted via state.soundEnabled (persisted, toggled by the sound-toggle
   button rendered on every screen). AudioContext is created lazily on
   the first sound-triggering call, which is always inside a click
   handler, satisfying browsers' user-gesture autoplay requirement. --- */
const SFX = (() => {
  let ctx = null;
  function ensureCtx(){
    if (!ctx){
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC){ try { ctx = new AC(); } catch (_){ ctx = null; } }
    }
    if (ctx && ctx.state === "suspended") ctx.resume().catch(() => {});
    return ctx;
  }
  function tone(freq, { duration = .12, type = "sine", gain = .18, delay = 0, glideTo = null } = {}){
    if (!state.soundEnabled) return;
    const c = ensureCtx();
    if (!c) return;
    const t0 = c.currentTime + delay;
    const osc = c.createOscillator();
    const g = c.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t0);
    if (glideTo) osc.frequency.exponentialRampToValueAtTime(glideTo, t0 + duration);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(gain, t0 + .012);
    g.gain.exponentialRampToValueAtTime(.0001, t0 + duration);
    osc.connect(g); g.connect(c.destination);
    osc.start(t0); osc.stop(t0 + duration + .03);
  }
  return {
    dot(){ tone(300, { duration: .06, gain: .09 }); },
    single(){ tone(430, { duration: .09, gain: .12 }); },
    two(){ tone(430, { duration: .08, gain: .12 }); tone(540, { duration: .09, gain: .12, delay: .07 }); },
    three(){ tone(430, { duration: .07, gain: .11 }); tone(520, { duration: .07, gain: .11, delay: .06 }); tone(620, { duration: .09, gain: .12, delay: .12 }); },
    four(){ tone(660, { duration: .16, type: "triangle", gain: .18 }); tone(880, { duration: .22, type: "triangle", gain: .14, delay: .05 }); },
    six(){ tone(660, { duration: .14, type: "triangle", gain: .2 }); tone(880, { duration: .14, type: "triangle", gain: .18, delay: .06 }); tone(1108, { duration: .3, type: "triangle", gain: .16, delay: .12 }); },
    extra(){ tone(300, { duration: .1, type: "square", gain: .07 }); },
    wicket(){ tone(190, { duration: .38, type: "sawtooth", gain: .2, glideTo: 65 }); },
    win(){ tone(523, { duration: .15, gain: .16 }); tone(659, { duration: .15, gain: .16, delay: .14 }); tone(784, { duration: .32, gain: .18, delay: .28 }); },
    tap(){ tone(520, { duration: .05, gain: .08 }); },
    runs(n){
      if (n === 0) this.dot();
      else if (n === 1) this.single();
      else if (n === 2) this.two();
      else if (n === 3) this.three();
      else if (n === 4) this.four();
      else if (n === 6) this.six();
      else this.single();
    }
  };
})();

function handleSignInSubmit(e){

  const form = e.target;
  const f = new FormData(form);
  const email = (f.get("email") || "").trim();
  const password = f.get("password") || "";
  supabaseClient.auth.signInWithPassword({ email, password }).then(({ data, error }) => {

    session = data.session;

function handleSignUpSubmit(e){
  e.preventDefault();
  if (!supabaseClient) return;
  const form = e.target;
  const f = new FormData(form);
  const displayName = (f.get("displayName") || "").trim();
  const email = (f.get("email") || "").trim();
  const password = f.get("password") || "";
  supabaseClient.auth.signUp({
    email, password,
    options: { data: { display_name: displayName } }
  }).then(({ data, error }) => {
    if (error){ showFormError(form, error.message); return; }
    if (!data.session){
      // Email confirmation is required before a session exists.
      state.view = "signIn";
      save(); render();
      return;

    session = data.session;
    refreshProfileAndAdmin().then(() => {
      state.view = "account";
      save(); render();

  });
}

// The name for ui.currentClubId, without requiring a full fetchClubDetail
// first -- Home's quick-action cards jump straight into these setup
// screens (see "go-club-match-setup"/"go-club-tournament-setup"), so
// ui.club may not be loaded (or may still hold a *different* club's
// detail from an earlier visit). ui.myClubs (fetched for the Home
// switcher) already has the name; prefer the richer ui.club only when
// it's actually for the right club.
function currentClubName(){
  if (ui.club && ui.club.id === ui.currentClubId) return ui.club.name;
  const fromList = (ui.myClubs || []).find(c => c.id === ui.currentClubId);

}

      ${presets.length ? `
        <div class="preset-picker">
          ${presets.map(p => `<button type="button" data-action="pick-match-preset" data-id="${p.id}" class="preset-chip ${p.id === ui.matchSetupPresetId ? "active" : ""}">${escapeHtml(p.name)}</button>`).join("")}
        </div>
      ` : ""}
      <form id="match-setup-form">
        <input type="hidden" name="presetId" value="${preset.id || ""}">
        <label>${clubMode && ui.clubMatchSetupType === "friendly" ? "Home team name" : "Team A name"}<input name="teamA" required maxlength="24" value="${clubMode && ui.clubMatchSetupType === "friendly" ? escapeHtml(clubName) : ""}" placeholder="e.g. Lions" list="teams-datalist"></label>
        <label>${clubMode && ui.clubMatchSetupType === "friendly" ? "Visiting team name" : "Team B name"}<input name="teamB" required maxlength="24" placeholder="e.g. Tigers" list="teams-datalist"></label>
        <div class="field-row">

          <legend>Who bats first?</legend>

        <fieldset>
          <legend>Extras</legend>

          <label class="check-row"><input type="checkbox" name="noBallEnabled" ${preset.noBall ? (preset.noBall.enabled ? "checked" : "") : "checked"}> No-balls count, worth <input name="noBallRuns" type="number" min="0" max="6" value="${preset.noBall ? preset.noBall.runs : 1}" class="inline-num"> run(s)</label>

      </form>
    </div>
  `;
}

function handleMatchSetupSubmit(e){
  e.preventDefault();
  const f = new FormData(e.target);
  const teamA = (f.get("teamA") || "").trim() || "Team A";
  const teamB = (f.get("teamB") || "").trim() || "Team B";
  const oversLimit = Math.max(1, parseInt(f.get("overs"), 10) || 20);
  const playersPerSide = Math.max(2, parseInt(f.get("players"), 10) || 11);
  const ballsPerOver = Math.max(1, parseInt(f.get("ballsPerOver"), 10) || 6);
  const battingFirst = f.get("battingFirst") || "A";
  const wideEnabled = f.get("wideEnabled") === "on";
  const noBallEnabled = f.get("noBallEnabled") === "on";
  const wideRuns = Math.max(0, parseInt(f.get("wideRuns"), 10) || 0);
  const noBallRuns = Math.max(0, parseInt(f.get("noBallRuns"), 10) || 0);
  const freeHitOnNoBall = f.get("freeHitOnNoBall") === "on";
  const requireFielderOnCatch = f.get("requireFielderOnCatch") === "on";
  const requireFielderOnRunout = f.get("requireFielderOnRunout") === "on";
  const preset = state.matchPresets[f.get("presetId")];
  const inTournament = ui.currentClubId && ui.clubMatchSetupType === "tournament";
  state.match = createMatch({
    teamA, teamB, oversLimit, playersPerSide, battingFirst, ballsPerOver,
    wideEnabled, noBallEnabled, wideRuns, noBallRuns, freeHitOnNoBall,
    requireFielderOnCatch, requireFielderOnRunout,
    presetId: preset ? preset.id : null, presetName: preset ? preset.name : null,
    tournamentId: inTournament ? ui.currentTournamentId : null
  });
  if (ui.currentClubId && ui.clubMatchSetupType){
    // Extra, UI-only fields on top of the engine's match object (like
    // tournamentId already is) -- recordBall etc. never look at these.
    state.match.clubId = ui.currentClubId;
    state.match.matchType = ui.clubMatchSetupType;
  }
  state.snapshots = [];
  save(); render();
}

function handleOpeningSubmit(e){
  e.preventDefault();
  const f = new FormData(e.target);
  const striker = (f.get("striker") || "").trim();
  const nonStriker = (f.get("nonStriker") || "").trim();
  const bowler = (f.get("bowler") || "").trim();
  if (!striker || !nonStriker || !bowler) return;
  if (striker.toLowerCase() === nonStriker.toLowerCase()){
    showFormError(e.target, "Striker and non-striker must be different players."); return;
  }
  pushSnapshot();
  const inn = currentInnings(state.match);
  ensureBatsman(inn, striker); ensureBatsman(inn, nonStriker); ensureBowler(inn, bowler);
  findOrCreatePlayer(striker); findOrCreatePlayer(nonStriker); findOrCreatePlayer(bowler);
  inn.striker = striker; inn.nonStriker = nonStriker; inn.bowler = bowler;
  state.match.status = "live";
  save(); render();
}

function renderNewBatsmanModal(inn, slot){
  const endLabel = slot === "striker" ? "striker's" : "non-striker's";
  return `
    <div class="modal-backdrop">
      <div class="modal">
        <h2>New batsman (${endLabel} end)</h2>
        <form id="new-batsman-form">
          <div class="form-error"></div>
          <label>Name<input name="name" required maxlength="24" autofocus list="players-datalist"></label>
          <button type="submit" class="primary">Confirm</button>
        </form>
      </div>
    </div>
  `;
}

function handleNewBatsmanSubmit(e){
  e.preventDefault();
  const inn = currentInnings(state.match);
  const slot = pendingBatsmanSlot(inn);
  if (!slot) return;
  const f = new FormData(e.target);
  const name = (f.get("name") || "").trim();
  if (!name) return;
  const other = slot === "striker" ? inn.nonStriker : inn.striker;
  if (other && name.toLowerCase() === other.toLowerCase()){
    showFormError(e.target, "That player is already at the crease."); return;
  }
  if (inn.batting.stats[name] && inn.batting.stats[name].out){
    showFormError(e.target, `${name} is already out.`); return;
  }
  pushSnapshot();
  ensureBatsman(inn, name);
  findOrCreatePlayer(name);
  inn[slot] = name;
  save(); render();
}

function maybeArchiveCompletedMatch(match){
  if (match.status === "complete" && !match.archivedId){
    match.motm = pickMatchMOTM(match);
    const archived = archiveMatch(match);
    match.archivedId = archived.id;
    SFX.win();
    if (match.clubId) syncMatchToCloud(match, archived);
  }
}

function confirmWicket(type){
  pushSnapshot();
  const inn = currentInnings(state.match);
  recordBall(inn, { kind: "wicket", wicketType: type });
  afterBall(state.match);
  maybeArchiveCompletedMatch(state.match);
  SFX.wicket();
  ui.wicketFlow = null;
  save(); render();
}

function handleWicketFielderSubmit(e){
  e.preventDefault();
  const f = new FormData(e.target);
  const fielder = (f.get("fielder") || "").trim();
  const match = state.match;
  if (ui.wicketFlow === "runout"){
    if (match.requireFielderOnRunout && !fielder){ showFormError(e.target, "This preset requires naming the run-out taker."); return; }
    const end = f.get("end") || "striker";
    pushSnapshot();
    const inn = currentInnings(match);
    recordBall(inn, { kind: "wicket", wicketType: "runout", runs: ui.runoutRuns, endComingIn: end, fielder: fielder || undefined });
    if (fielder) findOrCreatePlayer(fielder);
    afterBall(match);
    maybeArchiveCompletedMatch(match);
    SFX.wicket();
    ui.wicketFlow = null; ui.runoutRuns = 0;
    save(); render();
  } else if (ui.wicketFlow === "caught"){
    if (match.requireFielderOnCatch && !fielder){ showFormError(e.target, "This preset requires naming the catch taker."); return; }
    pushSnapshot();
    const inn = currentInnings(match);
    recordBall(inn, { kind: "wicket", wicketType: "caught", fielder: fielder || undefined });
    if (fielder) findOrCreatePlayer(fielder);
    afterBall(match);
    maybeArchiveCompletedMatch(match);
    SFX.wicket();
    ui.wicketFlow = null;
    save(); render();
  }
}

function renderInningsSummary(match, inn){
  const bpo = inn.ballsPerOver;
  const battingName = teamName(match, inn.battingTeam);

    const s = inn.batting.stats[name];
    const sr = s.balls ? ((s.runs / s.balls) * 100).toFixed(1) : "0.0";
    const status = s.out ? s.howOut : "not out";
    return `<tr><td>${escapeHtml(name)}</td><td class="status">${escapeHtml(status)}</td><td>${s.runs}</td><td>${s.balls}</td><td>${s.fours}</td><td>${s.sixes}</td><td>${sr}</td></tr>`;
  }).join("");
  const bowlingRows = inn.bowling.order.map(name => {
    const b = inn.bowling.stats[name];
    const econ = b.legalBalls ? (b.runs / (b.legalBalls / bpo)).toFixed(2) : "0.00";
    return `<tr><td>${escapeHtml(name)}</td><td>${oversDisplay(b.legalBalls, bpo)}</td><td>${b.maidens}</td><td>${b.runs}</td><td>${b.wickets}</td><td>${econ}</td></tr>`;
  }).join("");
  const extrasTotal = inn.extras.wides + inn.extras.noBalls + inn.extras.byes + inn.extras.legByes;
  return `
    <div class="innings-summary">
      <h3>${escapeHtml(battingName)} ${inn.runs}/${inn.wickets} <span class="ov">(${oversDisplay(inn.legalBalls, bpo)} ov)</span></h3>
      <table class="bat-table">
        <thead><tr><th>Batter</th><th></th><th>R</th><th>B</th><th>4s</th><th>6s</th><th>SR</th></tr></thead>
        <tbody>${battingRows}</tbody>
      </table>
      <div class="extras-line">Extras ${extrasTotal} (w ${inn.extras.wides}, nb ${inn.extras.noBalls}, b ${inn.extras.byes}, lb ${inn.extras.legByes})</div>
      <table class="bowl-table">
        <thead><tr><th>Bowler</th><th>O</th><th>M</th><th>R</th><th>W</th><th>Econ</th></tr></thead>
        <tbody>${bowlingRows}</tbody>
      </table>

/* --- share / export (dependency-free: canvas PNG, print-to-PDF) --- */
function renderScorecardCanvas(match){
  const W = 1080, pad = 48;
  function battingLines(inn){
    return inn.batting.order.map(name => {
      const s = inn.batting.stats[name];
      return `${name}  ${s.runs} (${s.balls})`;
    });
  }
  function bowlingLines(inn){
    return inn.bowling.order.map(name => {
      const b = inn.bowling.stats[name];
      return `${name}  ${oversDisplay(b.legalBalls, inn.ballsPerOver)}-${b.maidens}-${b.runs}-${b.wickets}`;
    });
  }
  const lines = [];
  lines.push({ text: `${match.teamA} vs ${match.teamB}`, size: 44, weight: "800" });
  lines.push({ text: match.result || "", size: 26, weight: "600", color: "#5FB98C" });
  lines.push({ size: 10 });
  match.innings.forEach(inn => {
    lines.push({ text: `${teamName(match, inn.battingTeam)}  ${inn.runs}/${inn.wickets}  (${oversDisplay(inn.legalBalls, inn.ballsPerOver)} ov)`, size: 30, weight: "700" });
    battingLines(inn).forEach(t => lines.push({ text: t, size: 22 }));
    lines.push({ size: 8 });
    bowlingLines(inn).forEach(t => lines.push({ text: t, size: 20, color: "#9FC2AF" }));
    lines.push({ size: 16 });
  });
  if (match.motm) lines.push({ text: `Man of the Match: ${match.motm}`, size: 24, weight: "700", color: "#F2C744" });

  const H = pad * 2 + lines.reduce((sum, l) => sum + (l.size + 14), 0);
  const canvas = document.createElement("canvas");
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext("2d");
  ctx.fillStyle = "#0B2E22"; ctx.fillRect(0, 0, W, H);
  let y = pad;
  lines.forEach(l => {
    if (l.text){
      ctx.fillStyle = l.color || "#F1F6F2";
      ctx.font = `${l.weight || "400"} ${l.size}px -apple-system, sans-serif`;
      ctx.fillText(l.text, pad, y + l.size);
    }
    y += l.size + 14;
  });
  return canvas;
}

async function shareScorecardImage(match){
  const canvas = renderScorecardCanvas(match);
  canvas.toBlob(async (blob) => {
    if (!blob) return;
    const file = new File([blob], "cricket-lk-scorecard.png", { type: "image/png" });
    if (navigator.canShare && navigator.canShare({ files: [file] })){
      try { await navigator.share({ files: [file], title: "Cricket.lk scorecard", text: match.result || "" }); return; }
      catch (_){ /* user cancelled, or share failed — fall through to a plain download */ }
    }
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = "cricket-lk-scorecard.png";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  }, "image/png");
}

/* --- appearance: a personal-space settings blob (state.branding) —

   because logo upload saves+renders independently and asynchronously
   (FileReader + Image decode) — if these fields lived behind a Save
   button, that in-between render would wipe out whatever the user had
   typed but not yet submitted. Auto-apply also doubles as instant
   live preview, which a color picker wants anyway. --- */

function resizeImageToDataUrl(file, maxDim){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = () => {
      const img = new Image();
      img.onerror = reject;
      img.onload = () => {
        const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
        const w = Math.max(1, Math.round(img.width * scale));
        const h = Math.max(1, Math.round(img.height * scale));
        const canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        canvas.getContext("2d").drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL("image/png"));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function handleLogoFileChange(e){
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  resizeImageToDataUrl(file, 160).then(dataUrl => {
    state.branding.logo = dataUrl;
    save(); render();
  }).catch(() => {});
}

/* --- stats (all-time leaderboards, shared with the tournament stats tab) --- */
function renderLeaderboards(totals){
  const byRuns = [...totals].sort((a, b) => b.runs - a.runs).slice(0, 10);
  const byWickets = [...totals].filter(t => t.legalBalls > 0).sort((a, b) => b.wickets - a.wickets || a.runsConceded - b.runsConceded).slice(0, 10);
  const byFielding = [...totals].filter(t => (t.catches + t.runouts) > 0).sort((a, b) => (b.catches + b.runouts) - (a.catches + a.runouts)).slice(0, 10);
  const byPoints = totals.slice(0, 10);
  return `
    <div class="leaderboard">
      <h3>Most runs</h3>
      <table><thead><tr><th>Player</th><th>M</th><th>R</th><th>Avg</th></tr></thead>
      <tbody>${byRuns.map(t => `<tr><td>${escapeHtml(t.name)}</td><td>${t.matches}</td><td>${t.runs}</td><td>${t.innings ? (t.runs / t.innings).toFixed(1) : "0.0"}</td></tr>`).join("")}</tbody></table>
    </div>
    <div class="leaderboard">
      <h3>Most wickets</h3>
      <table><thead><tr><th>Player</th><th>M</th><th>W</th><th>Econ</th></tr></thead>
      <tbody>${byWickets.map(t => `<tr><td>${escapeHtml(t.name)}</td><td>${t.matches}</td><td>${t.wickets}</td><td>${t.legalBalls ? (t.runsConceded / (t.legalBalls / 6)).toFixed(2) : "0.00"}</td></tr>`).join("")}</tbody></table>
    </div>
    <div class="leaderboard">
      <h3>Most catches / run-outs</h3>
      <table><thead><tr><th>Player</th><th>Ct</th><th>RO</th></tr></thead>
      <tbody>${byFielding.map(t => `<tr><td>${escapeHtml(t.name)}</td><td>${t.catches}</td><td>${t.runouts}</td></tr>`).join("")}</tbody></table>
    </div>
    <div class="leaderboard">
      <h3>MVP points</h3>
      <table><thead><tr><th>Player</th><th>Pts</th></tr></thead>
      <tbody>${byPoints.map(t => `<tr><td>${escapeHtml(t.name)}</td><td><b>${t.points}</b></td></tr>`).join("")}</tbody></table>
    </div>
  `;
}
