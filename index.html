    </div>
  `;
}

/* Resize an uploaded image to a small square JPEG data URL (centre-cropped),
   stepping quality down until it fits the 80,000-character column limit. */
function resizeImageToDataUrl(file, size = 240){
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement("canvas");
      canvas.width = canvas.height = size;
      const side = Math.min(img.width, img.height);
      canvas.getContext("2d").drawImage(img, (img.width - side) / 2, (img.height - side) / 2, side, side, 0, 0, size, size);
      URL.revokeObjectURL(url);
      let q = 0.82, out = canvas.toDataURL("image/jpeg", q);
      while (out.length > 70000 && q > 0.3){ q -= 0.1; out = canvas.toDataURL("image/jpeg", q); }
      out.length <= 80000 ? resolve(out) : reject(new Error("Image is too detailed to store."));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("That file isn't an image the browser can read.")); };
    img.src = url;
  });
}

function handlePlayerProfileSubmit(e){
  e.preventDefault();
  const form = e.target;
  const f = new FormData(form);
  const pr = ui.profile;
  const canContact = pr.data.can_see_contact;
  const phone = (f.get("phone") || "").trim();
  const nic = normalizeNic(f.get("nic"));
  const details = readPlayerDetails(f);
  if (!isValidPhone(phone)){ showFormError(form, "Contact number should be 7–15 digits (optionally starting with +)."); return; }
  if (!isValidNic(nic)){ showFormError(form, "NIC should be 9 digits + V/X, or 12 digits."); return; }
  const detailsError = playerDetailsError(details);
  if (detailsError){ showFormError(form, detailsError); return; }
  const contactStep = canContact ? updatePlayerProfile(pr.id, phone, nic) : Promise.resolve({ ok: true });
  contactStep.then(r => {
    if (r && r.error){ showFormError(form, r.error); return null; }
    return updatePlayerDetails(pr.id, details);
  }).then(r => {
    if (r === null) return;
    if (r && r.error){ showFormError(form, r.error); return; }
    if (canContact){ pr.data.phone = phone || null; pr.data.nic = nic || null; }
    Object.assign(pr.data, { batting_hand: details.batting_hand || null, bowling_arm: details.bowling_arm || null, bowling_type: details.bowling_type || null,
      is_keeper: details.is_keeper, city: details.city || null, photo: details.photo || null, details_unavailable: false });
    if (!pr.data.kit_unavailable) Object.assign(pr.data, { nickname: details.nickname || null, jersey_no: parseJerseyNo(details.jersey_no) });
    ui.playerModal = null; pr.message = "Saved.";
    // The roster list shows jersey/nickname, so refresh it if it's this club's.
    if (pr.scope === "club" && ui.currentClubId) fetchClubDetail(ui.currentClubId).then(render);
    render();
  });
}

/* Who can edit this profile, and the claim / merge actions (all approved by a
   platform admin). A person may hold one claimed profile; a second profile
   that is also them has to be merged into it instead of claimed. */
function renderOwnershipBlock(pr, d, canEdit){
  const id = ui.identity;
  const me = session ? session.user.id : null;
  const note = t => `<p class="hint">${t}</p>`;
  let inner;
  if (d.claimed_by){
    inner = me && d.claimed_by === me
      ? note("This is your profile. Only you and platform admins can edit it.")
      : note("Claimed by the player — only they (and platform admins) can edit this profile.");
  } else if (!session){
    inner = note("Unclaimed. Sign in to claim this profile if it's you.");
  } else if (!id){
    inner = note("Checking your claim status…");
  } else if (pr.claiming || pr.merging){
    const merging = pr.merging;
    inner = `
      <form id="${merging ? "merge-request-form" : "claim-request-form"}" class="preset-form" style="margin-top:6px;">
        <div class="form-error"></div>
        ${merging ? note(`Merge this profile into <b>${escapeHtml(id.myPlayer.name)}</b>, your claimed profile. Its name becomes one of your aliases, its club rosters move to you and its stats are counted as yours.`)
                  : note("A platform admin checks this before the profile becomes yours.")}
        ${merging ? "" : `<label>Your contact no <span class="muted">(optional)</span><input name="phone" type="tel" maxlength="16" placeholder="07x xxx xxxx" autocomplete="off"></label>`}
        <label>Note for the admin <span class="muted">(optional)</span><input name="note" maxlength="200" placeholder="${merging ? "e.g. I used to be listed as this" : "e.g. I play for Colombo CC"}"></label>
        <div style="display:flex;gap:10px;">
          <button type="button" data-action="close-ownership-form" class="ghost" style="width:112px;flex-shrink:0;">Cancel</button>
          <button type="submit" class="primary" style="flex-grow:1;margin-top:0;">${merging ? "Request merge" : "Send claim"}</button>
        </div>
      </form>`;
  } else if (id.myPlayer){
    inner = id.pendingMerges.some(m => m.from_player_id === d.id)
      ? note("Your merge request for this profile is waiting for admin approval.")
      : `${note(`You've already claimed <b>${escapeHtml(id.myPlayer.name)}</b> — one person can only have one profile. If this one is also you, request a merge into it.`)}
         <button data-action="open-merge-form" class="ghost small">This is also me — request merge</button>`;
  } else if (id.pendingClaim){
    inner = id.pendingClaim.player_id === d.id
      ? note("Your claim on this profile is waiting for admin approval.")
      : note("You already have a claim waiting for approval on another profile. You can only claim one player.");
  } else {
    inner = `${note(canEdit ? "Unclaimed — you can edit it because your club added this player. Once the player claims it, only they can." : "Unclaimed. Only the club that added this player can edit it until they claim it themselves.")}
       <button data-action="open-claim-form" class="ghost small">This is me — claim profile</button>`;
  }
  return `<h3 class="section-label">Ownership</h3><div class="auth-card" style="margin-top:0;">${inner}</div>`;
}

function renderPlayerProfile(){
  const pr = ui.profile;
  const isClub = pr.scope === "club";
  const back = isClub ? renderBackBar("Players", "clubPlayers") : renderBackBar("Premier players", "premierPlayers");
  const d = pr.data;
  const f1 = n => n == null ? "—" : n.toFixed(1);
  const stat = (label, value) => `<div class="stat-tile"><span class="n stat-num">${value}</span><span class="stat-label">${label}</span></div>`;
  // Two separate tiers (club matches / Premier matches), never merged -- and
  // inside each, batting / bowling / fielding are separate sections too.
  const grid = tiles => `<div class="stat-grid">${tiles.join("")}</div>`;
  const hs = c => c.highScore ? `${c.highScore.runs}${c.highScore.out ? "" : "*"}` : "—";
  const statsBlock = (title, career, emptyHint, note) => {
    if (!career) return `<h3 class="section-label">${title}</h3><p class="hint">${emptyHint}</p>`;
    const batting = career.innings > 0
      ? grid([stat("Innings", career.innings), stat("Runs", career.runs), stat("Balls", career.balls),
              stat("Highest", hs(career)), stat("Average", f1(career.average)), stat("Strike rate", f1(career.strikeRate)),
              stat("Not outs", career.notOuts), stat("Ducks", career.ducks), stat("4s", career.fours),
              stat("6s", career.sixes), stat("50s", career.fifties), stat("100s", career.hundreds)])
      : `<p class="hint">Hasn't batted yet.</p>`;
    const bowling = career.bowlInnings > 0
      ? grid([stat("Innings", career.bowlInnings), stat("Overs", oversDisplay(career.legalBalls, 6)), stat("Maidens", career.maidens),
              stat("Runs", career.runsConceded), stat("Wickets", career.wickets), stat("Best", career.best ? `${career.best.wickets}/${career.best.runs}` : "—"),
              stat("Average", f1(career.bowlAverage)), stat("Economy", f1(career.economy)), stat("Strike rate", f1(career.bowlStrikeRate))])
      : `<p class="hint">Hasn't bowled yet.</p>`;
    const fielding = (career.catches + career.runouts) > 0
      ? grid([stat("Catches", career.catches), stat("Run-outs", career.runouts), stat("Dismissals", career.fieldDismissals)])
      : `<p class="hint">No catches or run-outs yet.</p>`;
    return `
      <h3 class="section-label">${title}</h3>
      <div class="tier-summary"><span class="tag-pill">${career.matches} match${career.matches === 1 ? "" : "es"}</span><span class="tag-pill gold">${career.points} MVP pts</span></div>
      <h4 class="stat-sub">Batting</h4>${batting}
      <h4 class="stat-sub">Bowling</h4>${bowling}
      <h4 class="stat-sub">Fielding</h4>${fielding}
      <p class="hint">${note}</p>
    `;
  };
  const clubMatches = isClub ? clubMatchesFor(ui.currentClubId) : (pr.clubMatches || []);
  const clubLabel = isClub ? (currentClubName() || "club") : "your clubs";
  const clubBlock = statsBlock(
    `Club matches · ${escapeHtml(clubLabel)}`, playerCareer([pr.name, ...(pr.aliases || [])], clubMatches),
    isClub ? "No matches for this player in this club yet."
      : pr.clubMatches === undefined ? "Loading…"
      : session ? "No matches for this player in the clubs you belong to yet." : "Sign in to see club stats from your clubs.",
    isClub ? "From this club's archived matches only." : "From matches of the clubs you belong to only — club stats elsewhere aren't visible from here."
  );
  const premierBlock = statsBlock(
    "Premier matches", playerCareer([pr.name, ...(pr.aliases || [])], ui.premier ? ui.premier.premierMatches.map(m => m.data).filter(Boolean) : []),
    ui.premier ? "No Premier matches yet for this player." : "Loading…", "From Premier archived matches only."
  );
  const sections = isClub ? [clubBlock, premierBlock] : [premierBlock, clubBlock];
  const initial = (pr.name || "?").trim().charAt(0).toUpperCase();
  const photo = d ? safePhoto(d.photo) : "";
  const canEdit = !!(d && d.can_see_contact);   // server-decided (supabase/009): the claimant, an admin, or -- only while unclaimed -- a member of the club that added them
  const avatar = p => p ? `<img class="profile-photo" src="${p}" alt="">` : `<div class="avatar-badge">${escapeHtml(initial)}</div>`;

  let body = "";
  if (pr.loading) body = `<div class="auth-card" style="margin-top:0;"><p class="hint">Loading…</p></div>`;
  else if (pr.error) body = `<div class="auth-card" style="margin-top:0;"><p class="hint">${escapeHtml(pr.error)}</p></div>`;
  else {
    const batting = formatBatting(d.batting_hand), bowling = formatBowling(d.bowling_arm, d.bowling_type);
    body = `
      ${d.details_unavailable ? (canEdit ? `<p class="hint guest-note">Batting, bowling, keeper, city and photo need supabase/008_player_details.sql to be run in the Supabase SQL editor.</p>` : "") : `
      <h3 class="section-label">Details</h3>
      <div class="auth-card" style="margin-top:0;">
        <div class="profile-row"><span class="profile-key">Batting</span><span>${batting ? escapeHtml(batting) : `<span class="muted">Not set</span>`}</span></div>
        <div class="profile-row"><span class="profile-key">Bowling</span><span>${bowling ? escapeHtml(bowling) : `<span class="muted">Not set</span>`}</span></div>
        <div class="profile-row"><span class="profile-key">Wicket-keeper</span><span>${d.is_keeper ? "Yes" : `<span class="muted">No</span>`}</span></div>
        <div class="profile-row"><span class="profile-key">City</span><span>${d.city ? escapeHtml(d.city) : `<span class="muted">Not set</span>`}</span></div>
      </div>`}
      ${d.kit_unavailable ? (canEdit && !d.details_unavailable ? `<p class="hint guest-note">Nickname and jersey no need supabase/010_player_nickname_jersey.sql to be run in the Supabase SQL editor.</p>` : "") : ""}
      <h3 class="section-label">Profile</h3>
      <div class="auth-card" style="margin-top:0;">
        <div class="profile-row"><span class="profile-key">Name</span><span>${escapeHtml(d.name)}</span></div>
        ${d.kit_unavailable ? "" : `
          <div class="profile-row"><span class="profile-key">Nickname</span><span>${d.nickname ? escapeHtml(d.nickname) : `<span class="muted">Not set</span>`}</span></div>
          <div class="profile-row"><span class="profile-key">Jersey no</span><span>${d.jersey_no != null ? `#${d.jersey_no}` : `<span class="muted">Not set</span>`}</span></div>`}
        ${(pr.aliases || []).length ? `<div class="profile-row"><span class="profile-key">Also played as</span><span>${pr.aliases.map(escapeHtml).join(", ")}</span></div>` : ""}
        ${canEdit ? `
          <div class="profile-row"><span class="profile-key">Contact no</span><span>${d.phone ? escapeHtml(d.phone) : `<span class="muted">Not set</span>`}</span></div>
          <div class="profile-row"><span class="profile-key">NIC</span><span>${d.nic ? escapeHtml(d.nic) : `<span class="muted">Not set</span>`}</span></div>
        ` : `

        `}

      </div>

        ${canEdit ? `<button data-action="edit-player-profile" class="ghost small">Edit profile</button>` : ""}

      </div>`;
  }
  return `
    <div class="screen">
      ${back}
      <div class="profile-head">
        ${avatar(photo)}
        <div>
          <h1 style="margin:0;">${d && d.jersey_no != null ? `<span class="jersey-no">#${d.jersey_no}</span> ` : ""}${escapeHtml(pr.name)}</h1>
          ${d && d.nickname ? `<div class="muted" style="font-size:.85rem;">“${escapeHtml(d.nickname)}”</div>` : ""}
          <div class="profile-badges">
            ${d && d.claimed_by ? `<span class="required-badge">${session && d.claimed_by === session.user.id ? "THIS IS YOU" : "CLAIMED"}</span>` : ""}
            ${d && d.is_keeper ? `<span class="required-badge">KEEPER</span>` : ""}

          </div>
        </div>
      </div>
      ${body}
      ${!pr.loading && !pr.error && d ? renderOwnershipBlock(pr, d, canEdit) : ""}

      ${sections.join("")}
    </div>
  `;
}

/* --- player modals (club Players / profile). ui.playerModal is
   { kind: "add" | "edit" | "remove", id?, name? }; not persisted. render()
   keeps an already-open one's DOM (see modalKey) so a background fetch that
   re-renders the page can't wipe what's been typed. --- */
/* The "Already on the platform" block under the add sheet's name field.
   Filled straight into the DOM by the input listener (no render()), so the
   rest of the form keeps what's been typed. */
function platformSuggestHtml(query, players){
  if (!players.length) return "";
  const rosterIds = new Set(ui.club && ui.club.id === ui.currentClubId ? ui.club.roster.map(p => p.id) : []);
  const exact = players.find(p => p.name.toLowerCase() === query.trim().toLowerCase());
  return `
    <div class="section-label" style="margin-top:4px;">Already on the platform</div>
    ${players.map(p => {
      const photo = safePhoto(p.photo);
      const avatar = photo ? `<img class="suggest-avatar" src="${photo}" alt="">` : `<span class="suggest-avatar avatar-badge">${escapeHtml(p.name.charAt(0).toUpperCase())}</span>`;
      const inClub = rosterIds.has(p.id);
      return `
        <div class="suggest-row">
          ${avatar}
          <span class="suggest-name">${escapeHtml(playerLabel(p))}${p.city ? `<span class="muted"> · ${escapeHtml(p.city)}</span>` : ""}</span>
          ${inClub ? `<span class="muted" style="font-size:.75rem;">In your club</span>`
            : `<button type="button" data-action="add-existing-club-player" data-id="${escapeHtml(p.id)}" data-name="${escapeHtml(p.name)}" class="ghost small">Add to club</button>`}
        </div>`;
    }).join("")}
    <p class="hint" style="margin:4px 0 10px;">${exact && rosterIds.has(exact.id)
      ? `“${escapeHtml(exact.name)}” is already in your club. Add someone else, or pick another player above.`
      : exact
      ? `“${escapeHtml(exact.name)}” already exists — submitting this name adds that player rather than creating a new one, and the details below won't be applied. Use “Add to club” to pick the right person.`
      : "Pick one to add them as they are, or keep typing to create a new player."}</p>`;
}

function handleCreateClubSubmit(e){
  e.preventDefault();
  const form = e.target;
  const name = (new FormData(form).get("name") || "").trim();
  if (!name) return;
  if (name.toLowerCase() === "premier"){
    // "PREMIER" is reserved for the cross-club Home switcher entry -- also
    // enforced server-side (clubs_name_not_reserved), this just avoids a
    // round trip for the common case.
    showFormError(form, `"Premier" is reserved and can't be used as a club name.`);
    return;
  }
  createClub(name).then(result => {
    if (result && result.error){ showFormError(form, result.error); return; }
    fetchMyClubs().then(render);
  });
}

function handleClubAddPlayerSubmit(e){
  e.preventDefault();
  const form = e.target;
  const f = new FormData(form);
  const name = (f.get("name") || "").trim();
  const phone = (f.get("phone") || "").trim();
  const nic = normalizeNic(f.get("nic"));
  const details = readPlayerDetails(f);
  if (!name) return;
  if (!isValidPhone(phone)){ showFormError(form, "Contact number should be 7–15 digits (optionally starting with +)."); return; }
  if (!isValidNic(nic)){ showFormError(form, "NIC should be 9 digits + V/X, or 12 digits."); return; }
  const detailsError = playerDetailsError(details);
  if (detailsError){ showFormError(form, detailsError); return; }
  ui.clubAddMessage = null;
  const submit = form.querySelector('button[type="submit"]');
  if (submit) submit.disabled = true;   // no double-add on a slow network
  addPlayerToClub(ui.currentClubId, name, { phone, nic, details }).then(result => {
    if (submit) submit.disabled = false;
    // "Added, but couldn't save ..." means the roster row exists already --
    // close the sheet (re-submitting would just hit "already on the platform").
    const partial = result && result.error && result.error.startsWith("Added,");
    if (result && result.error && !partial){ showFormError(form, result.error); return; }
    ui.playerModal = null;
    if (partial) ui.clubAddMessage = result.error;
    else if (result && result.created === false){
      const typed = phone || nic || playerHasDetails(details);
      ui.clubAddMessage = `${name} is already on the platform, so they were added to your roster as they are${typed ? " — the details you entered weren't applied" : ""}. Only the club that first added them, or the player after claiming, can edit their profile.`;
    } else ui.clubAddMessage = `${name} added.`;
    // A brand-new name also just became a global (Premier) player -- refresh
    // that list too if it was already loaded, so it doesn't show stale.
    if (ui.premier) fetchPremierData();
    render();
    fetchClubDetail(ui.currentClubId).then(render);
  });
}

function handleClubInviteAdminSubmit(e){

/* Tournament teams (supabase/012). A team is a name + players picked from
   the club roster; a player can be on only one team per tournament (checked
   here, on save). Teams only pre-fill match setup and set match.squads --
   played matches keep their own names, so editing or deleting a team never
   changes history or standings. */
function renderTournamentTeams(t){
  if (t.teams_unavailable){
    return `<h3 class="section-label">Teams</h3><p class="hint">Saved teams need 012_tournament_teams.sql — run it in the Supabase SQL editor. You can still type team names at match setup.</p>`;
  }

  return `
    <h3 class="section-label">Teams</h3>
    ${ui.tournamentTeamError ? `<p class="form-error">${escapeHtml(ui.tournamentTeamError)}</p>` : ""}
    ${t.teams.length ? `<div class="preset-list">${t.teams.map(team => `
      <div class="preset-row">
        <div class="preset-row-head">
          <b>${escapeHtml(team.name)}</b>
          <span class="muted">${team.players.length} player${team.players.length === 1 ? "" : "s"}</span>

          </div>

      </div>`).join("")}</div>`

    ${edit ? renderTournamentTeamForm(t, edit) : `<button data-action="new-tournament-team" class="link-btn">+ Add team</button>`}
  `;

function renderTournamentTeamForm(t, edit){
  const rosterReady = ui.club && ui.club.id === t.organizer_club_id;
  // Who's already on another team in this tournament -> shown, but locked.
  const takenBy = {};
  t.teams.forEach(team => { if (team.id !== edit.id) team.players.forEach(pl => { takenBy[pl.id] = team.name; }); });
  const roster = rosterReady ? ui.club.roster.filter(p => p.id).slice().sort((a, b) => a.name.localeCompare(b.name)) : [];
  // Anyone already on this team but no longer on the roster stays listed.
  const current = t.teams.find(team => team.id === edit.id);
  const leftRoster = current ? current.players.filter(pl => !roster.some(p => p.id === pl.id)) : [];
  const row = (id, label, taken) => `
    <label class="check-row"><input type="checkbox" name="teamPlayerIds" value="${escapeHtml(id)}" ${edit.playerIds.includes(id) ? "checked" : ""} ${taken ? "disabled" : ""}> ${escapeHtml(label)}${taken ? ` <span class="muted">· ${escapeHtml(taken)}</span>` : ""}</label>`;
  return `
    <form id="tournament-team-form" class="preset-form">
      <div class="form-error"></div>
      <label>Team name<input name="teamName" required maxlength="24" value="${escapeHtml(edit.name || "")}" placeholder="e.g. Reds"></label>
      <fieldset>
        <legend>Players</legend>
        ${!rosterReady ? `<p class="hint">Loading the club roster…</p>`
          : !roster.length && !leftRoster.length ? `<p class="hint">This club's roster is empty — add players on the Players screen first.</p>`
          : roster.map(p => row(p.id, playerLabel(p), takenBy[p.id])).join("") + leftRoster.map(pl => row(pl.id, `${pl.name} (left the roster)`, null)).join("")}
      </fieldset>
      <p class="hint">A player can be on only one team in this tournament.</p>
      <div class="action-row">
        <button type="submit" class="primary" ${ui.tournamentTeamBusy ? "disabled" : ""}>${ui.tournamentTeamBusy ? "Saving…" : "Save team"}</button>
        <button type="button" data-action="cancel-tournament-team" class="ghost">Cancel</button>
      </div>
    </form>
  `;
}

function handleTournamentTeamSubmit(e){
  e.preventDefault();
  const form = e.target;
  const t = ui.clubTournament, edit = ui.tournamentTeamEdit;
  if (!t || !edit || ui.tournamentTeamBusy) return;
  const f = new FormData(form);
  const name = (f.get("teamName") || "").trim();
  if (!name){ showFormError(form, "Give the team a name."); return; }
  const others = t.teams.filter(team => team.id !== edit.id);
  if (others.some(team => team.name.toLowerCase() === name.toLowerCase())){ showFormError(form, "This tournament already has a team with that name."); return; }
  const ids = f.getAll("teamPlayerIds").map(String);
  const clash = others.find(team => team.players.some(pl => ids.includes(pl.id)));
  if (clash){ showFormError(form, `Someone you picked is already on ${clash.name}.`); return; }
  const current = t.teams.find(team => team.id === edit.id);
  const known = [...(ui.club ? ui.club.roster : []), ...(current ? current.players : [])];
  const players = ids.map(id => known.find(p => p.id === id)).filter(Boolean).map(p => ({ id: p.id, name: p.name }));
  ui.tournamentTeamBusy = true; render();
  saveTournamentTeam(t, { id: edit.id, name, players }).then(result => {
    ui.tournamentTeamBusy = false;
    if (result.error){ render(); showFormError(document.getElementById("tournament-team-form"), result.error); return; }
    ui.tournamentTeamEdit = null;
    fetchClubTournamentDetail(t.id).then(render);
  });
}

/* computeStandings() needs a tournament-preset-shaped object for its
   points/NRR config, but Premier matches aren't organized under any

const PREMIER_STANDINGS_DISPLAY_PRESET = { pointsForWin: 2, pointsForTie: 1, pointsForLoss: 0, useNRR: true };

// Dashboard entry point: same card-grid pattern as Home, not a long

function renderPremierScreen(){
  const p = ui.premier;

function handleMatchSetupSubmit(e){
  e.preventDefault();
  if (state.match && state.match.status !== "complete") return;
  const f = new FormData(e.target);
  let teamA = (f.get("teamA") || "").trim() || "Team A";
  let teamB = (f.get("teamB") || "").trim() || "Team B";
  let squads = null;
  if (f.get("teamAId")){
    const saved = (ui.clubTournament && ui.clubTournament.teams) || [];
    const ta = saved.find(t => t.id === f.get("teamAId")), tb = saved.find(t => t.id === f.get("teamBId"));
    if (!ta || !tb || ta.id === tb.id){ showFormError(e.target, "Pick two different teams."); return; }
    teamA = ta.name; teamB = tb.name;
    squads = { A: ta.players.map(p => p.name), B: tb.players.map(p => p.name) };
  }
  const oversLimit = parseOptionalLimit(f.get("overs"), 1);
  const playersPerSide = parseOptionalLimit(f.get("players"), 2);
  const lastManStands = f.get("lastManStands") === "on";
  const ballsPerOver = Math.max(1, parseInt(f.get("ballsPerOver"), 10) || 6);
  const battingFirst = f.get("battingFirst") || "A";
  const wideEnabled = f.get("wideEnabled") === "on";
  const noBallEnabled = f.get("noBallEnabled") === "on";
  const wideRuns = Math.max(0, parseInt(f.get("wideRuns"), 10) || 0);
  const noBallRuns = Math.max(0, parseInt(f.get("noBallRuns"), 10) || 0);
  const freeHitOnNoBall = f.get("freeHitOnNoBall") === "on";
  const requireFielderOnCatch = f.get("requireFielderOnCatch") === "on";
  const requireFielderOnRunout = f.get("requireFielderOnRunout") === "on";
  const preset = matchPresetChoices().find(p => p.id === f.get("presetId"));
  const inTournament = ui.currentClubId && ui.clubMatchSetupType === "tournament";
  state.match = createMatch({
    teamA, teamB, oversLimit, playersPerSide, battingFirst, ballsPerOver,
    wideEnabled, noBallEnabled, wideRuns, noBallRuns, freeHitOnNoBall, lastManStands,
    requireFielderOnCatch, requireFielderOnRunout,
    presetId: preset ? preset.id : null, presetName: preset ? preset.name : null,
    tournamentId: inTournament ? ui.currentTournamentId : null
  });
  if (ui.currentClubId && ui.clubMatchSetupType){
    // Extra, UI-only fields on top of the engine's match object (like
    // tournamentId already is) -- recordBall etc. never look at these.
    state.match.clubId = ui.currentClubId;
    state.match.matchType = ui.clubMatchSetupType;
    // Read by playerTeamInMatch (side checks) and the squad datalists.
    if (squads) state.match.squads = squads;
  }
  state.snapshots = [];
  save(); render();
}

/* Selecting a team is a separate tap from confirming (ui.forfeitTeam),
   unlike the wicket modal's simple-type tiles which fire immediately --
   forfeiting has no working undo path in practice (pushSnapshot() runs,
   but the Result screen it lands on has no Undo control), so it's
   treated as the one genuinely irreversible action worth a confirm step. */
function renderForfeitModal(match){
  const cur = currentInnings(match);
  const order = cur.battingTeam === "A" ? ["A", "B"] : ["B", "A"];
  return `
    <div class="modal-backdrop">

        </div>
        <div class="dismissal-banner">
          <span class="detail" style="text-align:left;flex-grow:1;">The match ends immediately at <span class="n" style="color:var(--text);font-weight:700;">${cur.runs}-${cur.wickets} (${oversDisplay(cur.legalBalls, cur.ballsPerOver)})</span>. No result margin is calculated, and the innings so far is excluded from net run rate.</span>
        </div>
        <div class="section-label">Which team forfeits?</div>
        <div class="bowler-pick-list">
          ${order.map(key => `
            <button type="button" data-action="pick-forfeit-team" data-team="${key}" class="bowler-pick-row ${ui.forfeitTeam === key ? "active" : ""}" style="height:64px;">
              <span class="name">${escapeHtml(teamName(match, key))}</span>

        </div>
      </div>

  `;
}

/* "Batting"/"Bowling" here means "currently" or "next" -- at the break,
   the team that just finished batting reads as "Bowling" (their role in
   the innings about to start), and the team yet to bat at all reads as
   "Yet to bat", covering every point forfeitMatch can fire from (see
   CLAUDE.md's "Forfeiting a match"). */
function forfeitTeamLine(match, teamKey){
  const inn = match.innings.find(i => i.battingTeam === teamKey);
  if (!inn) return "Yet to bat";
  const scoreStr = `${inn.runs}-${inn.wickets}`;
  if (inn === currentInnings(match) && !inn.complete) return `Batting · ${scoreStr}`;
  const allOut = inn.complete && inn.completeReason === "allout";
  return `Bowling · ${scoreStr}${allOut ? " all out" : ""}`;
}

function handleOpeningSubmit(e){
  e.preventDefault();
  const f = new FormData(e.target);
  const striker = (f.get("striker") || "").trim();
  const nonStriker = (f.get("nonStriker") || "").trim();
  const bowler = (f.get("bowler") || "").trim();
  if (!striker || !nonStriker || !bowler) return;
  if (striker.toLowerCase() === nonStriker.toLowerCase()){
    showFormError(e.target, "Striker and non-striker must be different players."); return;
  }
  const innOpen = currentInnings(state.match);
  const openers = [striker, nonStriker];
  if (openers.some(n => n.toLowerCase() === bowler.toLowerCase())){
    showFormError(e.target, `${bowler} can't bat and bowl in the same innings — they'd be on both teams.`); return;
  }
  const conflict = openers.map(n => playerSideConflict(state.match, n, innOpen.battingTeam)).find(Boolean)
    || playerSideConflict(state.match, bowler, innOpen.bowlingTeam);
  if (conflict){ showFormError(e.target, conflict); return; }
  pushSnapshot();
  const inn = currentInnings(state.match);
  ensureBatsman(inn, striker); ensureBatsman(inn, nonStriker); ensureBowler(inn, bowler);
  registerMatchPlayer(striker, inn.battingTeam); registerMatchPlayer(nonStriker, inn.battingTeam); registerMatchPlayer(bowler, inn.bowlingTeam);
  inn.striker = striker; inn.nonStriker = nonStriker; inn.bowler = bowler;
  state.match.status = "live";
  save(); render();
}

/* The dismissal banner reads from the last `inn.fallOfWickets` entry's
   `batsman` (see recordBall's `outName` local) rather than re-deriving
   who's out from the null slot -- the null slot only says *where*, not
   *who was there*. There's deliberately no "yet to bat" quick-pick chip
   row here (the Design-canvas mockup had one, grouped by team) -- a
   standalone match's teamA/teamB are plain display strings with no
   linked roster to draw it from (see CLAUDE.md's "Teams, players &
   presets"), and even a tournament match's `createMatch()` call only
   ever receives resolved name strings, not team IDs, so there's no
   squad list available at this point for either match type. */
function renderNewBatsmanModal(inn, slot){
  const endBadge = slot === "striker" ? "STRIKER'S END" : "NON-STRIKER'S END";
  const lastFow = inn.fallOfWickets.length ? inn.fallOfWickets[inn.fallOfWickets.length - 1] : null;
  const dismissed = lastFow && lastFow.batsman ? inn.batting.stats[lastFow.batsman] : null;
  return `
    <div class="modal-backdrop">
      <div class="modal">
        <div class="wicket-modal-head">
          <h2>New batsman</h2>
          <span class="end-badge">${endBadge}</span>
        </div>
        ${lastFow && dismissed ? `
          <div class="dismissal-banner">
            <span class="name">${escapeHtml(lastFow.batsman)}</span>
            <span class="n detail">${escapeHtml(dismissed.howOut || "")} · ${dismissed.runs} (${dismissed.balls})</span>
          </div>
        ` : ""}
        <form id="new-batsman-form">
          <div class="form-error"></div>
          <label>Name<input name="name" required maxlength="24" autofocus list="${squadListId(inn.battingTeam)}" placeholder="Type or pick a player"></label>
          <p class="hint">A name that is not in your players list yet is added to it automatically.</p>
          <button type="submit" class="primary">Send in</button>
        </form>
        <div class="modal-footer-hint">
          <p class="hint">Scoring is paused until a name is entered. There is no dismiss.</p>
          <button type="button" data-action="undo" class="undo-chip" ${state.snapshots.length ? "" : "disabled"}>UNDO BALL</button>
        </div>
      </div>
    </div>
  `;
}

function handleNewBatsmanSubmit(e){
  e.preventDefault();
  const inn = currentInnings(state.match);
  const slot = pendingBatsmanSlot(inn);
  if (!slot) return;
  const f = new FormData(e.target);
  const name = (f.get("name") || "").trim();
  if (!name) return;
  const other = slot === "striker" ? inn.nonStriker : inn.striker;
  if (other && name.toLowerCase() === other.toLowerCase()){
    showFormError(e.target, "That player is already at the crease."); return;
  }
  if (inn.batting.stats[name] && inn.batting.stats[name].out){
    showFormError(e.target, `${name} is already out.`); return;
  }
  const sideConflict = playerSideConflict(state.match, name, inn.battingTeam);
  if (sideConflict){ showFormError(e.target, sideConflict); return; }
  pushSnapshot();
  ensureBatsman(inn, name);
  registerMatchPlayer(name, inn.battingTeam);
  inn[slot] = name;
  save(); render();
}

/* Previous-over bowlers get a real one-tap row (their own figures shown)
   instead of only being typeable via the datalist -- the common case at
   the top of a new over is picking someone who's already bowled. The
   over-before's bowler is excluded from that tappable list (mirroring
   handleNewBowlerSubmit's own check) and shown struck-through/disabled
   instead, so the "can't bowl two in a row" rule reads as a fact about
   that row, not just an error you'd only see after trying. */
function renderNewBowlerModal(inn){
  const bpo = inn.ballsPerOver;
  const overNumber = Math.floor(inn.legalBalls / bpo) + 1;
  const pickable = inn.bowling.order.filter(name => name !== inn.lastOverBowler);
  return `
    <div class="modal-backdrop">
      <div class="modal">
        <div class="wicket-modal-head">
          <h2>New bowler</h2>
          <span class="n batter">${overNumber}${ordinalSuffix(overNumber)} over · ${bpo} balls</span>
        </div>
        <form id="new-bowler-form">
          <div class="form-error"></div>
          <label>Name<input name="name" required maxlength="24" autofocus list="${squadListId(inn.bowlingTeam)}" placeholder="Type or pick a bowler"></label>
          ${inn.bowling.order.length ? `
            <div class="section-label">Already bowled</div>
            <div class="bowler-pick-list">
              ${pickable.map(name => {
                const b = inn.bowling.stats[name];
                return `<button type="button" data-action="pick-bowler" data-name="${escapeHtml(name)}" class="bowler-pick-row"><span class="name">${escapeHtml(name)}</span><span class="n figs">${oversDisplay(b.legalBalls, bpo)}-${b.maidens}-${b.runs}-${b.wickets}</span></button>`;
              }).join("")}
              ${inn.lastOverBowler ? `
                <div class="bowler-pick-row disabled">
                  <span class="name strike">${escapeHtml(inn.lastOverBowler)}</span>
                  <span class="reason">bowled the ${overNumber - 1}${ordinalSuffix(overNumber - 1)}</span>
                </div>
              ` : ""}
            </div>
            <p class="hint">The previous over's bowler can't bowl two in a row.</p>
          ` : ""}
          <button type="submit" class="primary">Start over</button>
        </form>
        <div class="modal-footer-hint">
          <p class="hint">Strike has already been swapped for the new over.</p>
          <button type="button" data-action="undo" class="undo-chip" ${state.snapshots.length ? "" : "disabled"}>UNDO BALL</button>
        </div>
      </div>
    </div>
  `;
}

function confirmNewBowler(name){
  const inn = currentInnings(state.match);
  if (inn.bowler || !name) return;
  if (inn.lastOverBowler && name.toLowerCase() === inn.lastOverBowler.toLowerCase()) return;
  pushSnapshot();
  ensureBowler(inn, name);
  registerMatchPlayer(name, inn.bowlingTeam);
  inn.bowler = name;
  save(); render();
}

function handleNewBowlerSubmit(e){
  e.preventDefault();
  const inn = currentInnings(state.match);
  if (inn.bowler) return;
  const f = new FormData(e.target);
  const name = (f.get("name") || "").trim();
  if (!name) return;
  if (inn.lastOverBowler && name.toLowerCase() === inn.lastOverBowler.toLowerCase()){
    showFormError(e.target, `${name} can't bowl two overs in a row.`); return;
  }
  const sideConflict = playerSideConflict(state.match, name, inn.bowlingTeam);
  if (sideConflict){ showFormError(e.target, sideConflict); return; }
  confirmNewBowler(name);
}

function showFormError(form, msg){
  const el = form.querySelector(".form-error");
  if (el) el.textContent = msg;
}

/* --- wicket modal (caught / run-out both capture an optional-or-required fielder) --- */
/* One sheet for every dismissal type, not a menu screen that swaps to a
   separate detail screen for caught/run-out. Tapping Bowled/LBW/Stumped/
   Hit wicket still fires immediately via confirmWicket() (same speed as
   always -- there's nothing to enter for those, so a second confirm tap
   would only slow down the common case). Caught/Run out instead select
   themselves (ui.wicketFlow holds which) and the sheet grows a fielder/
   end/runs section plus a Confirm button below the same type grid --
   still exactly two taps total for those two, just no full-screen swap. */
function renderWicketModal(inn){
  const match = state.match;
  const selected = ui.wicketFlow;
  const isRunout = selected === "runout";
  const isCaught = selected === "caught";
  const strikerStats = inn.striker ? inn.batting.stats[inn.striker] : null;

  const types = [
    { type: "bowled", label: "Bowled" },
    { type: "caught", label: "Caught" },
    { type: "lbw", label: "LBW" },
    { type: "stumped", label: "Stumped" },
    { type: "hitwicket", label: "Hit wicket" },
    { type: "runout", label: "Run out" }
  ].filter(t => !inn.freeHit || t.type === "runout");

  const required = isRunout ? match.requireFielderOnRunout : match.requireFielderOnCatch;

  return `
    <div class="modal-backdrop">
      <div class="modal">
        <div class="wicket-modal-head">
          <h2>How out?</h2>
          ${strikerStats ? `<span class="batter">${escapeHtml(inn.striker)} ${strikerStats.runs} (${strikerStats.balls})</span>` : ""}
        </div>
        ${inn.freeHit ? `
          <div class="freehit-note"><span class="tag">FREE HIT</span><span class="desc">A run out is the only dismissal available</span></div>
        ` : ""}
        <div class="wicket-types${inn.freeHit ? " solo" : ""}">
          ${types.map(t => `<button type="button" data-action="pick-wicket" data-type="${t.type}" class="${selected === t.type ? "active" : ""}">${t.label}</button>`).join("")}
        </div>
        <form id="wicket-fielder-form">
          <div class="form-error"></div>
          ${isRunout ? `
            <div class="section-label">Who's out?</div>
            <div class="end-picker">
              <button type="button" data-action="pick-runout-end" data-end="striker" class="end-tile ${ui.runoutEnd === "striker" ? "active" : ""}">
                <span class="role">Striker</span><span class="n">${escapeHtml(inn.striker)}${strikerStats ? " " + strikerStats.runs : ""}</span>
              </button>
              ${inn.nonStriker ? `<button type="button" data-action="pick-runout-end" data-end="nonStriker" class="end-tile ${ui.runoutEnd === "nonStriker" ? "active" : ""}">
                <span class="role">Non-striker</span><span class="n">${escapeHtml(inn.nonStriker)}${inn.batting.stats[inn.nonStriker] ? " " + inn.batting.stats[inn.nonStriker].runs : ""}</span>
              </button>` : ""}
            </div>
            <p class="hint">The end you pick is vacated directly. Batsmen crossing is not modelled.</p>
            <div class="section-label">Runs completed before the run out</div>
            <div class="run-pad small">
              ${[0, 1, 2, 3].map(n => `<button type="button" data-action="runout-runs" data-runs="${n}" class="run-btn ${ui.runoutRuns === n ? "active" : ""}">${n}</button>`).join("")}
            </div>
            <p class="hint">These runs count against the bowler, unlike byes and leg byes.</p>
          ` : ""}
          ${(isRunout || isCaught) ? `
            <div class="fielder-box">
              <div class="fielder-box-head">
                <label for="wicket-fielder">FIELDER</label>
                ${required ? `<span class="required-badge">REQUIRED</span>` : ""}
              </div>
              <input id="wicket-fielder" name="fielder" list="${squadListId(inn.bowlingTeam)}" maxlength="24" ${required ? "required" : ""}>
              ${isCaught ? `<div class="hint">Autocompletes from your players list. Credits a catch in the fielding stats.</div>` : ""}
            </div>
            <div style="display:flex;gap:10px;margin-top:14px;">
              <button type="button" data-action="close-wicket-modal" class="ghost" style="width:112px;flex-shrink:0;">Cancel</button>
              <button type="submit" class="primary danger-confirm" style="flex-grow:1;">Confirm ${isRunout ? "run out" : "wicket"}</button>
            </div>
          ` : `
            <button type="button" data-action="close-wicket-modal" class="ghost" style="width:100%;margin-top:14px;">Cancel</button>
          `}
        </form>
      </div>
    </div>
  `;
}

function maybeArchiveCompletedMatch(match){
  if (match.status === "complete" && !match.archivedId){
    match.motm = pickMatchMOTM(match);
    const archived = archiveMatch(match);
    match.archivedId = archived.id;
    SFX.win();
    if (match.clubId) syncMatchToCloud(match, archived);
  }
}

function confirmWicket(type){
  pushSnapshot();
  const inn = currentInnings(state.match);
  recordBall(inn, { kind: "wicket", wicketType: type });
  afterBall(state.match);
  maybeArchiveCompletedMatch(state.match);
  SFX.wicket();
  ui.wicketFlow = null;
  save(); render();
}

function handleWicketFielderSubmit(e){
  e.preventDefault();
  const f = new FormData(e.target);
  const fielder = (f.get("fielder") || "").trim();
  const match = state.match;
  if (fielder){
    const sideConflict = playerSideConflict(match, fielder, currentInnings(match).bowlingTeam);
    if (sideConflict){ showFormError(e.target, sideConflict); return; }
  }
  if (ui.wicketFlow === "runout"){
    if (match.requireFielderOnRunout && !fielder){ showFormError(e.target, "This preset requires naming the run-out taker."); return; }
    pushSnapshot();
    const inn = currentInnings(match);
    recordBall(inn, { kind: "wicket", wicketType: "runout", runs: ui.runoutRuns, endComingIn: ui.runoutEnd, fielder: fielder || undefined });
    if (fielder) registerMatchPlayer(fielder, inn.bowlingTeam);
    afterBall(match);
    maybeArchiveCompletedMatch(match);
    SFX.wicket();
    ui.wicketFlow = null; ui.runoutRuns = 0; ui.runoutEnd = "striker";
    save(); render();
  } else if (ui.wicketFlow === "caught"){
    if (match.requireFielderOnCatch && !fielder){ showFormError(e.target, "This preset requires naming the catch taker."); return; }
    pushSnapshot();
    const inn = currentInnings(match);
    recordBall(inn, { kind: "wicket", wicketType: "caught", fielder: fielder || undefined });
    if (fielder) registerMatchPlayer(fielder, inn.bowlingTeam);
    afterBall(match);
    maybeArchiveCompletedMatch(match);
    SFX.wicket();
    ui.wicketFlow = null;
    save(); render();
  }
}

/* --- live screen --- */
function handleBallClick(runs){
  const inn = currentInnings(state.match);
  const kindMap = { wide: "wide", noball: "noball", bye: "bye", legbye: "legbye" };
  const kind = ui.pendingExtra ? kindMap[ui.pendingExtra] : "run";
  pushSnapshot();
  recordBall(inn, { kind, runs });
  afterBall(state.match);
  maybeArchiveCompletedMatch(state.match);
  if (kind === "run") SFX.runs(runs); else SFX.extra();
  ui.pendingExtra = null;
  save(); render();
}

/* Two taps (ui.endInningsConfirm), like forfeit: closing the 1st innings
   lands on the innings break, which has no Undo control. Any other click
   clears the pending confirm (see the click dispatcher). */
function handleEndInnings(){
  if (!ui.endInningsConfirm){ ui.endInningsConfirm = true; render(); return; }
  ui.endInningsConfirm = false;
  pushSnapshot();
  endInnings(state.match);
  maybeArchiveCompletedMatch(state.match);
  save(); render();
}

function handleUndo(){
  if (!state.snapshots.length) return;
  state.match = state.snapshots.pop();
  ui.pendingExtra = null; ui.wicketFlow = null; ui.runoutRuns = 0; ui.runoutEnd = "striker"; ui.forfeitFlow = false; ui.forfeitTeam = null; ui.endInningsConfirm = false;
  save(); render();
}

/* 1-indexed -> "1st"/"2nd"/"3rd"/"4th"... incl. the 11th-13th exception.
   Display-only (over labels), not an engine concern. */
function ordinalSuffix(n){
  const rem100 = n % 100;
  if (rem100 >= 11 && rem100 <= 13) return "th";
  switch (n % 10){ case 1: return "st"; case 2: return "nd"; case 3: return "rd"; default: return "th"; }
}

/* One row of the live-scoring "this over"/previous-over rail: one slot
   per ballsPerOver (padded with dashed empties when the over isn't full
   yet), each tagged for color by what it actually was, plus the row's
   run total on the right. `events` items carry `runs` (added to
   recordBall's currentOverEvents push) so the total doesn't need to
   re-parse `display` strings. */
function renderOverRow(label, events, bpo, dimmed){
  const slotCount = Math.max(bpo, events.length);
  const slots = [];
  for (let i = 0; i < slotCount; i++){
    const ev = events[i];
    if (!ev){ slots.push(`<span class="chip empty"></span>`); continue; }
    let cls = "chip";
    if (ev.isWicket) cls += " wicket";
    else if (ev.runs === 4) cls += " four";
    else if (ev.runs === 6) cls += " six";
    else if (/^(Wd|Nb)/.test(ev.display)) cls += " extra";
    slots.push(`<span class="${cls}">${escapeHtml(ev.display)}</span>`);
  }
  const total = events.reduce((sum, ev) => sum + (ev.runs || 0), 0);
  return `
    <div class="over-row${dimmed ? " dimmed" : ""}">
      <span class="over-row-label">${label}</span>
      ${slots.join("")}
      <span class="over-row-total">${total}</span>
    </div>
  `;
}

function renderLive(match){
  const inn = currentInnings(match);
  const bpo = inn.ballsPerOver;
  const crr = runRate(inn.runs, inn.legalBalls, bpo).toFixed(2);
  const rrr = requiredRunRate(inn);
  const ballsLeft = inn.oversLimit != null ? Math.max(inn.oversLimit * bpo - inn.legalBalls, 0) : null;
  const alone = battingAlone(inn);
  const strikerStats = inn.striker ? inn.batting.stats[inn.striker] : null;
  const nonStrikerStats = inn.nonStriker ? inn.batting.stats[inn.nonStriker] : null;
  const bowlerStats = inn.bowler ? inn.bowling.stats[inn.bowler] : null;
  const sr = (s) => s.balls ? ((s.runs / s.balls) * 100).toFixed(1) : "0.0";
  const econ = (b) => b.legalBalls ? (b.runs / (b.legalBalls / bpo)).toFixed(2) : "0.00";

  const overNumber = Math.floor(inn.legalBalls / bpo) + 1;
  const prevOver = inn.overs.length ? inn.overs[inn.overs.length - 1] : null;
  const lastFow = inn.fallOfWickets.length ? inn.fallOfWickets[inn.fallOfWickets.length - 1] : null;
  const partnershipRuns = inn.runs - (lastFow ? lastFow.score : 0);
  const partnershipBalls = inn.legalBalls - (lastFow ? lastFow.balls : 0);

  // Extras row only offers what this match's preset enabled -- the grid
  // itself adapts column count (3-up/4-up) instead of leaving a gap.
  const enabledExtras = [
    match.wideEnabled ? { extra: "wide", label: "Wide" } : null,
    match.noBallEnabled ? { extra: "noball", label: "No ball" } : null,
    { extra: "bye", label: "Bye" },
    { extra: "legbye", label: "Leg bye" }
  ].filter(Boolean);

  return `
    <div class="screen live">
      <div class="score-bento">
        <div class="score-tile">
          <div class="score-n">${inn.runs}-${inn.wickets}</div>
          <div class="score-sub"><span>${oversDisplay(inn.legalBalls, bpo)} ov</span><span class="crr">CRR ${crr}</span></div>
        </div>
        ${inn.target != null ? `
          <div class="target-tile">
            <div class="eyebrow">TARGET ${inn.target}</div>
            <div class="need-n">${Math.max(inn.target - inn.runs, 0)}</div>
            <div class="need-sub">${ballsLeft != null ? `off ${ballsLeft} ball${ballsLeft === 1 ? "" : "s"}` : "no over limit"}</div>
            ${rrr != null ? `<div class="rrr">RRR ${rrr.toFixed(2)}</div>` : ""}
          </div>
        ` : ""}
      </div>

      <div class="matchup-card">
        <div class="matchup-head"><span>BATTER</span><span style="width:34px;">R</span><span style="width:30px;">B</span><span style="width:24px;">4s</span><span style="width:24px;">6s</span><span style="width:46px;">SR</span></div>
        <div class="matchup-row">
          <span class="matchup-marker striker"></span><span class="name">${escapeHtml(inn.striker) || "—"}</span>
          <span class="stat emph" style="width:34px;">${strikerStats ? strikerStats.runs + "*" : ""}</span>
          <span class="stat" style="width:30px;">${strikerStats ? strikerStats.balls : ""}</span>
          <span class="stat" style="width:24px;">${strikerStats ? strikerStats.fours : ""}</span>
          <span class="stat" style="width:24px;">${strikerStats ? strikerStats.sixes : ""}</span>
          <span class="stat" style="width:46px;">${strikerStats ? sr(strikerStats) : ""}</span>
        </div>
        <div class="matchup-row muted">
          <span class="matchup-marker nonstriker"></span><span class="name">${alone ? "Batting alone" : escapeHtml(inn.nonStriker) || "—"}</span>
          <span class="stat emph" style="width:34px;">${nonStrikerStats ? nonStrikerStats.runs + "*" : ""}</span>
          <span class="stat" style="width:30px;">${nonStrikerStats ? nonStrikerStats.balls : ""}</span>
          <span class="stat" style="width:24px;">${nonStrikerStats ? nonStrikerStats.fours : ""}</span>
          <span class="stat" style="width:24px;">${nonStrikerStats ? nonStrikerStats.sixes : ""}</span>
          <span class="stat" style="width:46px;">${nonStrikerStats ? sr(nonStrikerStats) : ""}</span>
        </div>
        <div class="matchup-head bowler-head"><span>BOWLER</span><span style="width:38px;">O</span><span style="width:24px;">M</span><span style="width:28px;">R</span><span style="width:24px;">W</span><span style="width:46px;">ECON</span></div>
        <div class="matchup-row">
          <span class="matchup-marker bowler"></span><span class="name">${escapeHtml(inn.bowler) || "—"}</span>
          <span class="stat" style="width:38px;">${bowlerStats ? oversDisplay(bowlerStats.legalBalls, bpo) : ""}</span>
          <span class="stat" style="width:24px;">${bowlerStats ? bowlerStats.maidens : ""}</span>
          <span class="stat" style="width:28px;">${bowlerStats ? bowlerStats.runs : ""}</span>
          <span class="stat emph" style="width:24px;">${bowlerStats ? bowlerStats.wickets : ""}</span>
          <span class="stat" style="width:46px;">${bowlerStats ? econ(bowlerStats) : ""}</span>
        </div>
        <div class="partnership-row">
          <span>PARTNERSHIP</span><span class="val" style="flex-grow:1;text-align:right;">${partnershipRuns} (${partnershipBalls})</span>
          <span style="margin-left:12px;">LAST WKT</span><span class="val">${lastFow ? `${lastFow.score}-${lastFow.wicket}` : "—"}</span>
        </div>
      </div>

      <div class="over-card">
        <div class="over-card-header">
          <span>${overNumber}${ordinalSuffix(overNumber)} OVER · ${bpo}-BALL</span>
          ${inn.freeHit ? `<span class="freehit-badge">FREE HIT</span>` : ""}
        </div>
        ${renderOverRow(`${overNumber}${ordinalSuffix(overNumber)}`, inn.currentOverEvents, bpo, false)}
        ${prevOver ? renderOverRow(`${overNumber - 1}${ordinalSuffix(overNumber - 1)}`, prevOver.events, bpo, true) : ""}
      </div>

      <div class="run-pad small">
        ${[0, 1, 2, 3, 4, 5, 6].map(n => `<button data-action="ball" data-runs="${n}" class="run-btn r${n}">${n}</button>`).join("")}
        <button data-action="undo" class="run-btn undo" ${state.snapshots.length ? "" : "disabled"}>UNDO</button>
      </div>

      <div class="extra-pad" style="grid-template-columns:repeat(${enabledExtras.length}, 1fr);">
        ${enabledExtras.map(e => `<button data-action="toggle-extra" data-extra="${e.extra}" class="${ui.pendingExtra === e.extra ? "active" : ""}">${e.label.toUpperCase()}</button>`).join("")}
      </div>
      ${ui.pendingExtra ? `<div class="extra-hint">Tap the runs for this ${ui.pendingExtra === "noball" ? "no-ball" : ui.pendingExtra}. Tap the button again to cancel.</div>` : ""}

      <button data-action="open-wicket" class="wicket-btn">
        <span class="main">WICKET</span>
        ${inn.freeHit ? `<span class="sub">free hit — run out only</span>` : ""}
      </button>

      <div class="live-links">
        <button data-action="toggle-scorecard" class="link-btn">${ui.showFullScorecard ? "Hide" : "Show"} full scorecard</button>
        ${inn.oversLimit == null ? `<button data-action="end-innings" class="link-btn" ${ui.endInningsConfirm ? `style="color:var(--wicket);font-weight:700;"` : ""}>${ui.endInningsConfirm ? "Tap again to end innings" : "End innings"}</button>` : ""}
      </div>
      ${ui.showFullScorecard ? renderInningsSummary(match, inn) : ""}
    </div>
  `;
}

/* --- scorecards / innings break / result --- */
function renderInningsSummary(match, inn){
  const bpo = inn.ballsPerOver;
  const battingName = teamName(match, inn.battingTeam);
  const battingRows = inn.batting.order.map(name => {
    const s = inn.batting.stats[name];
    const sr = s.balls ? ((s.runs / s.balls) * 100).toFixed(1) : "0.0";
    const status = s.out ? s.howOut : "not out";
    return `<tr><td>${escapeHtml(name)}</td><td class="status">${escapeHtml(status)}</td><td>${s.runs}</td><td>${s.balls}</td><td>${s.fours}</td><td>${s.sixes}</td><td>${sr}</td></tr>`;
  }).join("");
  const bowlingRows = inn.bowling.order.map(name => {
    const b = inn.bowling.stats[name];
    const econ = b.legalBalls ? (b.runs / (b.legalBalls / bpo)).toFixed(2) : "0.00";
    return `<tr><td>${escapeHtml(name)}</td><td>${oversDisplay(b.legalBalls, bpo)}</td><td>${b.maidens}</td><td>${b.runs}</td><td>${b.wickets}</td><td>${econ}</td></tr>`;
  }).join("");
  const extrasTotal = inn.extras.wides + inn.extras.noBalls + inn.extras.byes + inn.extras.legByes;
  return `
    <div class="innings-summary">
      <h3>${escapeHtml(battingName)} ${inn.runs}/${inn.wickets} <span class="ov">(${oversDisplay(inn.legalBalls, bpo)} ov)</span></h3>
      <table class="bat-table">
        <thead><tr><th>Batter</th><th></th><th>R</th><th>B</th><th>4s</th><th>6s</th><th>SR</th></tr></thead>
        <tbody>${battingRows}</tbody>
      </table>
      <div class="extras-line">Extras ${extrasTotal} (w ${inn.extras.wides}, nb ${inn.extras.noBalls}, b ${inn.extras.byes}, lb ${inn.extras.legByes})</div>
      <table class="bowl-table">
        <thead><tr><th>Bowler</th><th>O</th><th>M</th><th>R</th><th>W</th><th>Econ</th></tr></thead>
        <tbody>${bowlingRows}</tbody>
      </table>
      ${inn.fallOfWickets.length ? `<div class="fow">FoW: ${inn.fallOfWickets.map(f => `${f.score}/${f.wicket} (${f.over})`).join(", ")}</div>` : ""}
    </div>
  `;
}

/* A condensed "highlights" view for the innings break -- top 3 scorers,
   top 2 bowlers, extras inline -- deliberately separate from
   renderInningsSummary()'s full batting/bowling tables, which Live's
   "Show full scorecard" toggle and the Result screen still use as-is.
   Reuses the Live screen's .matchup-head/.matchup-row/.partnership-row
   classes (a plain eyebrow-header + data-row layout, nothing live-screen-
   specific about them) rather than inventing a parallel set. */
function renderInningsHighlights(match, inn){
  const bpo = inn.ballsPerOver;
  const battingName = teamName(match, inn.battingTeam);
  const bowlingName = teamName(match, inn.bowlingTeam);
  const topScorers = [...inn.batting.order].sort((a, b) => inn.batting.stats[b].runs - inn.batting.stats[a].runs).slice(0, 3);
  const bestBowlers = [...inn.bowling.order]
    .filter(name => inn.bowling.stats[name].legalBalls > 0)
    .sort((a, b) => inn.bowling.stats[b].wickets - inn.bowling.stats[a].wickets || inn.bowling.stats[a].runs - inn.bowling.stats[b].runs)
    .slice(0, 2);
  const extrasTotal = inn.extras.wides + inn.extras.noBalls + inn.extras.byes + inn.extras.legByes;

  return `
    <div class="innings-summary">
      <div style="display:flex;align-items:baseline;gap:8px;">
        <span style="font-size:.9rem;font-weight:800;">${escapeHtml(battingName)}</span>

/* A score/overs/"chasing N · balls left" line under the result headline
   -- kept separate from `match.result` (the persisted sentence standings/
   fixtures already read verbatim) rather than reparsed from it, since
   this needs the raw innings numbers anyway. No line for a forfeited
   match (there's no real chase to describe) or a first-innings forfeit
   (innings[1] doesn't exist -- same guard renderResult's scorecard
   section already needs). */
function renderResultDetail(match){
  const [i1, i2] = match.innings;
  if (match.forfeited || !i2) return "";
  const bpo = match.ballsPerOver;
  const i2ov = oversDisplay(i2.legalBalls, bpo);
  const i2Score = isAllOut(i2) ? `${i2.runs} all out` : `${i2.runs}-${i2.wickets}`;
  if (i2.runs === i1.runs) return `${i2Score} (${i2ov}) level with ${i1.runs}`;
  if (i2.runs > i1.runs){
    if (i2.oversLimit == null) return `${i2Score} (${i2ov}) chasing ${i1.runs}`;
    const ballsLeft = i2.oversLimit * bpo - i2.legalBalls;
    return `${i2Score} (${i2ov}) chasing ${i1.runs} · ${ballsLeft} ball${ballsLeft === 1 ? "" : "s"} left`;
  }
  return `${i2Score} (${i2ov}) chasing ${i1.runs}`;
}

/* Result's per-innings card is even more condensed than
   renderInningsHighlights (2 batters + 1 bowler, no extras line, one
   combined card) -- different enough in shape (combined vs. two cards,
   fewer rows) that parameterizing renderInningsHighlights would need
   more branches than just writing this separately. The winning team's
   score is picked out in green; ties and forfeits get no highlight
   (there's no single "winner" score to point at). Full detail is never
   actually lost -- toggling "Show full scorecard" swaps these cards for
   renderInningsSummary's complete tables, same flag Live's toggle uses. */
function renderResultInningsCard(match, inn){
  const bpo = inn.ballsPerOver;
  const [i1, i2] = match.innings;
  const isWinner = i2 && !match.forfeited && i2.runs !== i1.runs && (i2.runs > i1.runs ? inn === i2 : inn === i1);
  const scoreStr = isAllOut(inn) ? `${inn.runs}` : `${inn.runs}-${inn.wickets}`;
  const topBatters = [...inn.batting.order].sort((a, b) => inn.batting.stats[b].runs - inn.batting.stats[a].runs).slice(0, 2);
  const topBowler = [...inn.bowling.order]
    .filter(name => inn.bowling.stats[name].legalBalls > 0)
    .sort((a, b) => inn.bowling.stats[b].wickets - inn.bowling.stats[a].wickets || inn.bowling.stats[a].runs - inn.bowling.stats[b].runs)[0];
  const bowlerStats = topBowler ? inn.bowling.stats[topBowler] : null;
  return `
    <div class="innings-summary">
      <div style="display:flex;align-items:baseline;gap:8px;">
        <span style="font-size:.85rem;font-weight:800;">${escapeHtml(teamName(match, inn.battingTeam))}</span>
        <span class="n" style="flex-grow:1;text-align:right;font-size:1.05rem;font-weight:800;${isWinner ? "color:var(--accent-2);" : ""}">${scoreStr}</span>
        <span class="n" style="font-size:.7rem;color:var(--muted);">(${oversDisplay(inn.legalBalls, bpo)})</span>
      </div>
      ${topBatters.map(name => {
        const s = inn.batting.stats[name];
        return `<div style="display:flex;gap:6px;margin-top:8px;"><span style="flex-grow:1;font-size:.78rem;color:var(--muted);">${escapeHtml(name)}</span><span class="n" style="font-size:.78rem;font-weight:700;">${s.runs}${!s.out ? "*" : ""} (${s.balls})</span></div>`;
      }).join("")}
      ${topBowler ? `<div style="display:flex;gap:6px;margin-top:8px;padding-top:8px;border-top:2px solid var(--line-strong);"><span style="flex-grow:1;font-size:.78rem;color:var(--muted);">${escapeHtml(topBowler)}</span><span class="n" style="font-size:.78rem;font-weight:700;">${oversDisplay(bowlerStats.legalBalls, bpo)}-${bowlerStats.maidens}-${bowlerStats.runs}-${bowlerStats.wickets}</span></div>` : ""}
    </div>
  `;
}

function formatMotmLine(match, t){
  if (!t) return "";
  const parts = [];
  if (t.balls > 0) parts.push(`${t.runs}${t.notOuts > 0 ? "*" : ""} (${t.balls})`);
  if (t.catches > 0) parts.push(`${t.catches} ct`);
  if (t.runouts > 0) parts.push(`${t.runouts} ro`);
  if (t.balls > 0) parts.push(`SR ${((t.runs / t.balls) * 100).toFixed(1)}`);
  if (t.legalBalls > 0) parts.push(`${oversDisplay(t.legalBalls, match.ballsPerOver)}-${t.maidens}-${t.runsConceded}-${t.wickets}`);
  return parts.join(" · ");
}

/* --- share / export (dependency-free: canvas PNG, print-to-PDF) --- */
function renderScorecardCanvas(match){
  const W = 1080, pad = 48;
  function battingLines(inn){
    return inn.batting.order.map(name => {
      const s = inn.batting.stats[name];
      return `${name}  ${s.runs} (${s.balls})`;
    });
  }
  function bowlingLines(inn){
    return inn.bowling.order.map(name => {
      const b = inn.bowling.stats[name];
      return `${name}  ${oversDisplay(b.legalBalls, inn.ballsPerOver)}-${b.maidens}-${b.runs}-${b.wickets}`;
    });
  }
  const lines = [];
  lines.push({ text: `${match.teamA} vs ${match.teamB}`, size: 44, weight: "800" });
  lines.push({ text: match.result || "", size: 26, weight: "600", color: "#5FB98C" });
  lines.push({ size: 10 });
  match.innings.forEach(inn => {
    lines.push({ text: `${teamName(match, inn.battingTeam)}  ${inn.runs}/${inn.wickets}  (${oversDisplay(inn.legalBalls, inn.ballsPerOver)} ov)`, size: 30, weight: "700" });
    battingLines(inn).forEach(t => lines.push({ text: t, size: 22 }));
    lines.push({ size: 8 });
    bowlingLines(inn).forEach(t => lines.push({ text: t, size: 20, color: "#9FC2AF" }));
    lines.push({ size: 16 });
  });
  if (match.motm) lines.push({ text: `Man of the Match: ${match.motm}`, size: 24, weight: "700", color: "#F2C744" });

  const H = pad * 2 + lines.reduce((sum, l) => sum + (l.size + 14), 0);
  const canvas = document.createElement("canvas");
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext("2d");
  ctx.fillStyle = "#0B2E22"; ctx.fillRect(0, 0, W, H);
  let y = pad;
  lines.forEach(l => {
    if (l.text){
      ctx.fillStyle = l.color || "#F1F6F2";
      ctx.font = `${l.weight || "400"} ${l.size}px -apple-system, sans-serif`;
      ctx.fillText(l.text, pad, y + l.size);
    }
    y += l.size + 14;
  });
  return canvas;
}

async function shareScorecardImage(match){
  const canvas = renderScorecardCanvas(match);
  canvas.toBlob(async (blob) => {
    if (!blob) return;
    const file = new File([blob], "cricket-lk-scorecard.png", { type: "image/png" });
    if (navigator.canShare && navigator.canShare({ files: [file] })){
      try { await navigator.share({ files: [file], title: "Cricket.lk scorecard", text: match.result || "" }); return; }
      catch (_){ /* user cancelled, or share failed — fall through to a plain download */ }
    }
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = "cricket-lk-scorecard.png";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  }, "image/png");
}

      <div class="field-row">
        <label>Balls/over<input name="ballsPerOver" type="number" min="1" max="10" value="${p.ballsPerOver ?? 6}" required></label>
        <label>Overs<input name="oversLimit" type="number" min="1" max="50" value="${limitInputValue(p.oversLimit, 20)}" placeholder="No limit"></label>
      </div>
      <label>Players/side<input name="playersPerSide" type="number" min="2" max="11" value="${limitInputValue(p.playersPerSide, 11)}" placeholder="No limit"></label>

      <label class="check-row"><input type="checkbox" name="wideEnabled" ${!p.wide || p.wide.enabled ? "checked" : ""}> Wides count, worth <input name="wideRuns" type="number" min="0" max="6" value="${p.wide ? p.wide.runs : 1}" class="inline-num"></label>

function parseMatchPresetForm(f){
  return {
    id: f.get("id") || undefined,
    name: (f.get("name") || "").trim() || "Untitled preset",
    ballsPerOver: Math.max(1, parseInt(f.get("ballsPerOver"), 10) || 6),
    oversLimit: parseOptionalLimit(f.get("oversLimit"), 1),
    playersPerSide: parseOptionalLimit(f.get("playersPerSide"), 2),
    lastManStands: f.get("lastManStands") === "on",
    wide: { enabled: f.get("wideEnabled") === "on", runs: Math.max(0, parseInt(f.get("wideRuns"), 10) || 0) },
    noBall: { enabled: f.get("noBallEnabled") === "on", runs: Math.max(0, parseInt(f.get("noBallRuns"), 10) || 0) },
    freeHitOnNoBall: f.get("freeHitOnNoBall") === "on",
    requireFielderOnCatch: f.get("requireFielderOnCatch") === "on",
    requireFielderOnRunout: f.get("requireFielderOnRunout") === "on"
  };
}
function parseTournamentPresetForm(f){
  return {
    id: f.get("id") || undefined,
    name: (f.get("name") || "").trim() || "Untitled preset",
    matchPresetId: f.get("matchPresetId"),
    pointsForWin: Math.max(0, parseInt(f.get("pointsForWin"), 10) || 0),
    pointsForTie: Math.max(0, parseInt(f.get("pointsForTie"), 10) || 0),
    pointsForLoss: Math.max(0, parseInt(f.get("pointsForLoss"), 10) || 0),
    useNRR: f.get("useNRR") === "on"
  };
}

function handleMatchPresetSubmit(e){

}

function handleTournamentPresetSubmit(e){

  save(); render();
}

/* Club variants: same forms, but the preset goes to club_presets in the
   cloud for ui.currentClubId -- never into state.matchPresets/
   tournamentPresets (those are the guest's, on this device). */
function saveClubPresetFromForm(e, kind, preset, editingKey){

  saveClubPreset(ui.currentClubId, kind, preset).then(result => {

    ui[editingKey] = null;

  });
