function handleClubMatchPresetSubmit(e){ saveClubPresetFromForm(e, "match", parseMatchPresetForm(new FormData(e.target)), "editingClubMatchPreset"); }
function handleClubTournamentPresetSubmit(e){ saveClubPresetFromForm(e, "tournament", parseTournamentPresetForm(new FormData(e.target)), "editingClubTournamentPreset"); }

/* --- tournament setup & dashboard --- */
function renderTournamentSetup(){
  const presets = Object.values(state.tournamentPresets);
  if (!ui.tournamentSetupPresetId){
    ui.tournamentSetupPresetId = presets.length ? presets[0].id : null;
  }
  const teams = Object.values(state.teams);
  return `
    <div class="screen setup">
      ${renderBackBar("Home", "home")}
      <h1>🏆 New tournament</h1>
      ${teams.length < 2 ? `<p class="hint">You need at least 2 saved teams. <button data-action="go-view" data-view="teams" class="link-btn">Add teams</button></p>` : ""}
      <form id="tournament-setup-form">
        <label>Tournament name<input name="name" required maxlength="40" placeholder="e.g. Sunday League 2026"></label>
        <input type="hidden" name="tournamentPresetId" value="${ui.tournamentSetupPresetId || ""}">
        ${presets.length ? `
          <div class="preset-picker">
            ${presets.map(p => `<button type="button" data-action="pick-tournament-preset" data-id="${p.id}" class="preset-chip ${p.id === ui.tournamentSetupPresetId ? "active" : ""}">${escapeHtml(p.name)}</button>`).join("")}
          </div>
        ` : ""}
        <fieldset>
          <legend>Teams in this tournament</legend>
          ${teams.map(t => `<label class="check-row"><input type="checkbox" name="teamIds" value="${t.id}" ${ui.tournamentSetupTeamIds.includes(t.id) ? "checked" : ""}> ${escapeHtml(t.name)}</label>`).join("") || `<p class="hint">No saved teams yet.</p>`}
        </fieldset>
        <button type="submit" class="primary" ${teams.length < 2 ? "disabled" : ""}>Create tournament</button>
      </form>
    </div>
  `;
}

function handleTournamentSetupSubmit(e){
  e.preventDefault();
  const f = new FormData(e.target);
  const name = (f.get("name") || "").trim();
  const tournamentPresetId = f.get("tournamentPresetId") || ui.tournamentSetupPresetId;
  const teamIds = f.getAll("teamIds");
  if (!name || teamIds.length < 2 || !tournamentPresetId) return;
  const tournament = createTournament({ name, tournamentPresetId, teamIds });
  state.activeTournamentId = tournament.id;
  ui.tournamentSetupTeamIds = [];
  ui.tournamentSetupPresetId = null;
  state.view = "tournamentDashboard";
  ui.tournamentTab = "standings";
  save(); render();
}

function renderTournamentDashboard(){
  const t = activeTournament();
  if (!t) return renderHome();
  const preset = state.tournamentPresets[t.tournamentPresetId] || DEFAULT_TOURNAMENT_PRESETS[0];
  const matchPreset = state.matchPresets[preset.matchPresetId] || DEFAULT_MATCH_PRESETS[0];
  const matches = t.matchIds.map(id => state.matchHistory[id]).filter(Boolean);
  const standings = computeStandings(matches, preset);
  const tab = ui.tournamentTab || "standings";
  const teams = t.teamIds.map(id => state.teams[id]).filter(Boolean);

  return `
    <div class="screen tournament">
      ${renderBackBar("Home", "home")}
      <h1>🏆 ${escapeHtml(t.name)}</h1>
      <p class="tagline">${escapeHtml(matchPreset.name)} · ${preset.pointsForWin}/${preset.pointsForTie}/${preset.pointsForLoss} pts${preset.useNRR ? " · NRR" : ""}</p>
      <div class="tab-row">
        <button data-action="switch-tournament-tab" data-tab="standings" class="tab-btn ${tab === "standings" ? "active" : ""}">Standings</button>
        <button data-action="switch-tournament-tab" data-tab="fixtures" class="tab-btn ${tab === "fixtures" ? "active" : ""}">Fixtures</button>
        <button data-action="switch-tournament-tab" data-tab="stats" class="tab-btn ${tab === "stats" ? "active" : ""}">Stats</button>
      </div>
      ${tab === "standings" ? renderStandingsTable(standings, preset.useNRR) : ""}
      ${tab === "fixtures" ? renderTournamentFixtures(matches, teams) : ""}
      ${tab === "stats" ? renderTournamentStats(matches) : ""}
      ${tab !== "fixtures" && !state.match ? `<button data-action="switch-tournament-tab" data-tab="fixtures" class="primary">Start a fixture</button>` : ""}
    </div>
  `;
}

function renderStandingsTable(standings, useNRR){
  if (!standings.length) return `<p class="hint">No completed matches yet.</p>`;
  return `
    <div class="leaderboard">
      <h3>Points table</h3>
      <table class="standings-table">
        <thead><tr><th>Team</th><th>P</th><th>W</th><th>L</th><th>T</th><th>Pts</th>${useNRR ? "<th>NRR</th>" : ""}</tr></thead>
        <tbody>${standings.map(s => `<tr><td>${escapeHtml(s.name)}</td><td>${s.played}</td><td>${s.won}</td><td>${s.lost}</td><td>${s.tied}</td><td><b>${s.points}</b></td>${useNRR ? `<td>${s.nrr >= 0 ? "+" : ""}${s.nrr.toFixed(3)}</td>` : ""}</tr>`).join("")}</tbody>
      </table>
      <p class="hint" style="margin-top:6px;">Forfeited matches count for points but are excluded from net run rate. An all-out innings counts its full overs quota.</p>
    </div>
  `;
}

function renderTournamentFixtures(matches, teams){
  const results = matches.map(m => `
    <div class="fixture-row">
      <span>${escapeHtml(teamName(m, "A"))} vs ${escapeHtml(teamName(m, "B"))}</span>
      <span class="fixture-result">${escapeHtml(m.result || "")}</span>
    </div>
  `).join("") || `<p class="hint">No matches played yet.</p>`;

  const startForm = state.match ? `<p class="hint">Finish the current match before starting another.</p>` : `
    <form id="tournament-start-match-form">
      <div class="form-error"></div>
      <label>Team A<select name="teamAId" required>${teams.map(tm => `<option value="${tm.id}">${escapeHtml(tm.name)}</option>`).join("")}</select></label>
      <label>Team B<select name="teamBId" required>${teams.map((tm, i) => `<option value="${tm.id}" ${i === 1 ? "selected" : ""}>${escapeHtml(tm.name)}</option>`).join("")}</select></label>
      <h3 class="section-label">Who bats first?</h3>
      <fieldset class="tile-fieldset">
        <legend>Who bats first?</legend>
        <label><input type="radio" name="battingFirst" value="A" checked> Team A</label>
        <label><input type="radio" name="battingFirst" value="B"> Team B</label>
      </fieldset>
      <button type="submit" class="primary" ${teams.length < 2 ? "disabled" : ""}>Start match</button>
    </form>
  `;

  return `<div class="fixtures">${results}</div><h3 class="section-label">Start a match</h3>${startForm}`;
}

function renderTournamentStats(matches){
  const totals = aggregatePlayerStats(matches);
  if (!totals.length) return `<p class="hint">No stats yet.</p>`;
  const mvp = totals[0];
  return `
    <div class="mvp-callout"><span class="mvp-label">Tournament MVP</span><span class="mvp-name">${escapeHtml(mvp.name)}</span><span class="mvp-points">${mvp.points} pts</span></div>
    ${renderLeaderboards(totals)}
  `;
}

function handleTournamentStartMatchSubmit(e){
  e.preventDefault();
  const t = activeTournament();
  if (!t) return;
  const f = new FormData(e.target);
  const teamAId = f.get("teamAId"), teamBId = f.get("teamBId");
  if (!teamAId || !teamBId || teamAId === teamBId){
    showFormError(e.target, "Pick two different teams."); return;
  }
  const preset = state.tournamentPresets[t.tournamentPresetId];
  const matchPreset = state.matchPresets[preset.matchPresetId] || DEFAULT_MATCH_PRESETS[0];
  const battingFirst = f.get("battingFirst") || "A";
  state.match = createMatch({
    teamA: state.teams[teamAId].name,
    teamB: state.teams[teamBId].name,
    oversLimit: matchPreset.oversLimit,
    playersPerSide: matchPreset.playersPerSide,
    ballsPerOver: matchPreset.ballsPerOver,
    wideEnabled: matchPreset.wide.enabled, wideRuns: matchPreset.wide.runs,
    noBallEnabled: matchPreset.noBall.enabled, noBallRuns: matchPreset.noBall.runs,
    freeHitOnNoBall: matchPreset.freeHitOnNoBall,
    lastManStands: matchPreset.lastManStands,
    requireFielderOnCatch: matchPreset.requireFielderOnCatch,
    requireFielderOnRunout: matchPreset.requireFielderOnRunout,
    battingFirst,
    presetId: matchPreset.id, presetName: matchPreset.name,
    tournamentId: t.id
  });
  state.snapshots = [];
  save(); render();
}

/* --- stats (all-time leaderboards, shared with the tournament stats tab) --- */
function renderLeaderboards(totals){
  const byRuns = [...totals].sort((a, b) => b.runs - a.runs).slice(0, 10);
  const byWickets = [...totals].filter(t => t.legalBalls > 0).sort((a, b) => b.wickets - a.wickets || a.runsConceded - b.runsConceded).slice(0, 10);
  const byFielding = [...totals].filter(t => (t.catches + t.runouts) > 0).sort((a, b) => (b.catches + b.runouts) - (a.catches + a.runouts)).slice(0, 10);
  const byPoints = totals.slice(0, 10);
  return `
    <div class="leaderboard mvp">
      <h3>MVP points</h3>
      <table><thead><tr><th>Player</th><th>M</th><th>Runs</th><th>Wkt</th><th>Pts</th></tr></thead>
      <tbody>${byPoints.map(t => `<tr><td>${escapeHtml(t.name)}</td><td>${t.matches}</td><td>${t.runs}</td><td>${t.wickets}</td><td><b>${t.points}</b></td></tr>`).join("")}</tbody></table>
      <p class="hint">Fixed formula — batting, bowling, catches and run-outs. Not configurable.</p>
    </div>
    <div class="leaderboard">
      <h3>Most runs</h3>
      <table><thead><tr><th>Player</th><th>M</th><th>R</th><th>Avg</th></tr></thead>
      <tbody>${byRuns.map(t => `<tr><td>${escapeHtml(t.name)}</td><td>${t.matches}</td><td>${t.runs}</td><td>${t.innings ? (t.runs / t.innings).toFixed(1) : "0.0"}</td></tr>`).join("")}</tbody></table>
    </div>
    <div class="leaderboard">
      <h3>Most wickets</h3>
      <table><thead><tr><th>Player</th><th>M</th><th>W</th><th>Econ</th></tr></thead>
      <tbody>${byWickets.map(t => `<tr><td>${escapeHtml(t.name)}</td><td>${t.matches}</td><td>${t.wickets}</td><td>${t.legalBalls ? (t.runsConceded / (t.legalBalls / 6)).toFixed(2) : "0.00"}</td></tr>`).join("")}</tbody></table>
    </div>
    <div class="leaderboard">
      <h3>Most catches / run-outs</h3>
      <table><thead><tr><th>Player</th><th>Ct</th><th>RO</th></tr></thead>
      <tbody>${byFielding.map(t => `<tr><td>${escapeHtml(t.name)}</td><td>${t.catches}</td><td>${t.runouts}</td></tr>`).join("")}</tbody></table>
    </div>
  `;
}

function renderStatsScreen(){
  const matches = Object.values(state.matchHistory).filter(m => !m.clubId); // guest matches only
  return `
    <div class="screen stats">
      ${renderBackBar("Home", "home")}
      <h1>📊 All-time stats</h1>
      ${matches.length ? renderLeaderboards(aggregatePlayerStats(matches)) : `<p class="hint">Play and finish a match to see stats here.</p>`}
      ${matches.length ? `<p class="hint">Read from archived matches only — ${matches.length} of them. Editing an old match does not recompute anything here.</p>` : ""}
    </div>
  `;
}

/* --- render loop & boot --- */
function render(){
  const root = document.getElementById("app");
  const m = state.match;
  // Home's club switcher needs ui.myClubs; fetch it once, lazily, rather
  // than on every screen -- guarded so a pending fetch never re-fires.
  if (!m && state.view === "home" && session && ui.myClubs === null && !ui.myClubsLoading){
    ui.myClubsLoading = true;
    fetchMyClubs().then(() => { ui.myClubsLoading = false; render(); });
  }
  // ui isn't persisted, so a saved profile view has nothing to show after a reload.
  if (state.view === "playerProfile" && !ui.profile) state.view = "home";
  // A persisted club view after a reload has no ui.currentClubId (ui isn't saved).
  if (["clubPlayers", "clubPresets", "clubStats"].includes(state.view) && !ui.currentClubId){
    if (state.activeClubId) ui.currentClubId = state.activeClubId; else state.view = "home";
  }
  // Club data (roster, matches, presets) is loaded once per club the screen
  // in front of you needs: a club match, Home while acting as a club, or a
  // club setup screen. Guarded by ui.clubRosterLoading so it never loops.
  const wantClubId = m && m.clubId ? m.clubId
    : (!m && state.view === "home" && state.activeClubId && (ui.myClubs || []).some(c => c.id === state.activeClubId)) ? state.activeClubId
    : (!m && (state.view === "matchSetup" || state.view === "clubTournamentSetup") && ui.currentClubId && (state.view !== "matchSetup" || ui.clubMatchSetupType)) ? ui.currentClubId
    : (!m && ["clubPlayers", "clubPresets", "clubStats", "clubTournamentDashboard"].includes(state.view) && ui.currentClubId) ? ui.currentClubId
    : null;
  if (wantClubId && supabaseClient && session && (!ui.club || ui.club.id !== wantClubId) && ui.clubRosterLoading !== wantClubId){
    ui.clubRosterLoading = wantClubId;
    fetchClubDetail(wantClubId).then(render);
  }
  let html;
  const inProgress = !!(m && m.status !== "complete");
  const away = inProgress && ui.awayFromMatch;
  if (inProgress && !away){
    html = m.status === "innings_break" ? renderInningsBreak(m) : renderLive(m);
  } else if (m && m.status === "complete"){
    html = renderResult(m);
  } else if (state.view === "teams"){
    html = renderTeamsScreen();
  } else if (state.view === "players"){
    html = renderPlayersScreen();
  } else if (state.view === "presets"){
    html = renderPresetsScreen();
  } else if (state.view === "matchSetup"){
    html = renderMatchSetup();
  } else if (state.view === "tournamentSetup"){
    html = renderTournamentSetup();
  } else if (state.view === "tournamentDashboard"){
    html = renderTournamentDashboard();
  } else if (state.view === "stats"){
    html = renderStatsScreen();
  } else if (state.view === "signIn"){
    html = renderSignIn();
  } else if (state.view === "signUp"){
    html = renderSignUp();
  } else if (state.view === "account"){
    html = renderAccount();
  } else if (state.view === "myClubs"){
    html = renderMyClubs();
  } else if (state.view === "clubHome"){
    html = renderClubHome();
  } else if (state.view === "clubTournamentSetup"){
    html = renderClubTournamentSetup();
  } else if (state.view === "clubTournamentDashboard"){
    html = renderClubTournamentDashboard();
  } else if (state.view === "premier"){
    html = renderPremierScreen();
  } else if (state.view === "premierPlayers"){
    html = renderPremierPlayers();
  } else if (state.view === "premierTeams"){
    html = renderPremierTeams();
  } else if (state.view === "premierStats"){
    html = renderPremierStats();
  } else if (state.view === "settings"){
    html = renderSettingsScreen();
  } else if (state.view === "playerProfile"){
    html = renderPlayerProfile();
  } else if (state.view === "clubPlayers"){
    html = renderClubPlayers();
  } else if (state.view === "clubPresets"){
    html = renderClubPresets();
  } else if (state.view === "clubStats"){
    html = renderClubStats();
  } else {
    html = renderHome();
  }
  const canNavigate = !m || inProgress;
  // Hidden on the auth screens themselves -- showing a "Sign in" CTA
  // while already on the sign-in form (or signed-out on Account, which
  // renders the same form) is redundant clutter, not a shortcut to anywhere.
  const onAuthScreen = state.view === "signIn" || state.view === "signUp" || state.view === "account";
  root.classList.toggle("live-mode", !!(inProgress && !away && m.status !== "innings_break"));
  root.innerHTML = renderTopBar(canNavigate, onAuthScreen) + html + renderPlayersDatalist() + renderSquadDatalists() + renderTeamsDatalist()
    + (canNavigate ? renderSideMenu() : "");

  const modalRoot = document.getElementById("modal-root");
  let modalHtml = "";
  // Player modals (club Players / profile) only exist off the live screen.
  // modalKey lets an already-open one survive re-renders untouched.
  let modalKey = "";
  const pm = ui.playerModal;
  const pmValid = pm && (!inProgress || away) && (
    (pm.kind === "add" && state.view === "clubPlayers") ||
    (pm.kind === "edit" && state.view === "playerProfile" && ui.profile && ui.profile.data && ui.profile.data.can_see_contact) ||
    (pm.kind === "remove" && (state.view === "clubPlayers" || state.view === "playerProfile")));
  if (pm && !pmValid) ui.playerModal = null;
  if (pmValid){
    modalKey = pm.kind === "remove" ? `remove:${pm.id}:${pm.busy ? 1 : 0}:${pm.error || ""}` : pm.kind;
    modalHtml = pm.kind === "add" ? renderClubAddPlayerModal() : pm.kind === "edit" ? renderPlayerEditModal() : renderRemovePlayerModal();
  } else if (away){
    modalHtml = "";
  } else if (m && m.status !== "complete" && ui.forfeitFlow){
    modalHtml = renderForfeitModal(m);
  } else if (m && m.status === "opening"){
    modalHtml = renderOpeningModal(m);
  } else if (m && m.status === "live"){
    const inn = currentInnings(m);
    const slot = pendingBatsmanSlot(inn);
    if (slot) modalHtml = renderNewBatsmanModal(inn, slot);
    else if (!inn.bowler) modalHtml = renderNewBowlerModal(inn);
    else if (ui.wicketFlow) modalHtml = renderWicketModal(inn);
  }
  if (!(modalKey && modalRoot.dataset.modalKey === modalKey)){
    modalRoot.innerHTML = modalHtml;
    modalRoot.dataset.modalKey = modalKey;
    if (modalKey === "add"){ const first = modalRoot.querySelector('input[name="name"]'); if (first) first.focus(); }
  }
}

document.addEventListener("click", (e) => {
  const btn = e.target.closest("[data-action]");
  if (!btn) return;
  const action = btn.dataset.action;
  // Any nav item tapped inside the side menu closes it -- reuses whatever
  // action the item already dispatches (go-view, go-my-clubs, etc.)
  // rather than needing menu-specific action names.
  if (ui.sideMenuOpen && btn.closest(".side-menu") && action !== "close-side-menu"){
    ui.sideMenuOpen = false;
    // Leaving a match in progress for another view is UI-only (not persisted):
    // render() keeps showing the match until this is cleared, and a reload
    // drops straight back onto it.
    if (state.match && state.match.status !== "complete" && action !== "resume-match") ui.awayFromMatch = true;
  }
  if (action !== "end-innings") ui.endInningsConfirm = false;
  if (action !== "delete-tournament-team") ui.tournamentTeamDelete = null;
  if (action === "ball") handleBallClick(parseInt(btn.dataset.runs, 10));
  else if (action === "end-innings") handleEndInnings();
  else if (action === "toggle-extra"){ ui.pendingExtra = (ui.pendingExtra === btn.dataset.extra) ? null : btn.dataset.extra; render(); }
  else if (action === "open-wicket"){ ui.wicketFlow = "menu"; render(); }
  else if (action === "close-wicket-modal"){ ui.wicketFlow = null; ui.runoutRuns = 0; ui.runoutEnd = "striker"; render(); }
  else if (action === "pick-runout-end"){ ui.runoutEnd = btn.dataset.end; render(); }
  else if (action === "pick-bowler"){ confirmNewBowler(btn.dataset.name); }
  else if (action === "pick-wicket"){
    if (btn.dataset.type === "runout" || btn.dataset.type === "caught"){ ui.wicketFlow = btn.dataset.type; render(); }
    else confirmWicket(btn.dataset.type);
  }
  else if (action === "runout-runs"){ ui.runoutRuns = parseInt(btn.dataset.runs, 10); render(); }
  else if (action === "resume-match"){ ui.awayFromMatch = false; render(); }
  else if (action === "open-forfeit"){ ui.forfeitFlow = true; ui.forfeitTeam = null; render(); }
  else if (action === "close-forfeit-modal"){ ui.forfeitFlow = false; ui.forfeitTeam = null; render(); }
  else if (action === "pick-forfeit-team"){ ui.forfeitTeam = btn.dataset.team; render(); }
  else if (action === "confirm-forfeit"){
    if (!ui.forfeitTeam) return;
    pushSnapshot();
    forfeitMatch(state.match, ui.forfeitTeam);
    maybeArchiveCompletedMatch(state.match);
    ui.forfeitFlow = false; ui.forfeitTeam = null;
    save(); render();
  }
  else if (action === "undo") handleUndo();
  else if (action === "toggle-scorecard"){ ui.showFullScorecard = !ui.showFullScorecard; render(); }
  else if (action === "start-second-innings"){ pushSnapshot(); startSecondInnings(state.match); save(); render(); }
  else if (action === "share-image") shareScorecardImage(state.match);
  else if (action === "export-pdf") window.print();
  else if (action === "finish-match"){
    const tournamentId = state.match.tournamentId;
    const clubId = state.match.clubId;
    state.match = null; state.snapshots = []; ui = defaultUi();
    if (clubId && tournamentId){
      // a club's own Local-tier tournament -- tournamentId is a cloud
      // `tournaments` row here, NOT a key into local state.tournaments.
      ui.currentClubId = clubId; ui.currentTournamentId = tournamentId; state.view = "clubTournamentDashboard";
      fetchClubTournamentDetail(tournamentId).then(render);
    }
    else if (clubId){ ui.currentClubId = clubId; state.view = "clubHome"; fetchClubDetail(clubId).then(render); }
    else if (tournamentId){ state.activeTournamentId = tournamentId; state.view = "tournamentDashboard"; }
    else state.view = "home";
    save(); render();
  }
  else if (action === "toggle-sound"){
    state.soundEnabled = !state.soundEnabled;
    save(); render();
    if (state.soundEnabled) SFX.tap();
  }
  else if (action === "go-view"){
    state.view = btn.dataset.view;
    // Self-healing: "clubHome" can now be reached (via back-bars) without
    // ever having gone through "open-club" first -- e.g. back from a
    // tournament created directly off Home -- so make sure ui.club
    // actually matches before rendering it, instead of showing stale data.
    if (state.view === "clubHome" && ui.currentClubId && (!ui.club || ui.club.id !== ui.currentClubId)){
      ui.club = null; render();
      fetchClubDetail(ui.currentClubId).then(render);
    } else render();
  }
  else if (action === "go-account"){ state.view = session ? "account" : "signIn"; render(); }
  else if (action === "sign-out"){ handleSignOut(); }
  else if (action === "go-admin-portal"){ location.href = "admin.html"; } // platform admins only; admin.html re-checks server-side
  else if (action === "go-premier"){ state.view = "premier"; render(); fetchPremierData().then(render); }
  else if (action === "open-side-menu"){ ui.sideMenuOpen = true; render(); }
  else if (action === "close-side-menu"){ ui.sideMenuOpen = false; render(); }
  else if (action === "pick-theme"){ state.themeId = btn.dataset.id; applyTheme(); save(); render(); }
  else if (action === "go-match-setup"){ ui.matchSetupPresetId = null; ui.clubMatchSetupType = null; state.view = "matchSetup"; render(); }
  else if (action === "go-my-clubs"){ state.view = "myClubs"; render(); fetchMyClubs().then(render); }
  else if (action === "open-club"){
    ui.currentClubId = btn.dataset.id; ui.club = null; state.view = "clubHome"; render();
    fetchClubDetail(btn.dataset.id).then(render);
  }
  else if (action === "open-player-profile"){
    ui.profile = { scope: btn.dataset.scope, id: btn.dataset.id, name: btn.dataset.name, data: null, loading: true, error: null, editing: false, message: null, aliases: [], claiming: false, merging: false };
    state.view = "playerProfile"; render();
    fetchPlayerProfile(btn.dataset.id).then(r => {
      if (!ui.profile || ui.profile.id !== btn.dataset.id) return;
      ui.profile.loading = false; if (r.error) ui.profile.error = r.error; else ui.profile.data = r.data;
      render();
    });
    if (supabaseClient) fetchPlayerAliases(btn.dataset.id).then(al => { if (ui.profile && ui.profile.id === btn.dataset.id){ ui.profile.aliases = al; render(); } });
    if (session) fetchMyPlayerIdentity().then(() => { if (ui.profile && ui.profile.id === btn.dataset.id) render(); });
    // The Premier block needs ui.premier; a Premier-opened profile also needs
    // the viewer's clubs' matches for its club block.
    if (!ui.premier) fetchPremierData().then(render);
    if (btn.dataset.scope === "premier"){
      fetchViewerClubMatches().then(ms => { if (ui.profile && ui.profile.id === btn.dataset.id){ ui.profile.clubMatches = ms; render(); } });
    }
  }
  else if (action === "clear-photo"){
    const field = btn.closest(".photo-field");
    const preview = field && field.querySelector(".photo-preview");
    if (!field) return;
    field.querySelector('input[name="photo"]').value = "";
    if (preview) preview.outerHTML = `<div class="avatar-badge photo-preview">${escapeHtml(field.dataset.initial || "?")}</div>`;
  }
  else if (action === "edit-player-profile"){ ui.playerModal = { kind: "edit" }; ui.profile.message = null; render(); }
  else if (action === "open-club-add-player"){ ui.playerModal = { kind: "add" }; ui.clubAddMessage = null; render(); }
  else if (action === "close-player-modal"){ ui.playerModal = null; render(); }
  else if (action === "add-existing-club-player"){
    const form = btn.closest("form");
    btn.disabled = true;
    addExistingPlayerToClub(ui.currentClubId, btn.dataset.id).then(r => {
      if (r.error){ btn.disabled = false; if (form) showFormError(form, r.error); return; }
      ui.playerModal = null;
      ui.clubAddMessage = `${btn.dataset.name} added to the club from the platform.`;
      render();
      fetchClubDetail(ui.currentClubId).then(render);
    });
  }
  else if (action === "ask-remove-club-player"){ ui.playerModal = { kind: "remove", id: btn.dataset.id, name: btn.dataset.name, busy: false, error: null }; render(); }
  else if (action === "confirm-remove-club-player"){
    const pmr = ui.playerModal;
    if (!pmr || pmr.kind !== "remove" || pmr.busy) return;
    pmr.busy = true; pmr.error = null; render();
    removePlayerFromClub(ui.currentClubId, pmr.id).then(r => {
      if (ui.playerModal !== pmr) return;
      if (r.error){ pmr.busy = false; pmr.error = r.error; render(); return; }
      ui.playerModal = null;
      ui.clubAddMessage = `${pmr.name} was removed from the club roster.`;
      if (state.view === "playerProfile") state.view = "clubPlayers";
      save(); render();
      fetchClubDetail(ui.currentClubId).then(render);
    });
  }
  else if (action === "go-club-view"){
    ui.currentClubId = state.activeClubId; ui.editingClubMatchPreset = null; ui.editingClubTournamentPreset = null;
    state.view = btn.dataset.view; render();
  }
  else if (action === "go-club-match-setup"){
    // Reached from Home's quick-action cards -- ui.currentClubId here
    // always follows the switcher (state.activeClubId), not whatever
    // club page (if any) was last viewed.
    ui.currentClubId = state.activeClubId;
    ui.matchSetupPresetId = null; ui.clubMatchSetupType = btn.dataset.type; state.view = "matchSetup"; render();
  }
  else if (action === "go-club-tournament-setup"){
    ui.currentClubId = state.activeClubId;
    ui.clubTournamentSetupPresetId = null; ui.clubTournamentSetupName = null; state.view = "clubTournamentSetup"; render();
  }
  else if (action === "pick-club-tournament-preset"){
    // Keep whatever is in the name box -- the re-render would otherwise reset it to today's date.
    const nameInput = btn.form && btn.form.elements.namedItem("name");
    if (nameInput) ui.clubTournamentSetupName = nameInput.value;
    ui.clubTournamentSetupPresetId = btn.dataset.id; render();
  }
  else if (action === "open-club-tournament"){
    ui.currentTournamentId = btn.dataset.id; ui.clubTournament = null; ui.tournamentTeamEdit = null; ui.tournamentTeamError = null; state.view = "clubTournamentDashboard"; render();
    fetchClubTournamentDetail(btn.dataset.id).then(render);
  }
  else if (action === "new-tournament-team" && ui.clubTournament){
    const n = ui.clubTournament.teams.length;
    ui.tournamentTeamEdit = { id: null, name: n < 26 ? `Team ${String.fromCharCode(65 + n)}` : "", playerIds: [] };
    ui.tournamentTeamDelete = null; render();
  }
  else if (action === "edit-tournament-team" && ui.clubTournament){
    const team = ui.clubTournament.teams.find(t => t.id === btn.dataset.id);
    if (team){ ui.tournamentTeamEdit = { id: team.id, name: team.name, playerIds: team.players.map(p => p.id) }; ui.tournamentTeamDelete = null; render(); }
  }
  else if (action === "cancel-tournament-team"){ ui.tournamentTeamEdit = null; render(); }
  else if (action === "delete-tournament-team" && ui.clubTournament){
    // Two taps: the first arms this row's button, the second deletes.
    if (ui.tournamentTeamDelete !== btn.dataset.id){ ui.tournamentTeamDelete = btn.dataset.id; render(); return; }
    ui.tournamentTeamDelete = null;
    const tid = ui.clubTournament.id;
    deleteTournamentTeam(tid, btn.dataset.id).then(result => {
      ui.tournamentTeamError = result.error || null;
      fetchClubTournamentDetail(tid).then(render);
    });
  }
  else if (action === "go-club-tournament-match-setup"){
    ui.matchSetupPresetId = null; ui.clubMatchSetupType = "tournament"; state.view = "matchSetup"; render();
  }
  else if (action === "open-claim-form"){ ui.profile.claiming = true; ui.profile.merging = false; ui.profile.message = null; render(); }
  else if (action === "open-merge-form"){ ui.profile.merging = true; ui.profile.claiming = false; ui.profile.message = null; render(); }
  else if (action === "close-ownership-form"){ ui.profile.claiming = false; ui.profile.merging = false; render(); }
  else if (action === "approve-merge" || action === "reject-merge"){
    (action === "approve-merge" ? approveMergeRequest : rejectMergeRequest)(btn.dataset.id).then(result => {
      ui.claimMessage = result && result.error ? result.error : (action === "approve-merge" ? "Merged." : "Rejected.");
      fetchPremierData().then(render);
    });
  }
  else if (action === "approve-claim"){
    approveClaimRequest(btn.dataset.id).then(result => {
      ui.claimMessage = result && result.error ? result.error : "Approved.";
      fetchPremierData().then(render);
    });
  }
  else if (action === "reject-claim"){
    rejectClaimRequest(btn.dataset.id).then(result => {
      ui.claimMessage = result && result.error ? result.error : "Rejected.";
      fetchPremierData().then(render);
    });
  }
  else if (action === "go-tournament-setup"){ ui.tournamentSetupPresetId = null; ui.tournamentSetupTeamIds = []; state.view = "tournamentSetup"; render(); }
  else if (action === "pick-match-preset"){ ui.matchSetupPresetId = btn.dataset.id; render(); }
  else if (action === "pick-tournament-preset"){ ui.tournamentSetupPresetId = btn.dataset.id; render(); }
  else if (action === "open-tournament"){ state.activeTournamentId = btn.dataset.id; state.view = "tournamentDashboard"; ui.tournamentTab = "standings"; render(); }
  else if (action === "switch-tournament-tab"){ ui.tournamentTab = btn.dataset.tab; render(); }
  else if (action === "select-team"){ ui.selectedTeamId = btn.dataset.id; render(); }
  else if (action === "delete-team"){
    if (!confirm("Delete this team? Past match history is unaffected.")) return;
    deleteTeam(btn.dataset.id);
    if (ui.selectedTeamId === btn.dataset.id) ui.selectedTeamId = null;
    save(); render();
  }
  else if (action === "remove-player"){ removePlayerFromTeam(btn.dataset.team, btn.dataset.player); save(); render(); }
  else if (action === "delete-player"){
    if (!confirm("Delete this player? They'll be removed from every team, but past match history is unaffected.")) return;
    deletePlayer(btn.dataset.id);
    save(); render();
  }
  else if (action === "move-player"){
    const row = btn.closest(".roster-row");
    const toId = row.querySelector('[data-role="move-target"]').value;
    movePlayerToTeam(btn.dataset.player, btn.dataset.from, toId);
    save(); render();
  }
  else if (action === "switch-presets-tab"){ ui.presetsTab = btn.dataset.tab; ui.editingMatchPreset = null; ui.editingTournamentPreset = null; render(); }
  else if (action === "new-match-preset"){ ui.editingMatchPreset = {}; render(); }
  else if (action === "edit-match-preset"){ ui.editingMatchPreset = Object.assign({}, state.matchPresets[btn.dataset.id]); render(); }
  else if (action === "delete-match-preset"){
    if (!confirm("Delete this match preset?")) return;
    deleteMatchPreset(btn.dataset.id); save(); render();
  }
  else if (action === "new-tournament-preset"){ ui.editingTournamentPreset = {}; render(); }
  else if (action === "edit-tournament-preset"){ ui.editingTournamentPreset = Object.assign({}, state.tournamentPresets[btn.dataset.id]); render(); }
  else if (action === "delete-tournament-preset"){
    if (!confirm("Delete this tournament preset?")) return;
    deleteTournamentPreset(btn.dataset.id); save(); render();
  }
  else if (action === "cancel-preset-edit"){ ui.editingMatchPreset = null; ui.editingTournamentPreset = null; render(); }
  else if (action === "club-new-match-preset"){ ui.editingClubMatchPreset = {}; render(); }
  else if (action === "club-edit-match-preset"){ ui.editingClubMatchPreset = Object.assign({}, clubPresetList("match", ui.currentClubId).find(p => p.id === btn.dataset.id)); render(); }
  else if (action === "club-delete-match-preset" || action === "club-delete-tournament-preset"){
    if (!confirm("Delete this club preset?")) return;
    deleteClubPreset(ui.currentClubId, btn.dataset.id).then(() => fetchClubDetail(ui.currentClubId).then(render));
  }
  else if (action === "club-new-tournament-preset"){ ui.editingClubTournamentPreset = {}; render(); }
  else if (action === "club-edit-tournament-preset"){ ui.editingClubTournamentPreset = Object.assign({}, clubPresetList("tournament", ui.currentClubId).find(p => p.id === btn.dataset.id)); render(); }
  else if (action === "club-cancel-preset-edit"){ ui.editingClubMatchPreset = null; ui.editingClubTournamentPreset = null; render(); }
});

document.addEventListener("submit", (e) => {
  // getAttribute, not .id: the preset forms contain a hidden <input name="id">,
  // which shadows the form's own `id` property (form.id would be that input),
  // so the dispatch below never matched and the browser did a native GET
  // submit -- reloading the page and saving nothing.
  const id = e.target.getAttribute("id");
  if (id === "match-setup-form") handleMatchSetupSubmit(e);
  else if (id === "opening-form") handleOpeningSubmit(e);
  else if (id === "new-batsman-form") handleNewBatsmanSubmit(e);
  else if (id === "new-bowler-form") handleNewBowlerSubmit(e);
  else if (id === "wicket-fielder-form") handleWicketFielderSubmit(e);
  else if (id === "motm-form") handleMotmSubmit(e);
  else if (id === "tournament-setup-form") handleTournamentSetupSubmit(e);
  else if (id === "tournament-start-match-form") handleTournamentStartMatchSubmit(e);
  else if (id === "new-team-form") handleNewTeamSubmit(e);
  else if (id === "add-player-form") handleAddPlayerSubmit(e);
  else if (id === "add-global-player-form") handleAddGlobalPlayerSubmit(e);
  else if (id === "match-preset-form") handleMatchPresetSubmit(e);
  else if (id === "tournament-preset-form") handleTournamentPresetSubmit(e);
  else if (id === "club-match-preset-form") handleClubMatchPresetSubmit(e);
  else if (id === "player-profile-form") handlePlayerProfileSubmit(e);
  else if (id === "club-tournament-preset-form") handleClubTournamentPresetSubmit(e);
  else if (id === "sign-in-form") handleSignInSubmit(e);
  else if (id === "sign-up-form") handleSignUpSubmit(e);
  else if (id === "create-club-form") handleCreateClubSubmit(e);
  else if (id === "club-add-player-form") handleClubAddPlayerSubmit(e);
  else if (id === "club-invite-admin-form") handleClubInviteAdminSubmit(e);
  else if (id === "club-tournament-setup-form") handleClubTournamentSetupSubmit(e);
  else if (id === "tournament-team-form") handleTournamentTeamSubmit(e);
  else if (id === "claim-request-form") handleClaimRequestSubmit(e);
  else if (id === "merge-request-form") handleMergeRequestSubmit(e);
});

/* The only delegated `input` listener: live "already on the platform"
   suggestions for the club add-player sheet's name field. Debounced, needs
   2+ characters, and drops stale responses (suggestSeq) so a slow early
   query can't overwrite a newer one. */
let suggestTimer = null, suggestSeq = 0;
document.addEventListener("input", (e) => {
  const form = e.target.closest && e.target.closest("#club-add-player-form");
  if (!form || e.target.name !== "name" || !supabaseClient) return;
  const box = form.querySelector(".platform-suggest");
  const query = e.target.value;
  clearTimeout(suggestTimer);
  if (query.trim().length < 2){ suggestSeq++; box.hidden = true; box.innerHTML = ""; return; }
  suggestTimer = setTimeout(() => {
    const seq = ++suggestSeq;
    searchPlatformPlayers(query).then(players => {
      if (seq !== suggestSeq || !box.isConnected) return;
      box.innerHTML = platformSuggestHtml(query, players);
      box.hidden = !players.length;
    });
  }, 250);
});

document.addEventListener("change", (e) => {
  // Mirror the tournament-team form into ui so a background re-render (e.g.
  // the roster finishing loading) doesn't drop half-made picks.
  if (e.target.closest && e.target.closest("#tournament-team-form") && ui.tournamentTeamEdit){
    if (e.target.name === "teamName") ui.tournamentTeamEdit.name = e.target.value;
    else if (e.target.name === "teamPlayerIds"){
      const ids = ui.tournamentTeamEdit.playerIds, id = e.target.value;
      ui.tournamentTeamEdit.playerIds = e.target.checked ? (ids.includes(id) ? ids : [...ids, id]) : ids.filter(x => x !== id);
    }
    return;
  }
  if (e.target.name === "teamIds"){
    const id = e.target.value;
    if (e.target.checked){ if (!ui.tournamentSetupTeamIds.includes(id)) ui.tournamentSetupTeamIds.push(id); }
    else { ui.tournamentSetupTeamIds = ui.tournamentSetupTeamIds.filter(x => x !== id); }
  }
  else if (e.target.classList.contains("photo-file-input")){
    // DOM-only update (no re-render) so anything already typed in the form survives.
    const file = e.target.files && e.target.files[0];
    const field = e.target.closest(".photo-field");
    if (!file || !field) return;
    const form = field.closest("form");
    resizeImageToDataUrl(file).then(dataUrl => {
      field.querySelector('input[name="photo"]').value = dataUrl;
      const preview = field.querySelector(".photo-preview");
      if (preview) preview.outerHTML = `<img class="profile-photo photo-preview" src="${dataUrl}" alt="">`;
      showFormError(form, "");
    }).catch(err => showFormError(form, err.message));
  }
  else if (e.target.id === "home-club-switcher"){
    const v = e.target.value;
    if (v === "__premier__"){
      state.view = "premier"; save(); render();
      fetchPremierData().then(render);
    } else { state.activeClubId = v || null; save(); render(); }
  }
});

load();
render();
initAuth();

if ("serviceWorker" in navigator){
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
