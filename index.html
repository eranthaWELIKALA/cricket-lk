<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A1B4A">
<title>Cricket.lk — Ball-by-ball Scorer</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon-32.png" sizes="32x32">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="top-progress" class="top-progress" aria-hidden="true"></div>
<div id="busy-status" class="sr-only" role="status" aria-live="polite"></div>
<!-- Launch splash: plain HTML so it paints before any script runs; boot.js fades it out. -->
<div id="splash" class="splash" aria-hidden="true">
  <div class="splash-main">
    <img src="icon-192.png" alt="" class="splash-icon">
    <div class="splash-name"><span class="brand-highlight">Cricket.lk</span></div>
    <div class="splash-tag">Ball-by-ball scorer</div>
    <div class="splash-loader" role="progressbar" aria-label="Loading"><span></span></div>
  </div>
  <div class="splash-footer">by Erantha Welikala</div>
</div>
<!-- Print-only branding for Export PDF (hidden on screen; see exportPdf). -->
<header id="print-brand" class="print-only" aria-hidden="true">
  <img src="icon-192.png" alt="">
  <div class="print-brand-name"><b>Cricket.lk</b><span>Ball-by-ball scorer</span></div>
  <span class="print-brand-title"></span>
</header>
<div id="app"></div>
<div id="print-root" aria-hidden="true"></div>
<footer id="print-foot" class="print-only" aria-hidden="true">
  <img src="icon-192.png" alt=""><span><b>Scored with Cricket.lk</b> · by Erantha Welikala</span><span class="print-foot-date"></span>
</footer>
<div id="modal-root"></div>
<div id="confirm-root"></div>
<div id="install-banner" class="install-banner" role="region" aria-label="Install app" hidden>
  <img src="icon-192.png" alt="">
  <div class="install-banner-text"><strong></strong><span></span></div>
  <button type="button" class="install-banner-go" hidden>Install</button>
  <button type="button" class="install-banner-close" aria-label="Dismiss">✕</button>
</div>
<!-- Scripts run in this order and share one global scope; see CLAUDE.md "Code layout". -->
<script src="js/reference-data.js"></script>
<script src="js/engine.js"></script>
<script src="js/storage.js"></script>
<script src="js/cloud.js"></script>
<script src="js/ui/state.js"></script>
<script src="js/ui/common.js"></script>
<script src="js/ui/chrome.js"></script>
<script src="js/ui/router.js"></script>
<script src="js/ui/menus.js"></script>
<script src="js/ui/screens/home-account.js"></script>
<script src="js/ui/screens/clubs.js"></script>
<script src="js/ui/screens/club-tournaments.js"></script>
<script src="js/ui/screens/premier.js"></script>
<script src="js/ui/match/setup.js"></script>
<script src="js/ui/match/sheets.js"></script>
<script src="js/ui/match/catch-up.js"></script>
<script src="js/ui/match/edit-ball.js"></script>
<script src="js/ui/match/name-later.js"></script>
<script src="js/ui/match/live.js"></script>
<script src="js/ui/match/result.js"></script>
<script src="js/ui/screens/guest.js"></script>
<script src="js/ui/screens/stats.js"></script>
<script src="js/ui/render.js"></script>
<script src="js/ui/events.js"></script>
<script src="js/boot.js"></script>
<script src="js/install-prompt.js"></script>
</body>
</html>
