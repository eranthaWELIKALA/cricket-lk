<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0D3D2E">
<meta name="robots" content="noindex">
<title>Voice test · Cricket.lk</title>
<link rel="icon" href="favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root{
    --bg:#07120E; --panel:#102620; --panel-2:#15302A; --line:rgba(255,255,255,.1); --line-strong:rgba(255,255,255,.2);
    --text:#EEF5F1; --muted:#9DB8AB; --accent:#FFC145; --accent-ink:#1E1500; --green:#34D399; --green-ink:#04130D;
    --red:#FF5C72; --red-ink:#2A0008; --radius:18px; --shadow:4px 4px 0 rgba(0,0,0,.45);
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg:#F4F8F5; --panel:#FFFFFF; --panel-2:#F1F6F3; --line:rgba(12,34,25,.1); --line-strong:rgba(12,34,25,.2);
      --text:#0C2219; --muted:#557566; --accent:#E5A800; --accent-ink:#241900; --green:#0E9F6E; --green-ink:#FFFFFF;
      --red:#D92D47; --red-ink:#FFFFFF; --shadow:4px 4px 0 rgba(12,34,25,.12);
    }
  }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--text); font:16px/1.5 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent; }
  .wrap{ max-width:560px; margin:0 auto; padding:0 16px; }
  button, select, textarea{ font:inherit; color:inherit; }
  button{ cursor:pointer; }

  .bar{ border-bottom:1px solid var(--line); }
  .bar .wrap{ display:flex; align-items:center; gap:10px; height:60px; }
  .bar img{ width:32px; height:32px; border-radius:9px; }
  .bar a{ margin-left:auto; color:var(--green); font-weight:700; text-decoration:none; font-size:.9rem; }

  h1{ font-size:2rem; line-height:1.1; margin:24px 0 8px; letter-spacing:-.02em; }
  .intro{ color:var(--muted); margin:0 0 18px; }
  .card{ background:var(--panel); border:2px solid var(--line-strong); border-radius:var(--radius); box-shadow:var(--shadow); padding:16px; margin-bottom:16px; }
  .label{ font-size:.72rem; font-weight:800; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); margin:0 0 6px; }
  .hint{ color:var(--muted); font-size:.85rem; margin:6px 0 0; }

  .status{ margin:0 0 14px; font-weight:600; }
  .status.bad{ color:var(--red); }
  .row{ display:flex; gap:10px; align-items:center; justify-content:space-between; }
  select{ background:var(--panel-2); border:2px solid var(--line-strong); border-radius:12px; padding:8px 10px; }
  details{ margin-top:14px; border-top:1px solid var(--line); padding-top:12px; }
  summary{ font-weight:700; cursor:pointer; }
  summary span{ color:var(--muted); font-weight:600; }
  textarea{ width:100%; margin-top:10px; background:var(--panel-2); border:2px solid var(--line-strong); border-radius:12px; padding:10px; resize:vertical; }

  .tabs{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:16px; }
  .tabs button{ background:var(--panel); border:2px solid var(--line-strong); border-radius:12px; padding:10px; font-weight:800; }
  .tabs button[aria-selected="true"]{ background:var(--green); color:var(--green-ink); border-color:var(--green); }

  .say{ font-size:1.9rem; font-weight:900; line-height:1.15; margin:0 0 6px; overflow-wrap:anywhere; }
  .expect{ color:var(--muted); margin:0 0 16px; }
  .mic{ width:100%; display:flex; align-items:center; justify-content:center; gap:10px; min-height:76px; border-radius:16px; border:2px solid var(--bg); background:var(--accent); color:var(--accent-ink); font-size:1.15rem; font-weight:900; box-shadow:var(--shadow); }
  .mic svg{ width:26px; height:26px; flex-shrink:0; }
  .mic:active{ transform:translate(2px, 2px); box-shadow:2px 2px 0 rgba(0,0,0,.45); }
  .mic.on{ background:var(--red); color:var(--red-ink); animation:pulse 1.2s ease-in-out infinite; }
  .mic:disabled{ opacity:.45; cursor:not-allowed; }
  @keyframes pulse{ 50%{ box-shadow:0 0 0 8px color-mix(in srgb, var(--red) 25%, transparent); } }
  @media (prefers-reduced-motion: reduce){ .mic.on{ animation:none; } }

  .heard{ margin-top:14px; }
  .heard:empty{ display:none; }
  .result{ border:2px solid var(--line-strong); border-radius:14px; padding:12px 14px; background:var(--panel-2); }
  .result.ok{ border-color:var(--green); }
  .result.bad{ border-color:var(--red); }
  .verdict{ font-weight:900; margin:0 0 6px; }
  .result.ok .verdict{ color:var(--green); }
  .result.bad .verdict{ color:var(--red); }
  .result dl{ display:grid; grid-template-columns:auto 1fr; gap:2px 12px; margin:0; }
  .result dt{ color:var(--muted); }
  .result dd{ margin:0; font-weight:700; overflow-wrap:anywhere; }
  .live{ color:var(--muted); font-style:italic; overflow-wrap:anywhere; }
  .error{ color:var(--red); font-weight:700; }

  .nav{ display:flex; gap:10px; margin-top:14px; }
  .nav:empty{ display:none; }
  .btn{ flex:1; min-height:48px; border-radius:12px; border:2px solid var(--line-strong); background:var(--panel-2); font-weight:800; }
  .btn.primary{ background:var(--green); color:var(--green-ink); border-color:var(--green); }

  .score{ font-size:1.15rem; font-weight:800; margin:0 0 10px; }
  .log{ list-style:none; margin:0; padding:0; }
  .log li{ display:grid; grid-template-columns:22px 1fr; gap:8px; padding:9px 0; border-top:1px solid var(--line); font-size:.92rem; }
  .log li:first-child{ border-top:0; }
  .log .mark{ font-weight:900; }
  .log .ok .mark{ color:var(--green); }
  .log .bad .mark{ color:var(--red); }
  .log .free .mark{ color:var(--muted); }
  .log small{ display:block; color:var(--muted); overflow-wrap:anywhere; }
  [hidden]{ display:none !important; }
</style>
</head>
<body>
<header class="bar"><div class="wrap"><img src="icon-192.png" alt=""><b>Cricket.lk</b><a href="./">Open the app</a></div></header>

<main class="wrap">
  <h1>Voice test</h1>
  <p class="intro">Read each line out loud. You'll see what your phone heard and what Cricket.lk would make of it. Nothing is scored or saved. When you finish, share the results.</p>

  <section class="card">
    <p class="status" id="support"></p>
    <div class="row">
      <label for="lang"><b>Accent</b></label>
      <select id="lang">
        <option value="en-IN">English (India)</option>
        <option value="en-GB">English (UK)</option>
        <option value="en-US">English (US)</option>
      </select>
    </div>
    <details>
      <summary>Players <span id="players-count"></span></summary>
      <textarea id="players" rows="8" spellcheck="false" autocapitalize="words"></textarea>
      <p class="hint">One name per line. Put in your own team; the test reads these names.</p>
    </details>
  </section>

  <div class="tabs" role="tablist">
    <button type="button" role="tab" data-mode="guided" aria-selected="true">Guided test</button>
    <button type="button" role="tab" data-mode="free" aria-selected="false">Say anything</button>
  </div>

  <section class="card">
    <p class="label" id="progress"></p>
    <p class="say" id="say"></p>
    <p class="expect" id="expect"></p>
    <button type="button" class="mic" id="mic">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
      <span id="mic-label">Tap and speak</span>
    </button>
    <div class="heard" id="heard" aria-live="polite"></div>
    <div class="nav" id="nav"></div>
  </section>

  <section class="card" id="results" hidden>
    <p class="label">Results</p>
    <p class="score" id="score"></p>
    <ol class="log" id="log"></ol>
    <div class="nav">
      <button type="button" class="btn primary" id="share">Share results</button>
      <button type="button" class="btn" id="copy">Copy</button>
    </div>
  </section>
</main>

<script>
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const PREFS_KEY = "cricket.lk.voicetest.v1";
const DEFAULT_PLAYERS = [
  "Kusal Mendis", "Wanindu Hasaranga", "Pathum Nissanka", "Kamindu Mendis", "Charith Asalanka",
  "Dunith Wellalage", "Maheesh Theekshana", "Matheesha Pathirana", "Dasun Shanaka", "Dilshan Madushanka",
];

// ---------- understanding what was said (pure) ----------

const NUMBER_WORDS = {
  zero: 0, nought: 0, nil: 0, dot: 0, nothing: 0,
  one: 1, won: 1, single: 1, two: 2, to: 2, too: 2, three: 3, tree: 3,
  four: 4, for: 4, fore: 4, boundary: 4, five: 5, six: 6, sixer: 6, maximum: 6, seven: 7,
};
const ZERO_PHRASES = ["dot ball", "no run", "no runs"];
const DISMISSALS = [
  ["runout", ["run out", "runout", "ran out", "run outs"]],
  ["hitwicket", ["hit wicket", "hit the wicket", "hit wickets"]],
  ["lbw", ["lbw", "l b w", "lb w", "l bw", "elbow", "leg before wicket", "leg before"]],
  ["stumped", ["stumped", "stumping", "stump", "stomped"]],
  ["caught", ["caught", "court", "cought", "cot", "catch"]],
  ["bowled", ["bowled", "bold", "bolt"]],
  ["out", ["wicket", "out", "howzat", "hows that", "gone"]],
];
const EXTRAS = [
  ["noball", ["no ball", "no balls", "noball", "know ball", "no bowl", "nobel"]],
  ["legbye", ["leg bye", "leg byes", "leg by", "leg buy", "legbye", "leg bi", "lag by"]],
  ["wide", ["wide", "wides", "white", "wade", "whyd"]],
  ["bye", ["bye", "byes", "by", "buy"]],
];
const FILLER = new Set(("and the a an ball balls run runs ran is was he she its it that so off of on plus extra extras " +
  "then with um uh ok okay yeah out wicket bowler batter batsman fielder went goes go").split(" "));

function words(text){
  return String(text).toLowerCase().replace(/['’]/g, "").replace(/[^a-z0-9]+/g, " ").trim().split(" ").filter(Boolean);
}

// Marks the first unused run of tokens spelling `phrase`; returns { start, end } or null.
function take(tokens, phrase){
  const p = phrase.split(" ");
  for (let i = 0; i + p.length <= tokens.length; i++){
    if (p.every((w, j) => !tokens[i + j].used && tokens[i + j].w === w)){
      for (let j = 0; j < p.length; j++) tokens[i + j].used = true;
      return { start: i, end: i + p.length - 1 };
    }
  }
  return null;
}

function takeFirst(tokens, table){
  for (const [kind, phrases] of table){
    for (const phrase of phrases){
      const at = take(tokens, phrase);
      if (at) return { kind, ...at };
    }
  }
  return null;
}

function takeNumber(tokens){
  for (const phrase of ZERO_PHRASES) if (take(tokens, phrase)) return 0;
  for (const t of tokens){
    if (t.used) continue;
    const n = /^\d+$/.test(t.w) ? Number(t.w) : NUMBER_WORDS[t.w];
    if (n != null && n <= 7){ t.used = true; return n; }
  }
  return null;
}

// Unused tokens grouped into runs ("by" also splits: "caught by X"), filler trimmed off the ends.
// Filler inside a run stays: a name can come back as "well a large".
function nameSpans(tokens){
  const runs = [];
  let cur = null;
  tokens.forEach((t, i) => {
    if (t.used || t.w === "by"){ cur = null; return; }
    if (!cur){ cur = []; runs.push(cur); }
    cur.push({ w: t.w, i });
  });
  return runs.map(r => {
    while (r.length && FILLER.has(r[0].w)) r.shift();
    while (r.length && FILLER.has(r[r.length - 1].w)) r.pop();
    return r.length ? { start: r[0].i, end: r[r.length - 1].i, words: r.map(x => x.w) } : null;
  }).filter(Boolean);
}

// A rough "sounds like" key, so a misheard spelling still lands on the name.
function phon(s){
  return s.toLowerCase().replace(/[^a-z]/g, "")
    .replace(/ph/g, "f").replace(/ck/g, "k").replace(/q/g, "k").replace(/x/g, "ks")
    .replace(/c(?=[eiy])/g, "s").replace(/c/g, "k")
    .replace(/([bdgkpst])h/g, "$1")
    .replace(/w/g, "v").replace(/z/g, "s")
    .replace(/ee|ea|ie|y/g, "i").replace(/oo|ou/g, "u")
    .replace(/(.)\1+/g, "$1")
    .replace(/er$/, "a");
}

function editDistance(a, b){
  let prev = Array.from({ length: b.length + 1 }, (_, j) => j);
  for (let i = 1; i <= a.length; i++){
    const cur = [i];
    for (let j = 1; j <= b.length; j++){
      cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    }
    prev = cur;
  }
  return prev[b.length];
}

function similarity(a, b){
  const pa = phon(a), pb = phon(b);
  if (!pa || !pb) return 0;
  return 1 - editDistance(pa, pb) / Math.max(pa.length, pb.length);
}

// Best roster match for some spoken words: { name } / { ambiguous: [..] } / { heard } (no match).
function matchName(spoken, roster){
  const full = spoken.join("");
  const windows = [];
  for (let len = 1; len <= Math.min(4, spoken.length); len++){
    for (let i = 0; i + len <= spoken.length; i++) windows.push(spoken.slice(i, i + len).join(""));
  }
  const scored = roster.map(name => {
    const parts = words(name);
    const forms = [parts.join(""), ...parts];
    let score = 0;
    for (const w of windows){
      const coverage = 0.15 * (1 - w.length / full.length);  // matching only part of what was said counts for less
      for (const f of forms) score = Math.max(score, similarity(w, f) - coverage);
    }
    return { name, score };
  }).sort((x, y) => y.score - x.score);
  if (!scored.length || scored[0].score < 0.72) return { heard: spoken.join(" ") };
  const tied = scored.filter(s => scored[0].score - s.score < 0.04);
  return tied.length > 1 ? { ambiguous: tied.map(s => s.name) } : { name: scored[0].name };
}

function understand(text, roster){
  const tokens = words(text).map(w => ({ w, used: false }));
  if (!tokens.length) return null;

  const out = takeFirst(tokens, DISMISSALS);
  if (out){
    const spans = nameSpans(tokens);
    const before = spans.filter(s => s.end < out.start);
    const after = spans.filter(s => s.start > out.end);
    const pick = s => s && matchName(s.words, roster);
    const ev = { kind: "wicket", type: out.kind };
    let batter = before[before.length - 1];
    let fielder = null;
    if (out.kind === "caught" || out.kind === "stumped"){
      fielder = after[0];
    } else if (out.kind === "runout"){
      if (batter) fielder = after[0];
      else { batter = after[0]; fielder = after[1]; }
    } else if (!batter){
      batter = after[0];
    }
    if (batter) ev.batter = pick(batter);
    if (fielder) ev.fielder = pick(fielder);
    return ev;
  }

  const extra = takeFirst(tokens, EXTRAS);
  const runs = takeNumber(tokens);
  if (extra) return { kind: extra.kind, runs: runs ?? (extra.kind === "bye" || extra.kind === "legbye" ? 1 : 0) };
  if (runs != null) return { kind: "runs", runs };

  const spoken = nameSpans(tokens).flatMap(s => s.words);
  if (!spoken.length) return null;
  const who = matchName(spoken, roster);
  return who.heard ? null : { kind: "name", who };
}

const NAME_KEYS = ["batter", "fielder", "who"];

function matches(expect, got){
  if (!got) return false;
  return Object.keys(expect).every(k =>
    NAME_KEYS.includes(k) ? got[k] && got[k].name === expect[k] : got[k] === expect[k]);
}

const TYPE_LABELS = { bowled: "bowled", caught: "caught", lbw: "LBW", runout: "run out", stumped: "stumped", hitwicket: "hit wicket", out: "how not said" };

function nameText(v){
  if (v.name) return v.name;
  if (v.ambiguous) return v.ambiguous.join(" or ") + "?";
  return `“${v.heard}” (no such player)`;
}

function describe(ev){
  if (!ev) return "Didn't understand";
  switch (ev.kind){
    case "runs": return ev.runs === 0 ? "Dot ball" : ev.runs === 1 ? "1 run" : `${ev.runs} runs`;
    case "wide": return ev.runs ? `Wide + ${ev.runs}` : "Wide";
    case "noball": return ev.runs ? `No ball + ${ev.runs}` : "No ball";
    case "bye": return `Bye · ${ev.runs}`;
    case "legbye": return `Leg bye · ${ev.runs}`;
    case "name": return `Player: ${nameText(ev.who)}`;
    case "wicket": return [`Wicket · ${TYPE_LABELS[ev.type]}`,
      ev.batter && `out: ${nameText(ev.batter)}`,
      ev.fielder && `fielder: ${nameText(ev.fielder)}`].filter(Boolean).join(" · ");
  }
  return "?";
}

function describeExpected(expect){
  const ev = { ...expect };
  NAME_KEYS.forEach(k => { if (ev[k]) ev[k] = { name: ev[k] }; });
  return describe(ev);
}

// Surname, or the full name when another player shares it.
function spokenName(name, roster){
  const last = words(name).pop();
  return roster.filter(n => words(n).pop() === last).length > 1 ? name : name.split(/\s+/).pop();
}

function buildPrompts(roster){
  const list = [
    { say: "four", expect: { kind: "runs", runs: 4 } },
    { say: "two", expect: { kind: "runs", runs: 2 } },
    { say: "one", expect: { kind: "runs", runs: 1 } },
    { say: "six", expect: { kind: "runs", runs: 6 } },
    { say: "dot ball", expect: { kind: "runs", runs: 0 } },
    { say: "wide", expect: { kind: "wide", runs: 0 } },
    { say: "wide, two runs", expect: { kind: "wide", runs: 2 } },
    { say: "no ball, four", expect: { kind: "noball", runs: 4 } },
    { say: "leg bye, one", expect: { kind: "legbye", runs: 1 } },
    { say: "bowled", expect: { kind: "wicket", type: "bowled" } },
    { say: "LBW", expect: { kind: "wicket", type: "lbw" } },
  ];
  const r = roster, say = n => spokenName(n, roster);
  if (r.length >= 2) list.push({ say: `${say(r[0])} caught ${say(r[1])}`, expect: { kind: "wicket", type: "caught", batter: r[0], fielder: r[1] } });
  if (r.length >= 3) list.push({ say: `run out ${say(r[2])}`, expect: { kind: "wicket", type: "runout", batter: r[2] } });
  r.slice(3).concat(r.slice(0, 3)).slice(0, 4).forEach(n =>
    list.push({ say: say(n), expect: { kind: "name", who: n }, note: "as if picking the next bowler" }));
  return list;
}

// ---------- page ----------

const $ = id => document.getElementById(id);
let mode = "guided";
let prompts = [];
let idx = 0;
let attempts = [];
let rec = null;
let session = null;

function loadPrefs(){ try { return JSON.parse(localStorage.getItem(PREFS_KEY)) || {}; } catch (e){ return {}; } }
function savePrefs(){
  try { localStorage.setItem(PREFS_KEY, JSON.stringify({ lang: $("lang").value, players: $("players").value })); } catch (e){}
}

function roster(){
  const seen = new Set();
  return $("players").value.split("\n").map(s => s.replace(/\s+/g, " ").trim())
    .filter(s => s && !seen.has(s.toLowerCase()) && seen.add(s.toLowerCase()));
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function deviceLabel(){
  const ua = navigator.userAgent;
  const ios = ua.match(/OS (\d+)_\d+.* like Mac OS X/);
  const android = ua.match(/Android (\d+)/);
  const os = ios ? `iPhone (iOS ${ios[1]})` : android ? `Android ${android[1]}` : /Mac/.test(ua) ? "Mac" : /Windows/.test(ua) ? "Windows" : "Other";
  const browser = /CriOS/.test(ua) ? "Chrome" : /FxiOS|Firefox/.test(ua) ? "Firefox" : /EdgA|EdgiOS|Edg\//.test(ua) ? "Edge"
    : /SamsungBrowser/.test(ua) ? "Samsung Internet" : /Chrome\//.test(ua) ? "Chrome" : /Safari\//.test(ua) ? "Safari" : "other browser";
  const app = matchMedia("(display-mode: standalone)").matches || navigator.standalone ? ", home-screen app" : "";
  return `${os} · ${browser}${app}`;
}

const ERRORS = {
  "not-allowed": "The microphone is blocked. Allow it for this site in the browser's settings, then try again.",
  "service-not-allowed": "Speech is turned off on this phone. On iPhone, turn on Dictation (Settings → General → Keyboard).",
  "no-speech": "Didn't hear anything. Try again, a little closer to the phone.",
  "audio-capture": "No microphone found.",
  "network": "Couldn't reach the speech service. Check the signal and try again.",
  "language-not-supported": "This accent isn't available on this phone. Pick another one above.",
  "start-failed": "The microphone didn't start. Try again.",
};

function setMic(on){
  $("mic").classList.toggle("on", on);
  $("mic-label").textContent = on ? "Listening… tap to stop" : "Tap and speak";
}

function startListening(){
  const r = new SR();
  r.lang = $("lang").value;
  r.interimResults = true;
  r.maxAlternatives = 3;
  r.continuous = false;
  const s = { alts: null, interim: "", t0: performance.now(), tSpeechEnd: 0, tStop: 0, tInterim: 0, tFinal: 0, error: null };
  r.onresult = e => {
    const last = e.results[e.results.length - 1];
    const text = Array.from(e.results, x => x[0].transcript).join(" ").replace(/\s+/g, " ").trim();
    if (last.isFinal){
      s.tFinal = performance.now();
      s.alts = e.results.length === 1 ? Array.from(last, a => a.transcript.trim()).filter(Boolean) : [text];
    } else {
      s.interim = text;
      s.tInterim = performance.now();
      $("heard").innerHTML = `<p class="live">${escapeHtml(text)}…</p>`;
    }
  };
  r.onspeechend = () => { s.tSpeechEnd = performance.now(); };
  r.onerror = e => { s.error = e.error; };
  r.onend = () => {
    clearTimeout(s.timer);
    rec = session = null;
    setMic(false);
    finish(s);
  };
  try { r.start(); } catch (e){ showError("start-failed"); return; }
  s.timer = setTimeout(() => stopListening(), 10000);
  rec = r;
  session = s;
  setMic(true);
  $("heard").innerHTML = `<p class="live">Listening…</p>`;
}

function stopListening(){
  if (!rec) return;
  session.tStop = performance.now();
  try { rec.stop(); } catch (e){}
}

// How long the answer took after the speaker stopped (talking, or tapped stop).
function waitSeconds(s){
  if (!s.tFinal) return null;
  const marks = [s.tSpeechEnd, s.tStop].filter(t => t && t <= s.tFinal);
  const from = marks.length ? Math.max(...marks) : (s.tInterim || s.t0);
  return Math.max(0, (s.tFinal - from) / 1000);
}

function finish(s){
  if (!s.alts && s.interim) s.alts = [s.interim];
  if (!s.alts || !s.alts.length){
    if (s.error !== "aborted") showError(s.error || "no-speech");
    return;
  }
  const players = roster();
  const parses = s.alts.map(a => understand(a, players));
  const pick = Math.max(0, parses.findIndex(Boolean));
  const a = { mode, heard: s.alts[pick], alts: s.alts.filter((_, i) => i !== pick), got: parses[pick], wait: waitSeconds(s) };
  const p = mode === "guided" ? prompts[idx] : null;
  if (p){
    Object.assign(a, { idx, say: p.say, expect: p.expect, ok: matches(p.expect, a.got) });
    a.altOk = !a.ok && parses.some(x => matches(p.expect, x));
  }
  attempts.push(a);
  showAttempt(a);
  renderNav();
  renderResults();
}

function showError(code){
  $("heard").innerHTML = `<p class="error">${escapeHtml(ERRORS[code] || `Something went wrong (${code}). Try again.`)}</p>`;
}

function showAttempt(a){
  const verdict = a.expect == null ? "" : a.ok ? `<p class="verdict">✓ Right</p>`
    : `<p class="verdict">✗ Not quite${a.altOk ? " (one of the other guesses was right)" : ""}</p>`;
  $("heard").innerHTML = `
    <div class="result ${a.expect == null ? "" : a.ok ? "ok" : "bad"}">
      ${verdict}
      <dl>
        <dt>Heard</dt><dd>“${escapeHtml(a.heard)}”</dd>
        ${a.alts.length ? `<dt>Or</dt><dd>${a.alts.map(x => `“${escapeHtml(x)}”`).join(" · ")}</dd>` : ""}
        <dt>Means</dt><dd>${escapeHtml(describe(a.got))}</dd>
        ${a.wait != null ? `<dt>Wait</dt><dd>${a.wait.toFixed(1)} s</dd>` : ""}
      </dl>
    </div>`;
}

function renderStage(){
  document.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.mode === mode)));
  const done = mode === "guided" && idx >= prompts.length;
  if (mode === "free"){
    $("progress").textContent = "Say anything";
    $("say").textContent = "A ball, a wicket or a name";
    $("expect").textContent = "For example “wide, ran two” or “Mendis caught Hasaranga”.";
  } else if (done){
    $("progress").textContent = "All done";
    $("say").textContent = scoreText();
    $("expect").textContent = "Share the results below so we can see how your phone did.";
  } else {
    const p = prompts[idx];
    $("progress").textContent = `Line ${idx + 1} of ${prompts.length}`;
    $("say").textContent = `“${p.say}”`;
    $("expect").textContent = `Should give: ${describeExpected(p.expect)}${p.note ? ` (${p.note})` : ""}`;
  }
  $("mic").hidden = done;
  $("heard").innerHTML = "";
  renderNav();
}

function renderNav(){
  const nav = $("nav");
  if (mode !== "guided"){ nav.innerHTML = ""; return; }
  if (idx >= prompts.length){
    nav.innerHTML = `<button type="button" class="btn" data-nav="restart">Start over</button>`;
    return;
  }
  const tried = attempts.some(a => a.mode === "guided" && a.idx === idx);
  nav.innerHTML = `<button type="button" class="btn ${tried ? "primary" : ""}" data-nav="next">${tried ? "Next →" : "Skip"}</button>`;
}

function firstTries(){
  const seen = new Map();
  attempts.forEach(a => { if (a.mode === "guided" && !seen.has(a.idx)) seen.set(a.idx, a); });
  return [...seen.values()];
}

function scoreText(){
  const firsts = firstTries();
  if (!firsts.length) return "Nothing tried yet";
  return `${firsts.filter(a => a.ok).length} of ${firsts.length} right first time`;
}

function typicalWait(){
  const waits = attempts.map(a => a.wait).filter(w => w != null).sort((x, y) => x - y);
  return waits.length ? waits[Math.floor(waits.length / 2)] : null;
}

function renderResults(){
  $("results").hidden = !attempts.length;
  if (!attempts.length) return;
  const wait = typicalWait();
  $("score").textContent = scoreText() + (wait != null ? ` · usual wait ${wait.toFixed(1)} s` : "");
  $("log").innerHTML = attempts.slice().reverse().map(a => {
    const cls = a.expect == null ? "free" : a.ok ? "ok" : "bad";
    const mark = a.expect == null ? "•" : a.ok ? "✓" : "✗";
    const head = a.expect == null ? `“${escapeHtml(a.heard)}”` : `Line ${a.idx + 1}: “${escapeHtml(a.say)}”`;
    const heard = a.expect == null ? "" : `heard “${escapeHtml(a.heard)}” · `;
    return `<li class="${cls}"><span class="mark">${mark}</span><span>${head}
      <small>${heard}${escapeHtml(describe(a.got))}${a.wait != null ? ` · ${a.wait.toFixed(1)} s` : ""}</small></span></li>`;
  }).join("");
}

function resultsText(){
  const lang = $("lang").selectedOptions[0].textContent;
  const wait = typicalWait();
  const lines = [
    `Cricket.lk voice test · ${new Date().toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" })}`,
    `${deviceLabel()} · ${lang}`,
    scoreText() + (wait != null ? ` · usual wait ${wait.toFixed(1)} s` : ""),
    "",
  ];
  attempts.forEach(a => {
    const w = a.wait != null ? ` (${a.wait.toFixed(1)} s)` : "";
    const alts = a.alts.length ? ` [or ${a.alts.map(x => `"${x}"`).join(", ")}]` : "";
    if (a.expect == null) lines.push(`• heard "${a.heard}"${alts} → ${describe(a.got)}${w}`);
    else lines.push(`${a.ok ? "✓" : "✗"} ${a.idx + 1}. "${a.say}" → heard "${a.heard}"${alts}` +
      `${a.ok ? "" : ` → ${describe(a.got)}${a.altOk ? " (another guess was right)" : ""}`}${w}`);
  });
  return lines.join("\n");
}

async function copyText(text){
  try { await navigator.clipboard.writeText(text); return true; } catch (e){}
  const t = document.createElement("textarea");
  t.value = text;
  t.style.position = "fixed";
  t.style.opacity = "0";
  document.body.appendChild(t);
  t.select();
  let ok = false;
  try { ok = document.execCommand("copy"); } catch (e){}
  t.remove();
  return ok;
}

function flash(button, text){
  const old = button.textContent;
  button.textContent = text;
  setTimeout(() => { button.textContent = old; }, 1500);
}

function rebuildPrompts(){
  const players = roster();
  $("players-count").textContent = `· ${players.length}`;
  prompts = buildPrompts(players);
  if (!attempts.some(a => a.mode === "guided")) idx = 0;
  idx = Math.min(idx, prompts.length);
}

function init(){
  const prefs = loadPrefs();
  if (prefs.lang) $("lang").value = prefs.lang;
  $("players").value = prefs.players || DEFAULT_PLAYERS.join("\n");
  rebuildPrompts();

  const support = $("support");
  if (!window.isSecureContext){
    support.textContent = "Open this page over https:// — the microphone only works there.";
    support.classList.add("bad");
    $("mic").disabled = true;
  } else if (!SR){
    support.textContent = "This browser can't do speech. On Android use Chrome; on iPhone use Safari.";
    support.classList.add("bad");
    $("mic").disabled = true;
  } else {
    support.textContent = `Ready on ${deviceLabel()}. The first tap asks for the microphone.`;
  }

  $("mic").addEventListener("click", () => (rec ? stopListening() : startListening()));
  $("lang").addEventListener("change", savePrefs);
  $("players").addEventListener("change", () => { savePrefs(); rebuildPrompts(); renderStage(); });
  document.querySelector(".tabs").addEventListener("click", e => {
    const b = e.target.closest("button[data-mode]");
    if (!b || b.dataset.mode === mode) return;
    if (rec) stopListening();
    mode = b.dataset.mode;
    renderStage();
  });
  $("nav").addEventListener("click", e => {
    const b = e.target.closest("button[data-nav]");
    if (!b) return;
    if (b.dataset.nav === "next") idx++;
    if (b.dataset.nav === "restart"){
      if (!confirm("Clear these results and start again?")) return;
      attempts = [];
      idx = 0;
      renderResults();
    }
    renderStage();
  });
  $("share").hidden = !navigator.share;
  $("share").addEventListener("click", async () => {
    try { await navigator.share({ title: "Cricket.lk voice test", text: resultsText() }); } catch (e){}
  });
  $("copy").addEventListener("click", async e => flash(e.currentTarget, (await copyText(resultsText())) ? "Copied" : "Couldn't copy"));

  renderStage();
}

init();
</script>
</body>
</html>
